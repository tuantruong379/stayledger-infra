apiVersion: v1
kind: Namespace
metadata:
  name: stayledger-ai-assistant
  labels:
    app.kubernetes.io/managed-by: kubectl

---
# ResourceQuota: prevents a runaway pod from starving other workloads in the namespace.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: stayledger-ai-assistant-quota
  namespace: stayledger-ai-assistant
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "20"
    services: "10"
    persistentvolumeclaims: "5"

---
# LimitRange: ensures pods without explicit requests/limits still get sane defaults.
apiVersion: v1
kind: LimitRange
metadata:
  name: stayledger-ai-assistant-limits
  namespace: stayledger-ai-assistant
spec:
  limits:
  - type: Container
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "2"
      memory: "4Gi"
