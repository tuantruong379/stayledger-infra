apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nats-ingress
  namespace: hotel-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hotel-assistant-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hotel-assistant-metrics-aggregator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hotel-assistant-channel-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hotel-assistant-webhook-worker
      ports:
        - protocol: TCP
          port: 4222
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8222
