apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress-nats
  namespace: hotel-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hotel-assistant-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
