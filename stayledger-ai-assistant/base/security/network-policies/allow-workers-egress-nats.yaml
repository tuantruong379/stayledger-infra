apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workers-egress-nats
  namespace: stayledger-ai-assistant
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - hotel-assistant-channel-worker
          - hotel-assistant-webhook-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
