# Alembic Job uses HOTEL_OPS_DSN → PgBouncer (not direct postgres).
# DNS egress is covered by allow-egress-dns (namespace-wide).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alembic-egress
  namespace: stayledger-ai-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alembic-upgrade
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: pgbouncer
    ports:
    - protocol: TCP
      port: 5432
