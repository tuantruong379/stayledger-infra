# Allow API pods + workers to reach PgBouncer on port 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer-ingress
  namespace: stayledger-ai-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hotel-assistant-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hotel-assistant-channel-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hotel-assistant-webhook-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hotel-assistant-metrics-aggregator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres   # bootstrap job uses postgres SA
      ports:
        - protocol: TCP
          port: 5432
