# cert-manager ClusterIssuer for Let's Encrypt production. Apply once before
# ``ingress.yaml`` at repo root when TLS edge is re-enabled:
#
#   kubectl apply -f k8s/onprem/cert-manager-issuer.yaml
#
# Replace ``ops@example.com`` with the operator email that receives expiry /
# revocation notices from Let's Encrypt before applying.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: hotel-assistant
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: truonglamtuan@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
