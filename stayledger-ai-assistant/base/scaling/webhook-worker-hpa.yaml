# Horizontal Pod Autoscaler for the webhook worker (optional, when WEBHOOK_ASYNC_QUEUE=1).
# Pre-req: metrics-server installed in the cluster (kubectl top pods must work).
# Webhook worker processes buffered chat requests from Redis; scales independently from the API.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hotel-assistant-webhook-worker
  namespace: hotel-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-webhook-worker
    app.kubernetes.io/part-of: hotel-assistant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hotel-assistant-webhook-worker
  # Reasoning: webhook worker is CPU bound (LLM inference via Azure OpenAI).
  # Aggressive scaling needed to keep queue wait times low and improve customer perceived latency.
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Reasoning: set lower than API (65% vs 70%) because LLM inference is latency-sensitive.
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # Reasoning: aggressive on the way up — queue depth is the signal that work is backing up.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # Reasoning: gentle on the way down — restarting workers loses in-flight work + prompt cache (if enabled).
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
      selectPolicy: Min
