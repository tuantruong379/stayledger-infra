# Phase B3 — PodDisruptionBudgets.
#
# Goals:
#   - hotel-assistant-api (replicas=2) survives a single-pod eviction during node drain.
#   - postgres / redis are currently single-replica → block voluntary disruption.
#     This means `kubectl drain` will refuse to evict these pods until the operator
#     either temporarily deletes the PDB or scales up to a HA topology.
#
# Verify:
#   kubectl -n hotel-assistant get pdb

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hotel-assistant-api
  namespace: hotel-assistant
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hotel-assistant-api

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres
  namespace: hotel-assistant
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  namespace: hotel-assistant
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: redis

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hotel-assistant-frontend
  namespace: hotel-assistant
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hotel-assistant-frontend
