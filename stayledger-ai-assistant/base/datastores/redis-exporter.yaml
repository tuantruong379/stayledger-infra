# Redis exporter for infrastructure-level cache and pub/sub metrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: cache-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
        app.kubernetes.io/part-of: stayledger-ai-assistant
        app.kubernetes.io/component: cache-metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 59000
        runAsGroup: 59000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0
          args:
            - "--redis.addr=redis://redis:6379"
          ports:
            - name: metrics
              containerPort: 9121
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # /metrics triggers a live Redis INFO scrape; under load that can exceed 1s.
          # Historical restart loops (exit 0 / SIGTERM) matched kubelet liveness kills with
          # the previous timeoutSeconds default of 1 — align with postgres-exporter.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: cache-metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
  selector:
    app.kubernetes.io/name: redis-exporter
