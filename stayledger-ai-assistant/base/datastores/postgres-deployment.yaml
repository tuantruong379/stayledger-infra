apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    # Reasoning: single-replica local PV (RWO). RollingUpdate with maxSurge=0 acts like recreate
    # but keeps strategy explicit + consistent across workloads.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: stayledger-ai-assistant
        app.kubernetes.io/component: database
    spec:
      # Reasoning: Phase B7 — dedicated SA, no token automount.
      serviceAccountName: postgres-sa
      automountServiceAccountToken: false
      # Reasoning: Phase B5 — add non-root + seccomp; postgres image runs as uid/gid 999.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Reasoning: Phase B5 — chown initContainer removed; ``fsGroup`` + ``fsGroupChangePolicy: OnRootMismatch``
      # already coerces volume ownership to gid 999, and a root initContainer is incompatible with runAsNonRoot.
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          # Reasoning: Phase B5 — container-level hardening; postgres needs writable PVC + sockets/tmp via emptyDir.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Reasoning: performance tuning params injected via -c flags; avoids custom postgresql.conf file management.
          # Values sourced from postgres-tuning-configmap.yaml (sized for 4Gi limit, 2Gi effective).
          args:
            - "postgres"
            - "-c"
            - "shared_buffers=512MB"
            - "-c"
            - "effective_cache_size=1536MB"
            - "-c"
            - "work_mem=16MB"
            - "-c"
            - "maintenance_work_mem=128MB"
            - "-c"
            - "wal_level=replica"
            - "-c"
            - "max_wal_size=1GB"
            - "-c"
            - "min_wal_size=256MB"
            - "-c"
            - "checkpoint_completion_target=0.9"
            - "-c"
            - "wal_compression=on"
            - "-c"
            - "max_connections=100"
            - "-c"
            - "random_page_cost=1.1"
            - "-c"
            - "effective_io_concurrency=200"
            - "-c"
            - "log_min_duration_statement=500"
            - "-c"
            - "log_checkpoints=on"
            - "-c"
            - "log_lock_waits=on"
            - "-c"
            - "deadlock_timeout=1s"
            - "-c"
            - "autovacuum_vacuum_scale_factor=0.05"
            - "-c"
            - "autovacuum_analyze_scale_factor=0.02"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: hotel_ops
            - name: POSTGRES_NON_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_USER
            - name: POSTGRES_NON_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_PASSWORD
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
              ephemeral-storage: 64Mi
            limits:
              cpu: "4"
              memory: 4Gi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/init-hotel-ops.sh
              subPath: init-data.sh
            # Reasoning: Phase B5 — readOnlyRootFilesystem requires writable scratch for sockets + tmp.
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-init
          configMap:
            name: postgres-init
            defaultMode: 0744
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgres
