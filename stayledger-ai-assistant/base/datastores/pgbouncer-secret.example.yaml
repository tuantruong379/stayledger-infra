# Copy to pgbouncer-secret.yaml (gitignored), fill in real md5 hash, then apply.
#
# userlist.txt format: "<username>" "<md5 of password+username>"
# Generate md5:
#   echo -n "YOUR_POSTGRES_PASSWORDhotelassistant" | md5sum
#   Then prepend "md5" to the hash.
#
# Example for user "hotelassistant" with password "Y6En1FO6Sxx8":
#   echo -n "Y6En1FO6Sxx8hotelassistant" | md5sum  → e.g. abc123...
#   userlist entry: "hotelassistant" "md5abc123..."
#
# Apply: kubectl apply -f k8s/onprem/pgbouncer-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: pgbouncer-secret
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: database
type: Opaque
stringData:
  userlist.txt: |
    "hotelassistant" "md5REPLACE_WITH_MD5_OF_PASSWORD_PLUS_USERNAME"
