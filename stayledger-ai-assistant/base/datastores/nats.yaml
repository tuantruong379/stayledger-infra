# NATS for the optional real-time tenant metrics pipeline.
#
# The API publishes per-turn events to `metrics.chat.turn`; the metrics
# aggregator consumes them and materializes 1-minute rows into metrics_1m.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: hotel-assistant
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: hotel-assistant
    app.kubernetes.io/component: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: hotel-assistant
        app.kubernetes.io/component: messaging
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["--name", "hotel-assistant-nats", "--http_port", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: hotel-assistant
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: hotel-assistant
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
  selector:
    app.kubernetes.io/name: nats
