# Event-driven RAG evaluation worker. Jobs are enqueued after embedding or approval;
# there is intentionally no scheduled CronJob.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-rag-eval-worker
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-rag-eval-worker
    app.kubernetes.io/part-of: stayledger-ai-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hotel-assistant-rag-eval-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hotel-assistant-rag-eval-worker
        app.kubernetes.io/part-of: stayledger-ai-assistant
    spec:
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag-eval-worker
          image: putin111/ai-hotel-assistant:latest
          imagePullPolicy: IfNotPresent
          command: ["/venv/bin/python", "-m", "app.workers.rag_eval_worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: hotel-assistant-api-config
            - secretRef:
                name: hotel-assistant-api-secrets
          env:
            - name: RAG_EVAL_WORKER_POLL_SECONDS
              value: "5"
            - name: RAG_EVAL_WORKER_MAX_ATTEMPTS
              value: "3"
            # Must match production retrieval (rag_top_k() defaults to 5), or the
            # evaluation measures a context size guests never receive: at 1 the
            # metric named recall@5 is really recall@1, retrieval becomes
            # winner-take-all, and context_precision collapses onto {0, 0.5, 1.0}
            # because it is one section's score divided by two.
            - name: RAG_EVAL_TOP_K
              value: "5"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -d /proc/1"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
