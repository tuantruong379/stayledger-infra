# FlowNexa Admin — Next.js 15 frontend deployment + NodePort service.
#
# Build & push:
#   docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://hotel-assistant.tekcent.com \
#                -t putin111/hotel-assistant-frontend:<tag> frontend/
#   docker push putin111/hotel-assistant-frontend:<tag>
#
# Image tag is managed by kustomize (kustomization.yaml images: newTag).
# Apply:
#   kubectl apply -k k8s/onprem/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-frontend
  namespace: hotel-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-frontend
    app.kubernetes.io/part-of: hotel-assistant
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hotel-assistant-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hotel-assistant-frontend
        app.kubernetes.io/part-of: hotel-assistant
        app.kubernetes.io/component: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: hotel-assistant-frontend
      serviceAccountName: frontend-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Tag MUST be set via kustomization.yaml images[] — do not apply this file alone.
          image: putin111/hotel-assistant-frontend:nonprod-use-kustomize-only
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Next.js standalone writes to /tmp at runtime
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: hotel-assistant-frontend-config
            - secretRef:
                name: hotel-assistant-frontend-secrets
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "500m"
              memory: 512Mi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: hotel-assistant-frontend
  namespace: hotel-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-frontend
    app.kubernetes.io/part-of: hotel-assistant
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30081
  selector:
    app.kubernetes.io/name: hotel-assistant-frontend
