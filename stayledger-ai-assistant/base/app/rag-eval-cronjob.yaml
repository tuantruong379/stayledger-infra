# Nightly RAG evaluation: runs scripts/run_rag_eval.py (real retrieval + real generation +
# LLM-judge scoring against tests/evals/rag_judge/golden.jsonl) using the same app image and
# secrets as hotel-assistant-api — no ConfigMap-mounted script needed, the "script" is already
# a first-class Python entrypoint in the app image.
#
# Results persist to Postgres (rag_eval_runs/rag_eval_case_results); the API's /metrics/prom
# reads the latest run at scrape time (app/observability/prom_client.py:refresh_rag_eval_gauges),
# and alerting lives in observability/alerts/rag-eval-alerts.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rag-eval
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: rag-eval
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: ai-evaluation
spec:
  # 20:00 UTC = 03:00 Asia/Ho_Chi_Minh (UTC+7) — after the 02:00 pg_dump backup window.
  schedule: "0 20 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0 # a transient LLM/API blip should surface as a failed Job, not be masked by retry-then-succeed
      activeDeadlineSeconds: 2700
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rag-eval
            app.kubernetes.io/part-of: stayledger-ai-assistant
            app.kubernetes.io/component: ai-evaluation
        spec:
          restartPolicy: Never
          serviceAccountName: api-sa
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rag-eval
              image: putin111/ai-hotel-assistant:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "scripts/run_rag_eval.py"]
              env:
                - name: RAG_EVAL_JUDGE_MODEL
                  value: "azure/gpt-4o-mini"
                - name: RAG_EVAL_REQUIRE_REVIEWED
                  value: "1"
              envFrom:
                - configMapRef:
                    name: hotel-assistant-api-config
                - secretRef:
                    name: hotel-assistant-api-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "250m"
                  memory: "256Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
