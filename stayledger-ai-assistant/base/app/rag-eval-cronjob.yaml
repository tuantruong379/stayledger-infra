# Nightly RAG evaluation: runs scripts/run_rag_eval.py (real retrieval + real generation +
# LLM-judge scoring against tests/evals/rag_judge/golden.jsonl) using the same app image and
# secrets as hotel-assistant-api.
#
# Golden set: prefer image-baked tests/evals/rag_judge (Dockerfile COPY). Until that image is
# rolled, mount ConfigMap `rag-eval-golden` (keys: golden.jsonl, golden.review_status.json).
#
# Results persist to Postgres (rag_eval_runs/rag_eval_case_results); the API's /metrics/prom
# reads the latest run at scrape time (app/observability/prom_client.py:refresh_rag_eval_gauges),
# and alerting lives in observability/alerts/rag-eval-alerts.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rag-eval
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: rag-eval
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: ai-evaluation
spec:
  # 20:00 UTC = 03:00 Asia/Ho_Chi_Minh (UTC+7) — after the 02:00 pg_dump backup window.
  schedule: "0 20 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  # Missed schedules older than 10m are skipped (avoids burst catch-up after outages).
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 0 # a transient LLM/API blip should surface as a failed Job, not be masked by retry-then-succeed
      activeDeadlineSeconds: 2700
      # Keep finished Jobs long enough for triage, then prune so historical Failed noise decays.
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rag-eval
            app.kubernetes.io/part-of: stayledger-ai-assistant
            app.kubernetes.io/component: ai-evaluation
        spec:
          restartPolicy: Never
          serviceAccountName: api-sa
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rag-eval
              image: putin111/ai-hotel-assistant:latest
              imagePullPolicy: IfNotPresent
              command: ["/venv/bin/python", "scripts/run_rag_eval.py"]
              env:
                - name: RAG_EVAL_JUDGE_MODEL
                  value: "azure/gpt-5.4-mini"
                - name: RAG_EVAL_REQUIRE_REVIEWED
                  value: "1"
                - name: RAG_EVAL_REPORTS_DIR
                  value: "/tmp/rag_eval_reports"
              envFrom:
                - configMapRef:
                    name: hotel-assistant-api-config
                - secretRef:
                    name: hotel-assistant-api-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: golden
                  mountPath: /app/tests/evals/rag_judge
                  readOnly: true
                # Interim until image includes bootstrap + /tmp reports fix in scripts/run_rag_eval.py
                - name: script
                  mountPath: /app/scripts/run_rag_eval.py
                  subPath: run_rag_eval.py
                  readOnly: true
              resources:
                requests:
                  cpu: "100m"
                  memory: "192Mi"
                limits:
                  cpu: "500m"
                  memory: "768Mi"
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
            - name: golden
              configMap:
                name: rag-eval-golden
            - name: script
              configMap:
                name: rag-eval-script
