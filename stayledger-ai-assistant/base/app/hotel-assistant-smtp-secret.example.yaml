# Template — copy to hotel-assistant-smtp-secret.yaml (gitignored), fill REPLACE_ME, then:
#   kubectl apply -f k8s/onprem/hotel-assistant-smtp-secret.yaml
#
# Resource name must match Deployments: hotel-assistant-smtp-secrets
apiVersion: v1
kind: Secret
metadata:
  name: hotel-assistant-smtp-secrets
  namespace: hotel-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-api
    app.kubernetes.io/part-of: hotel-assistant
    app.kubernetes.io/component: smtp
type: Opaque
stringData:
  SMTP_USER: "REPLACE_ME"
  SMTP_PASSWORD: "REPLACE_ME"
