# Reasoning: optional Deployment when WEBHOOK_ASYNC_QUEUE=1 — runs ``python -m app.workers.webhook_worker`` (same image as API).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-webhook-worker
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-webhook-worker
    app.kubernetes.io/part-of: stayledger-ai-assistant
spec:
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hotel-assistant-webhook-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hotel-assistant-webhook-worker
        app.kubernetes.io/part-of: stayledger-ai-assistant
    spec:
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook-worker
          # Reasoning: Image tag is managed by kustomize (k8s/onprem/kustomization.yaml images: newTag).
          image: putin111/ai-hotel-assistant:3.0.11
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.webhook_worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: hotel-assistant-api-config
            - configMapRef:
                name: hotel-assistant-smtp-config
            - configMapRef:
                name: hotel-assistant-tenant-email-routing
            - secretRef:
                name: hotel-assistant-api-secrets
            - secretRef:
                name: hotel-assistant-smtp-secrets
          env:
            - name: WEBHOOK_ASYNC_QUEUE
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            exec:
              # Reasoning: slim runtime images may not include `ps`; /proc/1 exists while PID 1 is alive.
              command: ["sh", "-c", "test -d /proc/1"]
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -d /proc/1"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              # Reasoning: Ready only when Redis queue backend + Postgres are reachable (no LLM probe).
              command:
                [
                  "python",
                  "-c",
                  "from app.observability.health_checks import check_worker_readiness; import sys; sys.exit(0 if check_worker_readiness().get('ok') else 1)",
                ]
            initialDelaySeconds: 5
            periodSeconds: 10
            # Reasoning: Redis connect + Postgres ping can exceed 2s under load; probe must not false-fail.
            timeoutSeconds: 6
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
