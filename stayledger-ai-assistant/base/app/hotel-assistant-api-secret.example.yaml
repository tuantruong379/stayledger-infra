# Template — copy to hotel-assistant-api-secret.yaml (gitignored), fill REPLACE_ME / YOUR_* values, then apply.
#   cp k8s/onprem/hotel-assistant-api-secret.example.yaml k8s/onprem/hotel-assistant-api-secret.yaml
#   kubectl apply -f k8s/onprem/hotel-assistant-api-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: hotel-assistant-api-secrets
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-api
    app.kubernetes.io/part-of: stayledger-ai-assistant
type: Opaque
stringData:
  AZURE_OPENAI_ENDPOINT: "https://YOUR_RESOURCE.openai.azure.com/"
  AZURE_OPENAI_API_KEY: "YOUR_AZURE_OPENAI_KEY"
  AZURE_OPENAI_DEPLOYMENT: "gpt-4o-mini"
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"

  # Redis URL with embedded AUTH password (must match redis-secret REDIS_PASSWORD).
  # Format: redis://:<password>@redis:6379/0
  REDIS_URL: "redis://:REPLACE_ME@redis:6379/0"

  # Transitional fallback for POST /webhook* until every tenant has its own
  # encrypted webhook_api_key in tenant_channel_secrets.
  API_KEY: "YOUR_GLOBAL_WEBHOOK_FALLBACK_KEY"

  # Encrypts tenant_channel_secrets values in PostgreSQL.
  # Generate with:
  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  SECRET_ENCRYPTION_KEY: "YOUR_FERNET_KEY"

  # Global webhook URLs removed. Configure tenant-specific webhook URLs only.

  FEEDBACK_SUBMIT_API_KEY: "YOUR_FEEDBACK_SUBMIT_KEY"
  ADMIN_API_KEY: "YOUR_ADMIN_FEEDBACK_KEY"

  # Admin dashboard Postgres access — use application hotelassistant role (created by postgres-bootstrap).
  HOTEL_OPS_DSN: "postgresql://hotelassistant:YOUR_POSTGRES_PASSWORD@postgres:5432/hotel_ops"

  # Multi-tenant production: omit global Meta/Zalo here.
  # Per-tenant Facebook/Zalo credentials live in PostgreSQL tenant_channel_secrets
  # and are managed from Admin -> Tenant -> Config.
  # IMPORTANT: do NOT set global FACEBOOK_* in multi-tenant production.
  # FACEBOOK_APP_SECRET: ""
  # FACEBOOK_VERIFY_TOKEN: ""
  # FACEBOOK_PAGE_ACCESS_TOKEN: ""

  # Same rule: do NOT set global ZALO_* for multi-tenant production.
  # ZALO_OA_ACCESS_TOKEN: ""
  # ZALO_OA_SECRET_KEY: ""
  # ZALO_WEBHOOK_VERIFY_TOKEN: ""
