# Alembic schema migration Job — runs BEFORE rolling out a new API image.
#
# Usage (manual):
#   kubectl apply -f k8s/onprem/alembic-upgrade-job.yaml
#   kubectl wait --for=condition=complete job/alembic-upgrade -n stayledger-ai-assistant --timeout=120s
#   kubectl apply -k k8s/onprem/   # then roll out the API
#
# The Job uses the same image as the API deployment (kustomization.yaml images patch
# applies here too), so migrations always match the code being deployed.
#
# The Job is NOT included in kustomization.yaml resources to avoid re-running
# on every `kubectl apply -k`. Apply it manually before each deploy that includes
# schema changes, or wire it into your CI/CD pipeline.
apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-upgrade
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: alembic-upgrade
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: database
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alembic-upgrade
        app.kubernetes.io/part-of: stayledger-ai-assistant
        app.kubernetes.io/component: database
    spec:
      restartPolicy: OnFailure
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          image: putin111/ai-hotel-assistant:dfcb0a467b6da480b94446e98819eda11b663318
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "PYTHONPATH=/app alembic upgrade head"]
          envFrom:
            - configMapRef:
                name: hotel-assistant-api-config
            - secretRef:
                name: hotel-assistant-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: "500m"
              memory: 256Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
