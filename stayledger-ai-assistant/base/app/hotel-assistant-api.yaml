# Hotel AI API — Phase C, stateless and DB-backed.
# Image must exist in your on-prem registry (build from repo Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-api
  namespace: hotel-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-api
    app.kubernetes.io/part-of: hotel-assistant
spec:
  replicas: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hotel-assistant-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hotel-assistant-api
        app.kubernetes.io/part-of: hotel-assistant
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: hotel-assistant-api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hotel-assistant-api
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Phase C: no init container — there is no JSON registry to seed.
      # Tenant data lives in PostgreSQL (``tenants`` + ``tenant_runtime_config``).
      containers:
        - name: api
          # Image tag is managed by kustomize (k8s/onprem/kustomization.yaml images: newTag).
          image: putin111/ai-hotel-assistant:3.0.11
          imagePullPolicy: IfNotPresent
          # Read-only rootfs; only /tmp + per-tenant secret mounts are writable.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: hotel-assistant-api-config
            - configMapRef:
                name: hotel-assistant-smtp-config
            - configMapRef:
                name: hotel-assistant-tenant-email-routing
            - secretRef:
                name: hotel-assistant-api-secrets
            - secretRef:
                name: hotel-assistant-smtp-secrets
          volumeMounts:
            # Read-only rootfs requires a writable scratch dir.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "1"
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # startupProbe gates liveness/readiness until the schema-ensure
          # path (kb_schema, tenant_runtime, tenants_registry, usage_events,
          # feedback) finishes. On a fresh DB or after a leaked-transaction
          # incident the first DDL pass can take >75s, which would otherwise
          # blow the liveness budget and trigger CrashLoopBackoff. Allowing
          # 60 attempts × 5s = 300s of grace before liveness takes over.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            # initialDelaySeconds is ignored once startupProbe is set — kept
            # as a small floor so a degenerate "no-startupProbe" rollback
            # still has the previous safety margin.
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              # /readyz returns 503 when Redis or Postgres is unreachable so
              # the LB drains traffic instead of returning 5xx to users.
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-assistant-api
  namespace: hotel-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-api
    app.kubernetes.io/part-of: hotel-assistant
spec:
  type: NodePort
  ports:
    - name: http
      port: 8000
      targetPort: http
      # Temporary: keep NodePort until ingress rollout is finalized.
      nodePort: 30080
  selector:
    app.kubernetes.io/name: hotel-assistant-api

