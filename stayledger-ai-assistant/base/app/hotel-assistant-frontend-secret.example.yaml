# Template for hotel-assistant-frontend-secrets.
# Copy to hotel-assistant-frontend-secret.yaml, fill values, then:
#   kubectl apply -f k8s/onprem/hotel-assistant-frontend-secret.yaml
# The real file is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: hotel-assistant-frontend-secrets
  namespace: hotel-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-frontend
    app.kubernetes.io/part-of: hotel-assistant
type: Opaque
stringData:
  # PostgreSQL DSN for the Next.js /api/db/ping health check (server-side only).
  # Use the NodePort address since the frontend pod accesses Postgres via the cluster service.
  HOTEL_OPS_DSN: "postgresql://hotelassistant:YOUR_DB_PASSWORD@postgres:5432/hotel_ops"
