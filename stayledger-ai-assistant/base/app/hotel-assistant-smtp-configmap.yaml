# Non-sensitive SMTP settings (host, port, From identity, TLS behavior).
# Credentials belong in Secret ``hotel-assistant-smtp-secrets`` (see example file).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-assistant-smtp-config
  namespace: hotel-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-api
    app.kubernetes.io/part-of: hotel-assistant
    app.kubernetes.io/component: smtp
data:
  SMTP_HOST: "email-smtp.ap-southeast-1.amazonaws.com"
  SMTP_PORT: "587"
  SMTP_FROM_EMAIL: "hotel-assistant@tekcent.com"
  SMTP_FROM_NAME: "Hotel Assistant"
  # Fallback ops recipient when a tenant has no tenant_runtime_config.notification_emails
  # and no legacy tenant routing entry. Comma-separate multiple addresses.
  SMTP_OPS_TO_EMAIL: "truonglamtuan@gmail.com"
  SMTP_TIMEOUT_S: "10"
  SMTP_MAX_RETRIES: "2"
  SMTP_RETRY_BACKOFF_S: "1.0"
  SMTP_USE_TLS: "false"
  SMTP_STARTTLS: "true"
  SMTP_VALIDATE_CERTS: "true"
  SMTP_REQUIRE_AUTH: "true"
