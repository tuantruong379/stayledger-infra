# One-shot Job: reindex + embed KB chunks for seed tenants (operator backfill).
apiVersion: batch/v1
kind: Job
metadata:
  name: hotel-assistant-kb-embed-backfill
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-kb-embed-backfill
    app.kubernetes.io/part-of: stayledger-ai-assistant
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hotel-assistant-kb-embed-backfill
        app.kubernetes.io/part-of: stayledger-ai-assistant
    spec:
      restartPolicy: Never
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kb-embed-backfill
          image: putin111/ai-hotel-assistant:3.0.11
          imagePullPolicy: IfNotPresent
          command:
            - /venv/bin/python
            - scripts/reindex_kb_chunks.py
            - --tenant-id
            - cupid_hotel
            - --tenant-id
            - vertex_suites_hanoi
            - --tenant-id
            - azure_bay_danang
            - --reindex
            - --embed
            - --batch-size
            - "32"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: hotel-assistant-api-config
            - secretRef:
                name: hotel-assistant-api-secrets
          env:
            - name: RAG_CHUNK_PERSIST
              value: "1"
            - name: RAG_EMBEDDING_DIMENSIONS
              value: "1536"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
