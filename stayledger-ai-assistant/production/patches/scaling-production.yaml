# Single-node production sizing for stayledger k3s cluster.
# Keep API/frontend at 1 replica: node CPU requests are already ~90% with PMS + observability.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-api
  namespace: stayledger-ai-assistant
spec:
  replicas: 1

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-frontend
  namespace: stayledger-ai-assistant
spec:
  replicas: 1

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-channel-worker
  namespace: stayledger-ai-assistant
spec:
  replicas: 1

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-webhook-worker
  namespace: stayledger-ai-assistant
spec:
  replicas: 1

---
# Reasoning: base HPA minReplicas=2 exceeds single-node CPU budget with PMS colocated.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hotel-assistant-api
  namespace: stayledger-ai-assistant
spec:
  minReplicas: 1
  maxReplicas: 2

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hotel-assistant-frontend
  namespace: stayledger-ai-assistant
spec:
  minReplicas: 1
  maxReplicas: 2
