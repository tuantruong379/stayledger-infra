# CAP-01: single-node. Live steady ~310–350m CPU — request must sit above that
# or Lens warns and readiness exec times out under CFS throttle.
# HPA maxReplicas=1 (see scaling-production.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-channel-worker
  namespace: stayledger-ai-assistant
spec:
  template:
    spec:
      containers:
        - name: channel-worker
          resources:
            requests:
              cpu: "400m"
              memory: "128Mi"
            limits:
              cpu: "750m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                [
                  "/venv/bin/python",
                  "-c",
                  "from app.observability.health_checks import check_worker_readiness; import sys; sys.exit(0 if check_worker_readiness().get('ok') else 1)",
                ]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 6
