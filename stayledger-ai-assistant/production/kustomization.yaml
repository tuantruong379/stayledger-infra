# Production overlay for stayledger k3s cluster (context: stayledger).
# Public URLs via Traefik + cert-manager:
#   UI:  https://assistant.stayledger.io
#   API: https://api-assistant.stayledger.io
#
# Deploy (after secrets):
#   kubectl apply -k stayledger-ai-assistant/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-ai-assistant

resources:
  - ../base
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

patches:
  - path: api-configmap-patch.yaml
  - path: frontend-configmap-patch.yaml
  - path: frontend-deployment-patch.yaml
  - path: patches/scaling-production.yaml
  - path: patches/api-resources.yaml
  - path: patches/postgres-resources.yaml
  - path: patches/kb-embed-worker-resources.yaml
  - path: patches/redis-resources.yaml
  - path: patches/webhook-worker-resources.yaml
  - path: patches/channel-worker-resources.yaml
  - path: patches/frontend-resources.yaml
  - path: patches/optional-workers-scale.yaml
  - path: patches/api-service-clusterip.yaml
    target:
      kind: Service
      name: hotel-assistant-api
  - path: patches/frontend-service-clusterip.yaml
    target:
      kind: Service
      name: hotel-assistant-frontend
  - path: patches/postgres-pv-production.yaml
  - path: patches/redis-pv-production.yaml
  - path: patches/postgres-backup-pv-production.yaml

# Pin to CI-published Docker Hub tags (putin111/ai-hotel-assistant*).
# Match post-base-transform image names, then remap to published repos.
# 2026-07-20: score90 — promo% sync, M2/I1 multiturn, conditional rerank, Ops P95 truth.
images:
  - name: putin111/stayledger-ai-assistant
    newName: putin111/ai-hotel-assistant
    newTag: "score90-20260720"
  - name: putin111/stayledger-ai-assistant-frontend
    newName: putin111/ai-hotel-assistant-frontend
    newTag: "b7f47aa"
