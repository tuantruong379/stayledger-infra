# Alerts for event-triggered RAG evaluation (scripts/run_rag_eval.py in stayledger-ai-assistant),
# scraped from rag_eval_* gauges exposed by app/observability/prom_client.py at /metrics/prom.
#
# Evaluation is triggered after human-approved remediation or an explicit Admin retry. These
# alerts describe the latest completed evaluation; scheduling health is owned by the eval-job
# controller and its database state, not by a Kubernetes CronJob.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rag-eval-alerts
  namespace: observability
spec:
  groups:
    - name: rag-eval.quality
      rules:
        - alert: RagEvalCriticalFailure
          expr: rag_eval_critical_failure_count > 0
          for: 5m
          labels:
            severity: p1
            service: hotel-ai-assistant
            slo: rag_quality
          annotations:
            summary: "P1: RAG eval detected a critical hallucination/factual failure"
            description: "tenant={{ $labels.tenant_id }} language={{ $labels.language }}: judge flagged an unsupported price/policy/availability claim in the nightly RAG eval."
            runbook_url: "https://github.com/tuantruong379/ai-hotel-assistant/blob/main/docs/runbooks/rag-eval-quality.md"
            dashboard_url: "/d/hotel-golden/hotel-assistant-golden-signals?from=now-24h&to=now"

        - alert: RagEvalFaithfulnessLow
          expr: rag_eval_faithfulness_p10 < 0.7
          for: 30m
          labels:
            severity: p2
            service: hotel-ai-assistant
            slo: rag_quality
          annotations:
            summary: "Nightly RAG eval faithfulness p10 below 0.7"
            description: "tenant={{ $labels.tenant_id }} language={{ $labels.language }}: 10th-percentile faithfulness score is {{ $value }}, below the 0.7 gate."
            runbook_url: "https://github.com/tuantruong379/ai-hotel-assistant/blob/main/docs/runbooks/rag-eval-quality.md"

        - alert: RagEvalRecallLow
          expr: rag_eval_recall_at_5 < 0.85
          for: 30m
          labels:
            severity: p2
            service: hotel-ai-assistant
            slo: rag_quality
          annotations:
            summary: "Nightly RAG eval recall@5 below 0.85"
            description: "tenant={{ $labels.tenant_id }} language={{ $labels.language }}: recall@5 is {{ $value }}, below the 0.85 gate."
            runbook_url: "https://github.com/tuantruong379/ai-hotel-assistant/blob/main/docs/runbooks/rag-eval-quality.md"

        - alert: RagEvalVnEnRecallGap
          # Reasoning: rag_eval_* gauges are scraped from every API pod; without collapsing
          # instance cardinality, on(tenant_id) becomes many-to-many and PrometheusRuleFailures fires.
          expr: |
            abs(
              max by (tenant_id) (rag_eval_recall_at_5{language="vi"})
              - on(tenant_id)
              max by (tenant_id) (rag_eval_recall_at_5{language="en"})
            ) > 0.10
          for: 30m
          labels:
            severity: p2
            service: hotel-ai-assistant
            slo: rag_quality
          annotations:
            summary: "Vietnamese/English recall@5 gap exceeds 10 points"
            description: "tenant={{ $labels.tenant_id }}: recall@5 diverges by more than 0.10 between vi/en, suggesting the embedding model is measurably weaker on one language."
            runbook_url: "https://github.com/tuantruong379/ai-hotel-assistant/blob/main/docs/runbooks/rag-eval-quality.md"
