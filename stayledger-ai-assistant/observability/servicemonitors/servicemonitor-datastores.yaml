# Scrape database/cache exporters deployed in the hotel-assistant namespace.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hotel-assistant-datastore-exporters
  namespace: observability
  labels:
    release: kps
    app.kubernetes.io/name: hotel-assistant-datastore-exporters
    app.kubernetes.io/part-of: stayledger-ai-assistant
spec:
  namespaceSelector:
    matchNames:
      - hotel-assistant
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - postgres-exporter
          - redis-exporter
  jobLabel: app.kubernetes.io/name
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
