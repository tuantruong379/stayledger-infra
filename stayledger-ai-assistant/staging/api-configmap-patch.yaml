# Staging public URLs — NodePort + Cloudflare (no ingress).
#   UI:  https://stg-assistant.stayledger.io  (→ node :30081)
#   API: https://stg-api-assistant.stayledger.io (→ node :30080)
apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-assistant-api-config
  namespace: stayledger-ai-assistant
data:
  ENVIRONMENT: "staging"
  APP_ENV: "staging"
  ADMIN_WEB_PUBLIC_URL: "https://stg-assistant.stayledger.io"
  CORS_ORIGINS: "https://stg-assistant.stayledger.io,http://10.89.1.40:30081,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3003"
  PMS_STAYLEDGER_ENABLED: "1"
  PMS_DRAFT_BOOKING_ENABLED: "1"
  PMS_CONVERSATION_SYNC_ENABLED: "1"
  PMS_OUTBOX_WORKER_ENABLED: "1"
  # Enable periodic PMS→AI catalog sync; keep fail_closed until sync is proven on staging.
  PMS_CATALOG_SYNC_ENABLED: "1"
  PMS_READ_FALLBACK_MODE: "fail_closed"
  PMS_PROVIDER_DEFAULT: "local"
  # Phase 8 full staging cutover: pgvector primary for all tenants.
  RAG_RETRIEVAL_BACKEND: "pgvector"
  RAG_CHUNK_PERSIST: "1"
  RAG_EMBEDDING_DIMENSIONS: "1536"
  RAG_PGVECTOR_SHADOW_ENABLED: "0"
  RAG_PGVECTOR_TENANT_ALLOWLIST: ""
  RAG_PGVECTOR_CANARY_PERCENT: "100"
  # Calibrated from staging top-1 cosine samples (min≈0.44); keep slack for FAQ variance.
  RAG_PGVECTOR_MIN_SIMILARITY: "0.35"
  FEATURE_RAG_PGVECTOR: "1"
  # Floor for in-memory / scoped-hybrid fallback paths (drop weak chunks when peers remain).
  RAG_HYBRID_SCORE_FLOOR: "0.25"
  # LLM listwise rerank after similarity floor (heuristic fallback on timeout/error).
  FEATURE_RERANKER_ENABLED: "1"
  RAG_RERANK_TENANT_ALLOWLIST: "cupid_hotel"
  # Bounded multi-turn history in RAG messages (Redis envelope; not pgvector).
  AI_MULTITURN_MEMORY_ENABLED: "1"
  # fail_closed required by startup safety on staging/production (fail_open needs ALLOW_AI_BUDGET_FAIL_OPEN=1).
  AI_BUDGET_REDIS_FAILURE_MODE: "fail_closed"
