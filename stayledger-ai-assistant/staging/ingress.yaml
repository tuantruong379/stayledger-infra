# Staging TLS edge for StayLedger AI Assistant (admin UI + API).
#
# DNS (before apply):
#   assistant.stayledger.io      -> ingress controller LoadBalancer / node IP
#   api-assistant.stayledger.io  -> same target
#
# Apply after cert-manager issuer:
#   kubectl apply -f stayledger-shared/staging/tls-edge/cert-manager-issuer.yaml
#   kubectl apply -f stayledger-ai-assistant/staging/ingress.yaml
#
# Verify:
#   curl -fsS https://assistant.stayledger.io/
#   curl -fsS https://api-assistant.stayledger.io/health
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hotel-assistant-frontend
  namespace: hotel-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-frontend
    app.kubernetes.io/part-of: hotel-assistant
    environment: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - assistant.stayledger.io
      secretName: stayledger-ai-assistant-staging-ui-tls
  rules:
    - host: assistant.stayledger.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hotel-assistant-frontend
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hotel-assistant-api
  namespace: hotel-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-api
    app.kubernetes.io/part-of: hotel-assistant
    environment: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api-assistant.stayledger.io
      secretName: stayledger-ai-assistant-staging-api-tls
  rules:
    - host: api-assistant.stayledger.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hotel-assistant-api
                port:
                  number: 8000
