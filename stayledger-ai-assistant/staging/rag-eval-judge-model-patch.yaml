apiVersion: batch/v1
kind: CronJob
metadata:
  name: rag-eval
  namespace: stayledger-ai-assistant
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: rag-eval
              # Current qualification scope is Vietnamese. Each VI case carries
              # its own verified property_id; English qualification is deferred.
              args:
                - "--language"
                - "vi"
              env:
                - name: RAG_EVAL_JUDGE_MODEL
                  value: "azure/gpt-4o-mini"
