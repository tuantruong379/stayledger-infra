apiVersion: batch/v1
kind: CronJob
metadata:
  name: rag-eval
  namespace: stayledger-ai-assistant
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: rag-eval
              env:
                - name: RAG_EVAL_JUDGE_MODEL
                  value: "azure/gpt-4o-mini"
