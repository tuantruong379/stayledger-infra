# Staging overlay - NodePort (no ingress). Public URLs via Cloudflare -> node ports:
#   UI:  https://stg-assistant.stayledger.io       -> NodePort 30081
#   API: https://stg-api-assistant.stayledger.io  -> NodePort 30080
#
# Deploy (after base secrets):
#   kubectl apply -k stayledger-ai-assistant/staging/
#   kubectl rollout status deployment/hotel-assistant-api -n stayledger-ai-assistant
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-ai-assistant

resources:
  - ../base

patches:
  - path: api-configmap-patch.yaml
  - path: frontend-configmap-patch.yaml
  - path: frontend-deployment-patch.yaml
  # CAP-01: probe timeout 15s - Redis+Postgres readiness often ~8-12s under hub load.
  - path: channel-worker-resources-patch.yaml
  - path: webhook-worker-resources-patch.yaml
  # Match production single-node replica + HPA caps (prevents worker scale-out storm).
  - path: scaling-production-patch.yaml
  - path: api-release-annotations-patch.yaml
  - path: worker-freeze-replicas-patch.yaml

# Immutable digest pin for acquire_admin_conn transaction-local rls_admin eae7b30.
# API digest: sha256:353ce28b34d45b5ea6127335ba50edc664a44f6cfded4b5c5f92cb353922d5a9
# Frontend unchanged from prior pin.
# NOTE: local BuildKit authorized for staging closure; CI deferred pre-production.
images:
  - name: putin111/stayledger-ai-assistant
    newName: putin111/ai-hotel-assistant
    digest: sha256:353ce28b34d45b5ea6127335ba50edc664a44f6cfded4b5c5f92cb353922d5a9
  - name: putin111/stayledger-ai-assistant-frontend
    newName: putin111/ai-hotel-assistant-frontend
    digest: sha256:2c8a8c8749d265b91acc72f974241eafde952bf646e79d3b494f189defb31f8e




