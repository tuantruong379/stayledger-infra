# Staging overlay - NodePort (no ingress). Public URLs via Cloudflare -> node ports:
#   UI:  https://stg-assistant.stayledger.io       -> NodePort 30081
#   API: https://stg-api-assistant.stayledger.io  -> NodePort 30080
#
# Deploy (after base secrets):
#   kubectl apply -k stayledger-ai-assistant/staging/
#   kubectl rollout status deployment/hotel-assistant-api -n stayledger-ai-assistant
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-ai-assistant

resources:
  - ../base
  - pms-outbox-network-patch.yaml

patches:
  - path: api-configmap-patch.yaml
  - path: frontend-configmap-patch.yaml
  - path: frontend-deployment-patch.yaml
  - path: metrics-aggregator-configmap-patch.yaml
  - path: channel-worker-resources-patch.yaml
  - path: webhook-worker-resources-patch.yaml
  - path: scaling-production-patch.yaml
  - path: frontend-hpa-oom-mitigation-patch.yaml
  - path: api-release-annotations-patch.yaml
  - path: api-legacy-annotations-cleanup.yaml
  - path: canonical-turn-canary-patch.yaml
  - path: worker-freeze-replicas-patch.yaml
  - path: nonmutating-canary-replicas-patch.yaml
  - path: rag-eval-worker-image-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: hotel-assistant-rag-eval-worker
  - path: postgres-observability-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: postgres

