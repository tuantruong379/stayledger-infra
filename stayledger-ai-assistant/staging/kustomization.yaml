# Staging overlay — public URLs:
#   UI:  https://assistant.stayledger.io
#   API: https://api-assistant.stayledger.io
#
# Deploy (after base secrets):
#   kubectl apply -k stayledger-ai-assistant/staging/
#
# TLS ingress (cluster edge):
#   kubectl apply -f stayledger-shared/staging/tls-edge/cert-manager-issuer.yaml
#   kubectl apply -f stayledger-shared/staging/ingress.yaml
#   kubectl apply -f stayledger-ai-assistant/staging/ingress.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hotel-assistant

resources:
  - ../base

patches:
  - path: api-configmap-patch.yaml
  - path: frontend-configmap-patch.yaml

images:
  - name: putin111/ai-hotel-assistant
    newName: putin111/stayledger-ai-assistant
    newTag: sha-4742e84
  - name: putin111/hotel-assistant-frontend
    newName: putin111/stayledger-ai-assistant-frontend
    newTag: sha-4742e84
