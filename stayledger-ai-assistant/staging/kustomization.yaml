# Rollback digest (prior dirty RC): sha256:5c021cd382c8db441cfb963bebfef8992216cb8b98f00052d8fb155fc14d4f93
images:
  - name: putin111/stayledger-ai-assistant
    newName: putin111/ai-hotel-assistant
    digest: sha256:8ceb0b6be2bc0d4478f85a1912315b9b73e086b96d8bb51a15dd211321d0b09c
  - name: putin111/stayledger-ai-assistant-frontend
    newName: putin111/ai-hotel-assistant-frontend
