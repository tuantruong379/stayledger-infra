# Bounded staging feature exercise.
# Channel outbound remains sink-only and catalog sync remains explicitly dry-run.
# PMS outbox is enabled here because staging booking/outbox testing was explicitly
# authorized; this overlay must never be reused for production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-channel-worker
  namespace: stayledger-ai-assistant
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-webhook-worker
  namespace: stayledger-ai-assistant
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-pms-catalog-sync
  namespace: stayledger-ai-assistant
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-pms-outbox
  namespace: stayledger-ai-assistant
spec:
  replicas: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-assistant-api-config
  namespace: stayledger-ai-assistant
data:
  PMS_CATALOG_SYNC_ENABLED: "1"
  PMS_CATALOG_SYNC_DRY_RUN: "1"
  PMS_OUTBOX_WORKER_ENABLED: "1"
  PMS_DRAFT_BOOKING_ENABLED: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-api
  namespace: stayledger-ai-assistant
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: PMS_DRAFT_BOOKING_ENABLED
              value: "1"
            - name: PMS_OUTBOX_WORKER_ENABLED
              value: "1"
            - name: PMS_WORKERS_IN_API
              value: "0"
