apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "StayLedger PMS"
data:
  kubernetes.json: |
    {
      "uid": "stayledger-k8s",
      "title": "05 - PMS Kubernetes",
      "description": "Pod health, CPU/memory usage, throttling, PV usage, and node pressure",
      "tags": [
        "stayledger",
        "pms",
        "production-readiness",
        "kubernetes"
      ],
      "schemaVersion": 38,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "constant",
            "label": "Kubernetes namespace",
            "query": "stayledger-staging",
            "current": {
              "text": "stayledger-staging",
              "value": "stayledger-staging"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "title": "Purpose / When No data is OK",
          "type": "text",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 5
          },
          "options": {
            "mode": "markdown",
            "content": "**Purpose:** Runtime infra health for the PMS namespace - bad pod phases, restarts, CPU/memory, throttling, PVC usage, node pressure, HPA.\n\n**Primary signals:** Pending/Failed pods, restart spikes, node memory/disk pressure, disk usage trend.\n\n**No data is OK when:** CPU throttling %, PVC usage %, or HPA panels are empty - metric/label mismatch, wrong `$namespace`, or HPA not present / not scraped yet (see HPA note below). Node OK panels can still be green.\n\n**Not OK:** Failed/Pending pods, restart storms, node DiskPressure/MemoryPressure, disk usage climbing toward capacity.\n\n**Sources:** kube-state-metrics, cAdvisor, node-exporter, kubelet volume stats. Confirm `$namespace` matches the cluster (staging vs `stayledger` prod). **Drill next:** 01 Executive unhealthy pods; 04 Database if storage/DB pods struggle."
          }
        },
        {
          "id": 1,
          "title": "Pod Status (stayledger-staging)",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 6
          },
          "targets": [
            {
              "expr": "kube_pod_status_phase{namespace=\"$namespace\",phase=~\"Pending|Failed|Unknown\"} == 1",
              "instant": true,
              "legendFormat": "{{pod}} / {{phase}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Pod Restarts (last 1h)",
          "type": "barchart",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 6
          },
          "options": {
            "orientation": "horizontal"
          },
          "targets": [
            {
              "expr": "topk(10, increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[1h]))",
              "legendFormat": "{{pod}} / {{container}}",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "title": "CPU Usage vs Request (ratio)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",image!=\"\"}[5m])) by (pod, container) / clamp_min(sum(kube_pod_container_resource_requests{namespace=\"$namespace\",resource=\"cpu\"}) by (pod, container), 0.001)",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Memory Usage vs Request (ratio)",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 11,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",image!=\"\"}) by (pod, container) / clamp_min(sum(kube_pod_container_resource_requests{namespace=\"$namespace\",resource=\"memory\"}) by (pod, container), 1)",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "CPU Throttling %",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "steps": [
                  {
                    "value": 0,
                    "color": "green"
                  },
                  {
                    "value": 0.25,
                    "color": "yellow"
                  },
                  {
                    "value": 0.5,
                    "color": "red"
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_cfs_throttled_periods_total{namespace=\"$namespace\",container!=\"\",image!=\"\"}[5m])) by (pod, container) / clamp_min(sum(rate(container_cpu_cfs_periods_total{namespace=\"$namespace\",container!=\"\",image!=\"\"}[5m])) by (pod, container), 0.001)",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "PersistentVolume Usage %",
          "type": "gauge",
          "gridPos": {
            "x": 12,
            "y": 19,
            "w": 12,
            "h": 8
          },
          "options": {
            "minValue": 0,
            "maxValue": 100
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "steps": [
                  {
                    "value": 0,
                    "color": "green"
                  },
                  {
                    "value": 70,
                    "color": "yellow"
                  },
                  {
                    "value": 85,
                    "color": "red"
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "100 * kubelet_volume_stats_used_bytes{namespace=\"$namespace\"} / clamp_min(kubelet_volume_stats_capacity_bytes{namespace=\"$namespace\"}, 1)",
              "legendFormat": "{{persistentvolumeclaim}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Node Memory Pressure",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OK",
                      "color": "green"
                    },
                    "1": {
                      "text": "PRESSURE",
                      "color": "red"
                    }
                  }
                }
              ]
            }
          },
          "targets": [
            {
              "expr": "kube_node_status_condition{condition=\"MemoryPressure\",status=\"true\"}",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 8,
          "title": "Node Disk Pressure",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 27,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OK",
                      "color": "green"
                    },
                    "1": {
                      "text": "PRESSURE",
                      "color": "red"
                    }
                  }
                }
              ]
            }
          },
          "targets": [
            {
              "expr": "kube_node_status_condition{condition=\"DiskPressure\",status=\"true\"}",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 9,
          "title": "Node Disk Usage %",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 27,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          },
          "targets": [
            {
              "expr": "(node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\",mountpoint!~\"/run.*|/var/lib/kubelet/pods/.*\"} - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay\",mountpoint!~\"/run.*|/var/lib/kubelet/pods/.*\"}) / clamp_min(node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\",mountpoint!~\"/run.*|/var/lib/kubelet/pods/.*\"}, 1)",
              "legendFormat": "{{device}} {{mountpoint}}"
            }
          ]
        },
        {
          "id": 101,
          "title": "HPA — Autoscaling (populates once P1C HorizontalPodAutoscaler is applied)",
          "type": "text",
          "gridPos": {
            "x": 0,
            "y": 35,
            "w": 24,
            "h": 3
          },
          "options": {
            "mode": "markdown",
            "content": "HPA panels read `kube_horizontalpodautoscaler_*` from kube-state-metrics. They stay empty until the `stayledger-api` HPA is created in **P1C**. Watch current vs desired vs max replicas during the spike test to confirm scale-up/scale-down and detect flapping."
          }
        },
        {
          "id": 10,
          "title": "HPA Replicas (current / desired / min / max)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 38,
            "w": 16,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"$namespace\"}",
              "legendFormat": "current {{horizontalpodautoscaler}}"
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"$namespace\"}",
              "legendFormat": "desired {{horizontalpodautoscaler}}"
            },
            {
              "expr": "kube_horizontalpodautoscaler_spec_min_replicas{namespace=\"$namespace\"}",
              "legendFormat": "min {{horizontalpodautoscaler}}"
            },
            {
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"$namespace\"}",
              "legendFormat": "max {{horizontalpodautoscaler}}"
            }
          ]
        },
        {
          "id": 11,
          "title": "HPA at Max Replicas (saturation)",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 38,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OK",
                      "color": "green"
                    },
                    "1": {
                      "text": "AT MAX",
                      "color": "red"
                    }
                  }
                }
              ]
            }
          },
          "targets": [
            {
              "expr": "max(kube_horizontalpodautoscaler_status_current_replicas{namespace=\"$namespace\"} >= bool kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"$namespace\"})",
              "legendFormat": "at-max"
            }
          ]
        }
      ]
    }
