apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-executive
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "StayLedger PMS"
data:
  executive-overview.json: |
    {
      "uid": "stayledger-executive",
      "title": "StayLedger PMS — Executive Overview",
      "description": "Platform health, SLOs, and business KPIs for management and go-live readiness",
      "tags": ["stayledger", "executive", "slo"],
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-3h", "to": "now" },
      "templating": {
        "list": [
          { "name": "api_job", "type": "constant", "label": "API scrape job", "query": "stayledger-api", "current": { "text": "stayledger-api", "value": "stayledger-api" } },
          { "name": "namespace", "type": "constant", "label": "Kubernetes namespace", "query": "stayledger-staging", "current": { "text": "stayledger-staging", "value": "stayledger-staging" } },
          { "name": "db", "type": "constant", "label": "PostgreSQL database", "query": "stayledger", "current": { "text": "stayledger", "value": "stayledger" } },
          { "name": "postgres_job", "type": "constant", "label": "PostgreSQL exporter job", "query": "postgres-exporter", "current": { "text": "postgres-exporter", "value": "postgres-exporter" } }
        ]
      },
      "panels": [
        {
          "id": 100,
          "title": "Metric Sources",
          "type": "text",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 3 },
          "options": {
            "mode": "markdown",
            "content": "This dashboard uses app metrics from `stayledger-api` (`/api/metrics`), datastore exporter metrics (`postgres-exporter`, `redis-exporter`), and Kubernetes metrics from kube-state-metrics/cAdvisor. Empty panels usually mean the related exporter is not scraped or the feature has no traffic in the selected time range."
          }
        },
        {
          "id": 1,
          "title": "API Uptime",
          "type": "stat",
          "gridPos": { "x": 0, "y": 3, "w": 3, "h": 4 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": { "steps": [{ "value": 0, "color": "red" }, { "value": 95, "color": "yellow" }, { "value": 99, "color": "green" }] }
            }
          },
          "targets": [{ "expr": "avg_over_time(up{job=\"$api_job\"}[5m]) * 100", "legendFormat": "Uptime %" }]
        },
        {
          "id": 2,
          "title": "HTTP RPS",
          "type": "stat",
          "gridPos": { "x": 3, "y": 3, "w": 3, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [{ "expr": "sum(rate(http_requests_total{job=\"$api_job\"}[1m]))", "legendFormat": "RPS" }]
        },
        {
          "id": 3,
          "title": "HTTP Error Rate",
          "type": "stat",
          "gridPos": { "x": 6, "y": 3, "w": 3, "h": 4 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": { "steps": [{ "value": 0, "color": "green" }, { "value": 1, "color": "yellow" }, { "value": 5, "color": "red" }] }
            }
          },
          "targets": [{ "expr": "100 * sum(rate(http_requests_total{job=\"$api_job\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{job=\"$api_job\"}[5m])), 0.001)", "legendFormat": "5xx %" }]
        },
        {
          "id": 4,
          "title": "Read p95 Latency",
          "type": "stat",
          "gridPos": { "x": 9, "y": 3, "w": 3, "h": 4 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": { "steps": [{ "value": 0, "color": "green" }, { "value": 500, "color": "yellow" }, { "value": 1000, "color": "red" }] }
            }
          },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket{job=\"$api_job\",method=\"GET\"}[5m])) by (le))", "legendFormat": "p95 ms" }]
        },
        {
          "id": 5,
          "title": "Write p95 Latency",
          "type": "stat",
          "gridPos": { "x": 12, "y": 3, "w": 3, "h": 4 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": { "steps": [{ "value": 0, "color": "green" }, { "value": 2000, "color": "yellow" }, { "value": 4000, "color": "red" }] }
            }
          },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket{job=\"$api_job\",method=\"POST\"}[5m])) by (le))", "legendFormat": "p95 ms" }]
        },
        {
          "id": 6,
          "title": "AI Error Rate",
          "type": "stat",
          "gridPos": { "x": 15, "y": 3, "w": 3, "h": 4 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": { "steps": [{ "value": 0, "color": "green" }, { "value": 3, "color": "yellow" }, { "value": 10, "color": "red" }] }
            }
          },
          "targets": [{ "expr": "100 * sum(rate(ai_errors_total{job=\"$api_job\"}[5m])) / clamp_min(sum(rate(ai_requests_total{job=\"$api_job\"}[5m])), 0.001)", "legendFormat": "AI Error %" }]
        },
        {
          "id": 7,
          "title": "AI Token Quota (max property)",
          "type": "gauge",
          "gridPos": { "x": 18, "y": 3, "w": 3, "h": 4 },
          "options": { "minValue": 0, "maxValue": 100 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": { "steps": [{ "value": 0, "color": "green" }, { "value": 80, "color": "yellow" }, { "value": 95, "color": "red" }] }
            }
          },
          "targets": [{ "expr": "max(ai_quota_usage_percent{job=\"$api_job\"})", "legendFormat": "Quota %" }]
        },
        {
          "id": 8,
          "title": "PostgreSQL Connections",
          "type": "gauge",
          "gridPos": { "x": 21, "y": 3, "w": 3, "h": 4 },
          "options": { "minValue": 0, "maxValue": 100 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "steps": [{ "value": 0, "color": "green" }, { "value": 80, "color": "yellow" }, { "value": 95, "color": "red" }] }
            }
          },
          "targets": [{ "expr": "sum(pg_stat_activity_count{job=\"$postgres_job\",datname=\"$db\"})", "legendFormat": "Connections" }]
        },
        {
          "id": 9,
          "title": "Requests per Second",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 7, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "sum(rate(http_requests_total{job=\"$api_job\",status=~\"2..\"}[1m]))", "legendFormat": "2xx" },
            { "expr": "sum(rate(http_requests_total{job=\"$api_job\",status=~\"4..\"}[1m]))", "legendFormat": "4xx" },
            { "expr": "sum(rate(http_requests_total{job=\"$api_job\",status=~\"5..\"}[1m]))", "legendFormat": "5xx" }
          ]
        },
        {
          "id": 10,
          "title": "Latency p50 / p95 / p99 (ms)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 7, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_ms_bucket{job=\"$api_job\"}[5m])) by (le))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket{job=\"$api_job\"}[5m])) by (le))", "legendFormat": "p95" },
            { "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_ms_bucket{job=\"$api_job\"}[5m])) by (le))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 11,
          "title": "Bookings Today",
          "type": "stat",
          "gridPos": { "x": 0, "y": 15, "w": 4, "h": 4 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [{ "expr": "sum(increase(booking_operations_total{job=\"$api_job\",operation=\"created\"}[24h])) or vector(0)", "legendFormat": "Bookings" }]
        },
        {
          "id": 12,
          "title": "Payments Today",
          "type": "stat",
          "gridPos": { "x": 4, "y": 15, "w": 4, "h": 4 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [{ "expr": "sum(increase(payment_operations_total{job=\"$api_job\",operation=\"created\"}[24h])) or vector(0)", "legendFormat": "Payments" }]
        },
        {
          "id": 13,
          "title": "AI Requests Today",
          "type": "stat",
          "gridPos": { "x": 8, "y": 15, "w": 4, "h": 4 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [{ "expr": "sum(increase(ai_requests_total{job=\"$api_job\"}[24h])) or vector(0)", "legendFormat": "AI Requests" }]
        },
        {
          "id": 14,
          "title": "AI Tokens Today",
          "type": "stat",
          "gridPos": { "x": 12, "y": 15, "w": 4, "h": 4 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [{ "expr": "sum(increase(ai_tokens_total{job=\"$api_job\"}[24h])) or vector(0)", "legendFormat": "Tokens" }]
        },
        {
          "id": 15,
          "title": "Redis Memory %",
          "type": "gauge",
          "gridPos": { "x": 16, "y": 15, "w": 4, "h": 4 },
          "options": { "minValue": 0, "maxValue": 100 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": { "steps": [{ "value": 0, "color": "green" }, { "value": 70, "color": "yellow" }, { "value": 90, "color": "red" }] }
            }
          },
          "targets": [{ "expr": "100 * redis_memory_used_bytes{job=\"redis-exporter\"} / clamp_min(redis_memory_max_bytes{job=\"redis-exporter\"}, 1)", "legendFormat": "Redis Mem %" }]
        },
        {
          "id": 16,
          "title": "Unhealthy Pods (stayledger-staging)",
          "type": "stat",
          "gridPos": { "x": 20, "y": 15, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "steps": [{ "value": 0, "color": "green" }, { "value": 1, "color": "red" }] }
            }
          },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"$namespace\",phase=~\"Pending|Failed|Unknown\"} == 1) or vector(0)", "legendFormat": "Unhealthy Pods", "instant": true }]
        },
        {
          "id": 17,
          "title": "AI Quota — Top 3 Properties",
          "type": "table",
          "gridPos": { "x": 0, "y": 19, "w": 24, "h": 5 },
          "description": "Companion to the AI Token Quota gauge — shows which properties are closest to exhaustion so operators can act without drilling into another dashboard.",
          "options": { "sortBy": [{ "displayName": "Quota %", "desc": true }] },
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "targets": [{ "expr": "topk(3, ai_quota_usage_percent{job=\"$api_job\"})", "legendFormat": "{{property_id}}", "instant": true }]
        }
      ]
    }
