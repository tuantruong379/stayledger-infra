# Grafana - SLO & Error Budget dashboard (availability burn-rate + latency SLO).
# Multi-tenant refactor (2026-05-02): added tenant_id + slo_target variables,
# tenant-scoped SLO metric selectors, configurable alert threshold constants, and
# tenant comparison row (throughput/error heatmap/p95 topk).
# Recommended thresholds by tier: standard -> alert_threshold_5xx=0.01,
# alert_threshold_p95=3.0; premium -> alert_threshold_5xx=0.005,
# alert_threshold_p95=1.5. Override per tenant in Grafana provisioning.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-stayledger-ai-slo
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "StayLedger Internal"
data:
  stayledger-ai-slo.json: |-
    {
      "title": "AI Assistant - SLO & Error Budget",
      "uid": "hotel-slo",
      "schemaVersion": 39,
      "version": 2,
      "timezone": "Asia/Ho_Chi_Minh",
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "tags": ["stayledger", "internal", "deferred", "ai", "assistant"],
      "templating": {
        "list": [
          {
            "name": "tenant_id",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(http_requests_total, tenant_id)",
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "slo_target",
            "type": "constant",
            "label": "Availability SLO target (30d)",
            "query": "0.995",
            "current": { "text": "0.995", "value": "0.995" },
            "options": [{ "text": "0.995", "value": "0.995", "selected": true }]
          },
          {
            "name": "route",
            "type": "constant",
            "label": "Chat route",
            "query": "/api/v1/chat",
            "current": { "text": "/api/v1/chat", "value": "/api/v1/chat" }
          },
          {
            "name": "alert_threshold_5xx",
            "type": "constant",
            "label": "Alert threshold 5xx ratio",
            "query": "0.01",
            "current": { "text": "0.01", "value": "0.01" },
            "options": [{ "text": "0.01", "value": "0.01", "selected": true }]
          },
          {
            "name": "alert_threshold_p95",
            "type": "constant",
            "label": "Alert threshold p95 seconds",
            "query": "3",
            "current": { "text": "3", "value": "3" },
            "options": [{ "text": "3", "value": "3", "selected": true }]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Availability SLO target (30d)",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [{ "expr": "$slo_target", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3 } }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error budget remaining (30d)",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [{ "expr": "slo:hotel_ai_chat:error_budget_remaining_30d{tenant_id=~\"$tenant_id\"}", "refId": "A" }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "red", "value": 0.2 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Availability burn rate (5m / 1h / 6h)",
          "description": "SLO 99.5% => error budget fraction 0.005. P1 threshold 14x, P2 threshold 6x.",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 7 },
          "targets": [
            { "expr": "(slo:hotel_ai_chat:error_ratio_5m{tenant_id=~\"$tenant_id\"} / clamp_min((1 - $slo_target), 1e-9))", "legendFormat": "burn 5m", "refId": "A" },
            { "expr": "(slo:hotel_ai_chat:error_ratio_1h{tenant_id=~\"$tenant_id\"} / clamp_min((1 - $slo_target), 1e-9))", "legendFormat": "burn 1h", "refId": "B" },
            { "expr": "(slo:hotel_ai_chat:error_ratio_6h{tenant_id=~\"$tenant_id\"} / clamp_min((1 - $slo_target), 1e-9))", "legendFormat": "burn 6h", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 2 } }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Webhook p95 latency (s)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 6 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{tenant_id=~\"$tenant_id\",route=\"$route\"}[5m])))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 3 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Latency SLO: good ratio (<3s)",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 5 },
          "targets": [{ "expr": "slo:hotel_ai_chat:good_latency_ratio_5m{tenant_id=~\"$tenant_id\"}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3 } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Error budget consumed (30d)",
          "description": "1 - remaining budget. 0 means no budget consumed, 1 means exhausted.",
          "gridPos": { "x": 0, "y": 11, "w": 12, "h": 6 },
          "targets": [{ "expr": "1 - slo:hotel_ai_chat:error_budget_remaining_30d{tenant_id=~\"$tenant_id\"}", "refId": "A" }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "red", "value": 0.8 }
                ]
              }
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Webhook critical workflow success ratio (15m)",
          "gridPos": { "x": 12, "y": 11, "w": 12, "h": 6 },
          "targets": [{ "expr": "slo:hotel_ai_webhook:success_ratio_15m{tenant_id=~\"$tenant_id\"}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3 } }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "LLM timeout ratio (5m)",
          "gridPos": { "x": 0, "y": 17, "w": 12, "h": 6 },
          "targets": [{ "expr": "slo:hotel_ai_llm:timeout_ratio_5m{tenant_id=~\"$tenant_id\"}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3 } }
        },
        {
          "id": 9,
          "type": "row",
          "title": "Tenant comparison",
          "gridPos": { "x": 0, "y": 23, "w": 24, "h": 1 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 10,
          "type": "bargauge",
          "title": "Tenant throughput (rps, 5m)",
          "gridPos": { "x": 0, "y": 24, "w": 8, "h": 8 },
          "targets": [
            { "expr": "sum by (tenant_id) (rate(http_requests_total{tenant_id=~\"$tenant_id\",route=\"$route\"}[5m]))", "legendFormat": "{{ tenant_id }}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 2 } }
        },
        {
          "id": 11,
          "type": "heatmap",
          "title": "Tenant error rate heatmap (5xx, 5m)",
          "gridPos": { "x": 8, "y": 24, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "100 * (sum by (tenant_id) (rate(http_requests_total{tenant_id=~\"$tenant_id\",route=\"$route\",status=~\"5..\"}[5m])) / clamp_min(sum by (tenant_id) (rate(http_requests_total{tenant_id=~\"$tenant_id\",route=\"$route\"}[5m])), 1e-9))",
              "legendFormat": "{{ tenant_id }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Tenant p95 latency top 10 (5m)",
          "gridPos": { "x": 16, "y": 24, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "topk(10, histogram_quantile(0.95, sum by (tenant_id, le) (rate(http_request_duration_seconds_bucket{tenant_id=~\"$tenant_id\",route=\"$route\"}[5m]))))",
              "legendFormat": "{{ tenant_id }}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 2 } }
        }
      ]
    }
