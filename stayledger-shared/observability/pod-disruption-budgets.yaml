# Pod Disruption Budgets (PDB) — HA preparation
# Ensures at least 1 replica stays available during cluster maintenance/evictions
# Created: May 2, 2026 (Production Review)

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loki-pdb
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: stayledger-observability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: loki

