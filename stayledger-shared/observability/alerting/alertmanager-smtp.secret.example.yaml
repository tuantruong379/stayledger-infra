# Example only — never commit real SMTP credentials.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-smtp
  namespace: observability
  labels:
    app: stayledger
    component: alertmanager-smtp
type: Opaque
stringData:
  smtp-user: "REPLACE_WITH_SES_SMTP_USERNAME"
  smtp-password: "REPLACE_WITH_SES_SMTP_PASSWORD"
