apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stayledger-alerts
  namespace: observability
  labels:
    # Keep this aligned with the kube-prometheus-stack Helm release name.
    release: kps
spec:
  groups:
    - name: stayledger.api
      interval: 30s
      rules:
        - alert: ApiScrapeDown
          expr: up{job="stayledger-api"} == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "StayLedger API metrics scrape is down"
            description: "Prometheus cannot scrape stayledger-api /api/metrics. The API may be down or metrics endpoint/networking is broken."
            runbook_url: "https://wiki.internal/runbooks/stayledger/ApiScrapeDown"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-executive"

        - alert: ApiErrorRateHigh
          expr: |
            (
              sum(rate(http_requests_total{job="stayledger-api",status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total{job="stayledger-api"}[5m])), 0.001)
              > 0.01
            )
            and sum(rate(http_requests_total{job="stayledger-api"}[5m])) > 1
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "API 5xx error rate above 1%"
            description: "Current rate: {{ $value | humanizePercentage }}. Check recent deploys and application logs."
            runbook_url: "https://wiki.internal/runbooks/stayledger/ApiErrorRateHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-api-perf"

        - alert: ApiReadP95LatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_ms_bucket{job="stayledger-api",method="GET"}[5m])) by (le)
            ) > 800
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "API read p95 latency above 800ms"
            description: "Current p95: {{ $value }}ms. Check DB connections and slow queries."
            runbook_url: "https://wiki.internal/runbooks/stayledger/ApiLatencyHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-database"

        - alert: ApiOverallP95LatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_ms_bucket{job="stayledger-api"}[5m])) by (le)
            ) > 2500
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "API overall p95 latency above 2500ms"
            description: "Current p95: {{ $value }}ms. Check top slow routes, DB pool pressure, and recent deploys."
            runbook_url: "https://wiki.internal/runbooks/stayledger/ApiLatencyHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-api-perf"

        - alert: ApiWriteP99LatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_ms_bucket{job="stayledger-api",method="POST"}[5m])) by (le)
            ) > 4000
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "API write p99 latency above 4000ms"
            description: "Current p99: {{ $value }}ms. Possible overload — check DB locks and PgBouncer pool."
            runbook_url: "https://wiki.internal/runbooks/stayledger/ApiLatencyHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-api-perf"

        - alert: AuthLatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_ms_bucket{job="stayledger-api",route="/api/auth/login"}[5m])) by (le)
            ) > 1000
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Auth /login p95 latency above 1000ms"
            description: "Current p95: {{ $value }}ms. BCrypt or DB issue."
            runbook_url: "https://wiki.internal/runbooks/stayledger/AuthLatencyHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-api-perf"

    - name: stayledger.booking
      interval: 30s
      rules:
        - alert: BookingFailureRateHigh
          expr: |
            (
              sum(rate(booking_errors_total{job="stayledger-api"}[5m]))
              / clamp_min(sum(rate(booking_operations_total{job="stayledger-api",operation="created"}[5m])), 0.001)
              > 0.02
            )
            and sum(rate(booking_operations_total{job="stayledger-api"}[5m])) > 0.1
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Booking failure rate above 2%"
            description: "Error rate: {{ $value | humanizePercentage }}. Search Loki for booking errors."
            runbook_url: "https://wiki.internal/runbooks/stayledger/BookingFailureRateHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-booking"

        - alert: PaymentFailureRateHigh
          expr: |
            (
              sum(rate(payment_errors_total{job="stayledger-api"}[5m]))
              / clamp_min(sum(rate(payment_operations_total{job="stayledger-api"}[5m])), 0.001)
              > 0.02
            )
            and sum(rate(payment_operations_total{job="stayledger-api"}[5m])) > 0.1
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Payment failure rate above 2%"
            description: "Error rate: {{ $value | humanizePercentage }}. Check payment service logs."
            runbook_url: "https://wiki.internal/runbooks/stayledger/PaymentFailureRateHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-booking"

        - alert: BookingEngineFailureRateHigh
          expr: |
            (
              sum(rate(booking_engine_errors_total{job="stayledger-api"}[5m]))
              / clamp_min(sum(rate(booking_engine_requests_total{job="stayledger-api"}[5m])), 0.001)
              > 0.02
            )
            and sum(rate(booking_engine_requests_total{job="stayledger-api"}[5m])) > 0.1
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Booking engine failure rate above 2%"
            description: "Error rate: {{ $value | humanizePercentage }}. Check quote/create/status errors and public booking logs."
            runbook_url: "https://wiki.internal/runbooks/stayledger/BookingEngineFailureRateHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-booking"

        - alert: BookingEngineCreateP95LatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum(rate(booking_engine_request_duration_ms_bucket{job="stayledger-api",operation="create"}[5m])) by (le)
            ) > 2500
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Booking engine create p95 latency above 2500ms"
            description: "Current create p95: {{ $value }}ms. Check booking transaction, availability reserve, and DB locks."
            runbook_url: "https://wiki.internal/runbooks/stayledger/BookingEngineCreateLatencyHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-booking"

        - alert: BookingEngineInventoryConflictHigh
          expr: |
            (
              sum(rate(booking_engine_inventory_conflicts_total{job="stayledger-api"}[5m]))
              / clamp_min(sum(rate(booking_engine_requests_total{job="stayledger-api",operation="create"}[5m])), 0.001)
              > 0.10
            )
            and sum(rate(booking_engine_requests_total{job="stayledger-api",operation="create"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Booking engine inventory conflict rate above 10%"
            description: "Conflict rate: {{ $value | humanizePercentage }}. Check stale quotes, hot dates, and availability inventory."
            runbook_url: "https://wiki.internal/runbooks/stayledger/BookingEngineInventoryConflictHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-booking"

    - name: stayledger.external_api
      interval: 30s
      rules:
        - alert: ExternalApiReplayRejectionsHigh
          expr: |
            sum(rate(external_api_replay_rejected_total{job="stayledger-api"}[5m])) > 0.5
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Elevated external API replay rejections"
            description: "Partners may be sending expired/nonces or missing headers. Rate: {{ $value }}/s."
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-api-perf"

        - alert: ReportQueryP95LatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum(rate(report_query_duration_ms_bucket{job="stayledger-api"}[5m])) by (le)
            ) > 3000
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Report query p95 latency above 3000ms"
            description: "Current p95: {{ $value }}ms. Check DB indexes and report cache."
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-api-perf"

    - name: stayledger.ai
      interval: 60s
      rules:
        - alert: AiErrorRateHigh
          expr: |
            (
              sum(rate(ai_errors_total{job="stayledger-api"}[5m]))
              / clamp_min(sum(rate(ai_requests_total{job="stayledger-api"}[5m])), 0.001)
              > 0.03
            )
            and sum(rate(ai_requests_total{job="stayledger-api"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "AI error rate above 3%"
            description: "Error rate: {{ $value | humanizePercentage }}. Check Azure OpenAI quota/status."
            runbook_url: "https://wiki.internal/runbooks/stayledger/AiErrorRateHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-ai"

        - alert: AiP95LatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum(rate(ai_request_duration_ms_bucket{job="stayledger-api"}[5m])) by (le)
            ) > 5000
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "AI request p95 latency above 5s"
            description: "Current p95: {{ $value }}ms. Check OpenAI load and retry settings."
            runbook_url: "https://wiki.internal/runbooks/stayledger/AiLatencyHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-ai"

        - alert: AiTimeoutsHigh
          expr: |
            sum(rate(ai_errors_total{job="stayledger-api",error_code=~".*[Tt][Ii][Mm][Ee][Oo][Uu][Tt].*|ETIMEDOUT|ECONNRESET"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "AI timeout/error rate elevated"
            description: "AI timeout-like errors are above 0.05/s. Check provider latency, retry settings, and quota status."
            runbook_url: "https://wiki.internal/runbooks/stayledger/AiLatencyHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-ai"

        - alert: AiQuotaBlocksHigh
          expr: |
            sum(rate(http_requests_total{job="stayledger-api",route="/api/ai/chat",status="429"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "AI quota blocks elevated"
            description: "AI chat requests are being blocked by quota at {{ $value }}/s. Confirm paid-plan included units and notify the account team."
            runbook_url: "https://wiki.internal/runbooks/stayledger/AiTokenQuota"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-ai"

        - alert: AiTokenQuotaWarning
          expr: max(ai_quota_usage_percent{job="stayledger-api"}) > 80
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "AI token quota above 80%"
            description: "Max quota across properties: {{ $value }}%. Notify account team."
            runbook_url: "https://wiki.internal/runbooks/stayledger/AiTokenQuota"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-ai"

        - alert: AiTokenQuotaCritical
          expr: max(ai_quota_usage_percent{job="stayledger-api"}) > 95
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "AI token quota above 95% — approaching limit"
            description: "Max quota: {{ $value }}%. Throttle heavy users and notify stakeholders immediately."
            runbook_url: "https://wiki.internal/runbooks/stayledger/AiTokenQuota"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-ai"

    - name: stayledger.channel-manager
      interval: 30s
      rules:
        - alert: ChannelSyncFailureRateHigh
          expr: |
            (
              sum(rate(channel_sync_jobs_total{job="stayledger-api",status=~"failed|dlq"}[10m]))
              / clamp_min(sum(rate(channel_sync_jobs_total{job="stayledger-api"}[10m])), 0.001)
            ) > 0.2
            and sum(rate(channel_sync_jobs_total{job="stayledger-api"}[10m])) > 0.05
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Channel sync failure rate elevated"
            description: "Over 20% of channel sync jobs are failing/DLQ. Check mappings and connection health."
            runbook_url: "https://wiki.internal/runbooks/stayledger/ChannelManager"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-ai"

        - alert: ChannelSyncDlqBacklog
          expr: sum(increase(channel_sync_dlq_total{job="stayledger-api"}[1h])) > 5
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Channel sync DLQ backlog growing"
            description: "{{ $value }} channel sync job(s) landed in the DLQ in the last hour. Investigate and replay from the admin dashboard."
            runbook_url: "https://wiki.internal/runbooks/stayledger/ChannelManager"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-ai"

        - alert: ChannelAriPushStale
          expr: |
            sum(increase(channel_sync_jobs_total{job="stayledger-api",operation="ari.push",status="success"}[2h])) == 0
            and sum(increase(channel_sync_jobs_total{job="stayledger-api",operation="ari.push"}[24h])) > 0
          for: 30m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "No successful ARI push in 2h"
            description: "ARI pushes were attempted in the last 24h but none have succeeded in 2h. Check the OTA endpoint and worker."
            runbook_url: "https://wiki.internal/runbooks/stayledger/ChannelManager"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-ai"

    - name: stayledger.database
      interval: 30s
      rules:
        - alert: PostgresConnectionHigh
          expr: |
            sum(pg_stat_activity_count{job="postgres-exporter",datname="stayledger_staging"})
            / clamp_min(max(pg_settings_max_connections{job="postgres-exporter"}), 1)
            > 0.80
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "PostgreSQL connection usage above 80%"
            description: "{{ $value | humanizePercentage }} of max connections used. Check PgBouncer pool and long-running queries."
            runbook_url: "https://wiki.internal/runbooks/stayledger/PostgresConnectionHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-database"

        - alert: PgBouncerClientsWaiting
          # Metric name matches the spreaker pgbouncer-exporter (was pgbouncer_pools_cl_waiting,
          # which this exporter does not expose — the alert was blind).
          expr: sum(pgbouncer_pools_client_waiting_connections{job="pgbouncer-exporter"}) > 10
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "PgBouncer has more than 10 clients waiting"
            description: "{{ $value }} clients waiting for a server connection. Increase pool or scale API."
            runbook_url: "https://wiki.internal/runbooks/stayledger/PgBouncerSaturated"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-database"

        - alert: RedisMemoryHigh
          expr: redis_memory_max_bytes{job="redis-exporter"} > 0 and redis_memory_used_bytes{job="redis-exporter"} / redis_memory_max_bytes{job="redis-exporter"} > 0.85
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Redis memory usage above 85%"
            description: "{{ $value | humanizePercentage }} of maxmemory used. Check TTL settings and eviction policy."
            runbook_url: "https://wiki.internal/runbooks/stayledger/RedisMemoryHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-k8s"

    - name: stayledger.kubernetes
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: |
            rate(
              kube_pod_container_status_restarts_total{namespace="stayledger-staging"}[15m]
            ) > 0.2
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} restarting rapidly. Check logs immediately."
            runbook_url: "https://wiki.internal/runbooks/stayledger/PodCrashLooping"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-k8s"

        - alert: PodOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{
              reason="OOMKilled",
              namespace="stayledger-staging"
            } == 1
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Pod {{ $labels.pod }} was OOMKilled"
            description: "Container {{ $labels.container }} exceeded memory limit. Increase memory limit."
            runbook_url: "https://wiki.internal/runbooks/stayledger/PodOOMKilled"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-k8s"

        - alert: NodeDiskHigh
          expr: |
            (node_filesystem_size_bytes - node_filesystem_free_bytes)
            / node_filesystem_size_bytes
            > 0.80
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Node disk usage above 80%"
            description: "Disk usage: {{ $value | humanizePercentage }}. Clean old data or expand PersistentVolumes."
            runbook_url: "https://wiki.internal/runbooks/stayledger/NodeDiskHigh"
            dashboard_url: "http://10.89.1.40:30030/d/stayledger-k8s"
