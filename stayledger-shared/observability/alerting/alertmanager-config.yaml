apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: stayledger-alertmanager
  namespace: observability
  labels:
    release: kps
    app: stayledger
spec:
  route:
    receiver: slack-warnings
    groupBy: [alertname, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - receiver: slack-critical
        matchers:
          - name: severity
            value: critical
        continue: false

  receivers:
    - name: slack-warnings
      slackConfigs:
        - apiURL:
            # Reasoning: hub cluster already has `alertmanager-secrets` with
            # `slack_api_url`; do not invent a second secret name that never existed.
            name: alertmanager-secrets
            key: slack_api_url
          channel: "#stayledger-alerts"
          title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}
            *Summary:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Severity:* {{ .Labels.severity }}
            {{ if .Annotations.dashboard_url }}*Dashboard:* {{ .Annotations.dashboard_url }}{{ end }}
            {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
            {{ end }}
          sendResolved: true

    - name: slack-critical
      slackConfigs:
        - apiURL:
            name: alertmanager-secrets
            key: slack_api_url
          channel: "#stayledger-oncall"
          title: ':rotating_light: [CRITICAL] {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}
            *Summary:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            {{ if .Annotations.dashboard_url }}*Dashboard:* {{ .Annotations.dashboard_url }}{{ end }}
            {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
            {{ end }}
          sendResolved: true

# Slack webhook lives in secret `alertmanager-secrets` key `slack_api_url` (observability ns).
# Do not commit webhook URLs.
