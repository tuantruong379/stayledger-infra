# StayLedger Alertmanager routing — SES email to platform@stayledger.io.
# Reasoning: default-drop kube noise; only email StayLedger product alerts and criticals.
# Credentials: Secret alertmanager-smtp (observability); never commit SES keys.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: stayledger-alertmanager
  namespace: observability
  labels:
    release: kps
    app: stayledger
spec:
  route:
    # Reasoning: blackhole by default so KubePodNotReady / CPUThrottling do not flood platform@.
    receiver: "null"
    # Reasoning: group by env (Prometheus alertRelabelings) so staging/prod never share a group.
    groupBy: [alertname, severity, env]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      # Product / StayLedger-named alerts (any severity) → email
      - receiver: email-platform
        matchers:
          - name: alertname
            value: "^StayLedger.*"
            matchType: "=~"
        continue: true
      - receiver: email-platform
        matchers:
          - name: alertname
            value: "^(BackupJobFailed|DocumentBackup|AiWorker|AiOps|PmsAi|GuestChat).*"
            matchType: "=~"
        continue: true
      # All remaining criticals (incl. StayLedger critical) → critical template
      - receiver: email-platform-critical
        matchers:
          - name: severity
            value: critical
            matchType: "="
        continue: false

  receivers:
    - name: "null"
    - name: email-platform
      emailConfigs:
        - to: platform@stayledger.io
          from: noreply@stayledger.io
          smarthost: email-smtp.ap-southeast-1.amazonaws.com:587
          hello: stayledger.io
          requireTLS: true
          authUsername: ""
          authPassword:
            name: alertmanager-smtp
            key: smtp-password
          sendResolved: true
          # Reasoning: Subject shows env so inbox triage does not depend on body open.
          headers:
            - key: Subject
              value: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] [env={{ .CommonLabels.env }}] {{ .CommonLabels.alertname }} {{ .CommonLabels.severity }}'
          html: |
            <p><b>env:</b> {{ .CommonLabels.env }}{{ if .CommonLabels.cluster }} ({{ .CommonLabels.cluster }}){{ end }}</p>
            {{ range .Alerts }}
            <p><b>{{ .Labels.alertname }}</b> ({{ .Labels.severity }}) — env={{ .Labels.env }}</p>
            <p>{{ .Annotations.summary }}</p>
            <p>{{ .Annotations.description }}</p>
            {{ if .Annotations.runbook }}<p>Runbook: {{ .Annotations.runbook }}</p>{{ end }}
            {{ if .Annotations.dashboard_url }}<p>Dashboard: {{ .Annotations.dashboard_url }}</p>{{ end }}
            {{ end }}

    - name: email-platform-critical
      emailConfigs:
        - to: platform@stayledger.io
          from: noreply@stayledger.io
          smarthost: email-smtp.ap-southeast-1.amazonaws.com:587
          hello: stayledger.io
          requireTLS: true
          authUsername: ""
          authPassword:
            name: alertmanager-smtp
            key: smtp-password
          sendResolved: true
          headers:
            - key: Subject
              value: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] [env={{ .CommonLabels.env }}] CRITICAL {{ .CommonLabels.alertname }}'
          html: |
            <p><b>env:</b> {{ .CommonLabels.env }}{{ if .CommonLabels.cluster }} ({{ .CommonLabels.cluster }}){{ end }}</p>
            {{ range .Alerts }}
            <p><b>CRITICAL: {{ .Labels.alertname }}</b> — env={{ .Labels.env }}</p>
            <p>{{ .Annotations.summary }}</p>
            <p>{{ .Annotations.description }}</p>
            {{ if .Annotations.runbook }}<p>Runbook: {{ .Annotations.runbook }}</p>{{ end }}
            {{ end }}