# StayLedger Alertmanager routing — email to platform@stayledger.io via SES SMTP.
# Reasoning: product ops preference is SMTP email (not Slack). Credentials live in
# Secret alertmanager-smtp (observability ns); do not commit SMTP passwords or SES keys.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: stayledger-alertmanager
  namespace: observability
  labels:
    release: kps
    app: stayledger
spec:
  route:
    receiver: email-platform
    groupBy: [alertname, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - receiver: email-platform-critical
        matchers:
          - name: severity
            value: critical
        continue: false

  receivers:
    - name: email-platform
      emailConfigs:
        - to: platform@stayledger.io
          from: noreply@stayledger.io
          # SES SMTP (same endpoint family as PMS backup notify). Port 587 = STARTTLS.
          smarthost: email-smtp.ap-southeast-1.amazonaws.com:587
          hello: stayledger.io
          requireTLS: true
          # authUsername is CRD string (not SecretKeySelector on this operator).
          # Live value is synced from Secret alertmanager-smtp/smtp-user by apply script /
          # kubectl patch — never commit the SES access key id into git.
          authUsername: ""
          authPassword:
            name: alertmanager-smtp
            key: smtp-password
          sendResolved: true
          # Reasoning: avoid custom Subject headers with Go templates — some AM
          # versions fail notify when header templates do not expand cleanly.
          html: |
            {{ range .Alerts }}
            <p><b>{{ .Labels.alertname }}</b> ({{ .Labels.severity }})</p>
            <p>{{ .Annotations.summary }}</p>
            <p>{{ .Annotations.description }}</p>
            {{ if .Annotations.runbook }}<p>Runbook: {{ .Annotations.runbook }}</p>{{ end }}
            {{ if .Annotations.dashboard_url }}<p>Dashboard: {{ .Annotations.dashboard_url }}</p>{{ end }}
            {{ end }}

    - name: email-platform-critical
      emailConfigs:
        - to: platform@stayledger.io
          from: noreply@stayledger.io
          smarthost: email-smtp.ap-southeast-1.amazonaws.com:587
          hello: stayledger.io
          requireTLS: true
          authUsername: ""
          authPassword:
            name: alertmanager-smtp
            key: smtp-password
          sendResolved: true
          html: |
            {{ range .Alerts }}
            <p><b>CRITICAL: {{ .Labels.alertname }}</b></p>
            <p>{{ .Annotations.summary }}</p>
            <p>{{ .Annotations.description }}</p>
            {{ if .Annotations.runbook }}<p>Runbook: {{ .Annotations.runbook }}</p>{{ end }}
            {{ end }}
