# Appended to Prometheus alert_relabel_configs so every alert carries env=staging
# for Alertmanager email subject/body. Apply with kubectl; values are not secret
# but Secret is the CRD-required vehicle for additionalAlertRelabelConfigs.
apiVersion: v1
kind: Secret
metadata:
  name: stayledger-alert-relabel
  namespace: observability
  labels:
    app: stayledger
    release: kps
type: Opaque
stringData:
  config.yaml: |
    - target_label: env
      replacement: staging
      action: replace
