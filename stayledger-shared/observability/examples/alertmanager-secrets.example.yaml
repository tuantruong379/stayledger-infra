apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: observability
type: Opaque
stringData:
  # Slack Incoming Webhook URL used by alertmanager.global.slack_api_url_file
  slack_api_url: "REPLACE_ME"
  # PagerDuty Events API v2 integration key used by pagerduty_configs.routing_key_file
  pagerduty_routing_key: "REPLACE_ME"
