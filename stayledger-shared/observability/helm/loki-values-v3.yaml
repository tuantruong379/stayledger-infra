# Loki 3.x (grafana/loki chart) — single binary for on-prem observability.
# Replaces deprecated grafana/loki-stack subchart (Loki 2.x config schema).
#
# Install:
#   helm upgrade --install loki grafana/loki \
#     -n observability -f helm/loki-values-v3.yaml

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  image:
    tag: 3.4.2
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true
    discover_log_levels: true
    volume_enabled: true
    retention_period: 168h   # 7d staging
    max_query_series: 5000
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClassName: observability-sc
    size: 20Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

gateway:
  enabled: false

test:
  enabled: false

lokiCanary:
  enabled: false

chunksCache:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 200m, memory: 512Mi }

resultsCache:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 200m, memory: 256Mi }
