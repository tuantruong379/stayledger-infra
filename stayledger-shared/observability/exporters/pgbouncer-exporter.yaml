# PgBouncer metrics exporter for Prometheus
# Exposes pgbouncer_pools_*, pgbouncer_stats_*, pgbouncer_databases_*
# Image: spreaker/prometheus-pgbouncer-exporter
#
# Prerequisite: add a stats_user to pgbouncer.ini in pgbouncer-secret:
#   [pgbouncer]
#   stats_users = pgbouncer_exporter
#
# The exporter connects to PgBouncer's admin database using the stats user.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer-exporter
  namespace: observability
  labels:
    app: pgbouncer-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer-exporter
  template:
    metadata:
      labels:
        app: pgbouncer-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: pgbouncer-exporter
          image: spreaker/prometheus-pgbouncer-exporter:latest
          # This image reads a config file (NOT PGBOUNCER_EXPORTER_* env vars). The config —
          # which contains the DSN with the pgbouncer_exporter password — is mounted from the
          # `pgbouncer-exporter-config` Secret (created out-of-band; keep the password out of
          # ConfigMaps). bind host 0.0.0.0 so the pod accepts the Prometheus scrape.
          args: ["--config", "/etc/pgbouncer-exporter/config.yml"]
          ports:
            - containerPort: 9127
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer-exporter
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          secret:
            secretName: pgbouncer-exporter-config

---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-exporter
  namespace: observability
  labels:
    app: pgbouncer-exporter
spec:
  type: ClusterIP
  selector:
    app: pgbouncer-exporter
  ports:
    - name: metrics
      port: 9127
      targetPort: 9127
