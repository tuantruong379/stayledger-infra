# Production exporters targeting stayledger namespace datastores.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: observability
  labels:
    app: postgres-exporter
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-secret
                  key: data-source-name
          ports:
            - containerPort: 9187
              name: metrics
          # Meet observability LimitRange mins (50m CPU / 64Mi memory).
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 100m, memory: 128Mi }

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: observability
  labels:
    app: postgres-exporter
spec:
  type: ClusterIP
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: observability
  labels:
    app: redis-exporter
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0
          env:
            - name: REDIS_ADDR
              value: redis://stayledger-redis.stayledger.svc.cluster.local:6379
          ports:
            - containerPort: 9121
              name: metrics
          # Meet observability LimitRange mins (50m CPU / 64Mi memory).
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 100m, memory: 128Mi }

---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: observability
  labels:
    app: redis-exporter
spec:
  type: ClusterIP
  selector:
    app: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: 9121

---
# OBS-03: PgBouncer metrics. Requires secret pgbouncer-exporter-config (config.yml)
# and stats_users = pgbouncer_exporter in stayledger-pgbouncer-config + userlist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer-exporter
  namespace: observability
  labels:
    app: pgbouncer-exporter
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer-exporter
  template:
    metadata:
      labels:
        app: pgbouncer-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: pgbouncer-exporter
          image: spreaker/prometheus-pgbouncer-exporter:latest
          args: ["--config", "/etc/pgbouncer-exporter/config.yml"]
          ports:
            - containerPort: 9127
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer-exporter
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 100m, memory: 128Mi }
      volumes:
        - name: config
          secret:
            secretName: pgbouncer-exporter-config

---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-exporter
  namespace: observability
  labels:
    app: pgbouncer-exporter
spec:
  type: ClusterIP
  selector:
    app: pgbouncer-exporter
  ports:
    - name: metrics
      port: 9127
      targetPort: 9127
