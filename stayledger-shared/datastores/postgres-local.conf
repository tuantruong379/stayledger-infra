# PostgreSQL configuration for local Docker development
# Tuned for a dev workstation — significantly lower limits than production

listen_addresses = '*'
max_connections = 50

# Memory — assumes ~512 MB available for Postgres in dev
shared_buffers = 128MB
effective_cache_size = 512MB
maintenance_work_mem = 64MB
work_mem = 4MB

# WAL
wal_buffers = 4MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

# Query planner — Docker volumes on Windows are not SSDs
random_page_cost = 4.0
effective_io_concurrency = 1
default_statistics_target = 100

# Parallelism — keep low for dev to avoid noise
max_worker_processes = 2
max_parallel_workers_per_gather = 1
max_parallel_workers = 1

# Autovacuum — relaxed for dev
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 10

# Logging — log slow queries; no file collector needed in Docker
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 200
log_line_prefix = '%t [%p]: user=%u,db=%d '
log_statement = 'none'
log_lock_waits = on
deadlock_timeout = 1s

# Security
ssl = off
password_encryption = scram-sha-256

timezone = 'Asia/Ho_Chi_Minh'
