# Redis configuration for local Docker development
# password is injected at runtime via redis-entrypoint.sh (REDIS_PASSWORD env var)

bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 300
hz 10

# Local dev: 256 MB is sufficient; noeviction keeps BullMQ jobs safe
maxmemory 256mb
maxmemory-policy noeviction

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10

loglevel notice
maxclients 100
slowlog-log-slower-than 10000
slowlog-max-len 64
