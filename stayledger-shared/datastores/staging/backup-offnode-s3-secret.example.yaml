# backup-offnode-s3-secret.example.yaml — format reference only. NEVER commit a file with real keys.
# Copy this to backup-offnode-s3-secret.yaml (gitignored via **/*-secret.yaml), fill in the
# real values, then: kubectl apply -f backup-offnode-s3-secret.yaml
#
# S3_ENDPOINT must be the GENERIC regional endpoint — e.g.
# https://s3.ap-southeast-1.amazonaws.com — NOT a bucket-specific vhost URL. The CronJob script
# pairs this with `mc alias set ... --path on` (forced path-style) and always references
# objects as offnode/$S3_BUCKET/<key>. This is the only combination of endpoint-style +
# mc flags that was verified to work correctly via `mc --debug` (see comments in
# postgres-backup-offnode-cronjob.yaml for the two broken alternatives that were tried first).
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-offnode-s3
  namespace: stayledger-staging
type: Opaque
stringData:
  S3_ENDPOINT: https://s3.ap-southeast-1.amazonaws.com
  S3_BUCKET: REPLACE_WITH_BUCKET_NAME
  S3_PREFIX: stayledger/staging/postgres/
  S3_ACCESS_KEY_ID: REPLACE_WITH_ACCESS_KEY_ID
  S3_SECRET_ACCESS_KEY: REPLACE_WITH_SECRET_ACCESS_KEY
  RETENTION_DAYS: "30"
