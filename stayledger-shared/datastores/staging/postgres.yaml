---
# PersistentVolumeClaim for staging PostgreSQL data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stayledger-postgres-pvc
  namespace: stayledger-staging
  labels:
    app: stayledger-postgres
    component: database
    environment: staging
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage-hub-master-staging
  resources:
    requests:
      storage: 10Gi

---
# ConfigMap for staging PostgreSQL configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-postgres-config
  namespace: stayledger-staging
  labels:
    app: stayledger-postgres
    component: database
    environment: staging
data:
  POSTGRES_DB: "stayledger_staging"
  POSTGRES_USER: "stayledger_staging"
  POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"

  postgresql.conf: |
    # Staging PostgreSQL configuration (lighter than production)
    shared_buffers = 256MB
    effective_cache_size = 768MB
    maintenance_work_mem = 64MB
    work_mem = 8MB

    # P1A: per-statement query stats for slow-query review (requires restart +
    # `CREATE EXTENSION pg_stat_statements;` once on the DB). pgvector/pgvector:pg16
    # ships the contrib module, so only preloading + the extension are needed.
    shared_preload_libraries = 'pg_stat_statements'
    pg_stat_statements.max = 10000
    pg_stat_statements.track = top
    pg_stat_statements.track_utility = off

    checkpoint_completion_target = 0.9
    wal_buffers = 8MB
    max_wal_size = 1GB
    min_wal_size = 512MB

    listen_addresses = '*'
    # P1D retune: raised 100→150 so PgBouncer's max_db_connections=80 has headroom above
    # admin/migration/reserved backends. Pod memory limit raised to 1.5Gi to host the
    # extra backends safely (shared_buffers 256MB + ~80×work_mem worst case).
    max_connections = 150

    random_page_cost = 1.1
    effective_io_concurrency = 200
    default_statistics_target = 100

    max_worker_processes = 2
    max_parallel_workers_per_gather = 1
    max_parallel_workers = 1

    # Autovacuum
    autovacuum_vacuum_scale_factor = 0.10
    autovacuum_analyze_scale_factor = 0.05
    autovacuum_vacuum_cost_delay = 10

    # Logging
    log_destination = 'stderr'
    logging_collector = off
    log_min_duration_statement = 1000
    log_line_prefix = '%t [%p]: user=%u,db=%d '
    log_statement = 'none'
    log_lock_waits = on
    deadlock_timeout = 500ms

    ssl = off
    password_encryption = scram-sha-256

---
# StatefulSet for staging PostgreSQL
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stayledger-postgres
  namespace: stayledger-staging
  labels:
    app: stayledger-postgres
    component: database
    environment: staging
spec:
  serviceName: stayledger-postgres
  replicas: 1
  selector:
    matchLabels:
      app: stayledger-postgres
  template:
    metadata:
      labels:
        app: stayledger-postgres
        component: database
        environment: staging
    spec:
      nodeSelector:
        kubernetes.io/hostname: hkk8s-hub-master
      securityContext:
        fsGroup: 999
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          mkdir -p /var/lib/postgresql/data/pgdata
          chown -R 999:999 /var/lib/postgresql/data
          chmod -R 700 /var/lib/postgresql/data
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        securityContext:
          runAsUser: 0
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        # args (not command) so docker-entrypoint.sh still runs initdb on first start
        args: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: stayledger-postgres-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: stayledger-postgres-config
              key: POSTGRES_USER
        - name: POSTGRES_INITDB_ARGS
          valueFrom:
            configMapKeyRef:
              name: stayledger-postgres-config
              key: POSTGRES_INITDB_ARGS
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stayledger-staging-secrets
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /etc/postgresql/postgresql.conf
          subPath: postgresql.conf
        resources:
          requests:
            memory: "768Mi"
            cpu: "250m"
          limits:
            # P1D retune: raised 1Gi→1.5Gi to safely host up to ~80 backends
            # (max_db_connections=80) without OOM under mixed load.
            memory: "1536Mi"
            cpu: "750m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U stayledger_staging -d stayledger_staging
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U stayledger_staging -d stayledger_staging
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: postgres-config
        configMap:
          name: stayledger-postgres-config
      - name: postgres-data
        persistentVolumeClaim:
          claimName: stayledger-postgres-pvc

---
# Service for staging PostgreSQL (headless for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: stayledger-postgres
  namespace: stayledger-staging
  labels:
    app: stayledger-postgres
    component: database
    environment: staging
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: stayledger-postgres
