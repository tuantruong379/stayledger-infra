---
# ConfigMap for staging PgBouncer — pgbouncer.ini is mounted read-only into the container.
# The userlist.txt (credentials) is kept in a separate Secret (stayledger-pgbouncer-secret).
# Apply that secret first: see generate-secrets.ps1, which creates it alongside the main secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-pgbouncer-config
  namespace: stayledger-staging
  labels:
    app: stayledger-pgbouncer
    component: connection-pooler
    environment: staging
data:
  pgbouncer.ini: |
    [databases]
    stayledger_staging = host=stayledger-postgres.stayledger-staging.svc.cluster.local port=5432 dbname=stayledger_staging

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    ; plain: client sends cleartext, pgbouncer verifies against userlist.txt. Safe in-cluster (no external exposure).
    auth_type = plain
    auth_file = /etc/pgbouncer/userlist.txt

    ; transaction mode — apps must set pgbouncer=true in DATABASE_URL to disable prepared statements
    pool_mode = transaction

    max_client_conn = 200
    default_pool_size = 20
    min_pool_size = 2
    reserve_pool_size = 5
    reserve_pool_timeout = 3
    ; hard cap: never open more than 25 real Postgres connections (leaves 75 of max_connections=100 free)
    max_db_connections = 25

    server_idle_timeout = 600
    client_idle_timeout = 60

    log_stats = 1
    stats_period = 60

    server_tls_sslmode = disable
    client_tls_sslmode = disable

    ; Prisma sends extra_float_digits in its startup parameters; PgBouncer must ignore it
    ignore_startup_parameters = extra_float_digits

---
# Deployment for staging PgBouncer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-pgbouncer
  namespace: stayledger-staging
  labels:
    app: stayledger-pgbouncer
    component: connection-pooler
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stayledger-pgbouncer
  template:
    metadata:
      labels:
        app: stayledger-pgbouncer
        component: connection-pooler
        environment: staging
    spec:
      nodeSelector:
        kubernetes.io/hostname: hkk8s-hub-master
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:v1.25.2-p0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - name: pgbouncer
          containerPort: 5432
        env:
        - name: PGBOUNCER_AUTH_FILE
          value: /etc/pgbouncer/userlist.txt
        volumeMounts:
        - name: config
          mountPath: /etc/pgbouncer/pgbouncer.ini
          subPath: pgbouncer.ini
          readOnly: true
        - name: userlist
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
            ephemeral-storage: "16Mi"
          limits:
            memory: "128Mi"
            cpu: "500m"
            ephemeral-storage: "64Mi"
        livenessProbe:
          tcpSocket:
            port: pgbouncer
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: pgbouncer
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: stayledger-pgbouncer-config
      - name: userlist
        secret:
          secretName: stayledger-pgbouncer-secret
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi

---
# Service for staging PgBouncer — ClusterIP on port 5432 (matches container listen port)
apiVersion: v1
kind: Service
metadata:
  name: stayledger-pgbouncer
  namespace: stayledger-staging
  labels:
    app: stayledger-pgbouncer
    component: connection-pooler
    environment: staging
spec:
  type: ClusterIP
  ports:
  - name: pgbouncer
    port: 5432
    targetPort: pgbouncer
  selector:
    app: stayledger-pgbouncer
