# BK-4 — Off-node backup copy (S3) for production PostgreSQL.
# Schedule: 23:00 Asia/Ho_Chi_Minh (explicit timeZone). Uploads latest local dump, verifies, prunes remote.
# Target node: stayledger (same PVC as local backup).
# Email on success/fail → platform@stayledger.io via SES SMTP (notify sidecar).
#
# Prerequisites:
#   1. Local backup CronJob + PVC applied; at least one dump on PVC
#   2. Secret backup-offnode-s3 present
#   3. kubectl apply -f backup-notify-configmap.yaml
#   4. kubectl apply -f postgres-backup-offnode-cronjob.yaml
#
# IMPORTANT (AWS S3): S3_ENDPOINT must be https://s3.ap-southeast-1.amazonaws.com
# (generic regional); the script uses path-style addressing. Do not use bucket vhost URLs.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-postgres-backup-offnode-script
  namespace: stayledger
  labels:
    app: stayledger-postgres
    component: database-backup-offnode
    environment: production
data:
  offnode.sh: |
    #!/bin/sh
    # Upload latest dump to S3, then signal notify sidecar via /shared/*.
    set -eu
    SHARED="${SHARED_DIR:-/shared}"
    mkdir -p "${SHARED}"
    BACKUP_DIR=/backup
    RETENTION_DAYS="${RETENTION_DAYS:-30}"
    STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    NAME=""
    REMOTE_KEY=""

    finish() {
      ec=$?
      echo "${ec}" > "${SHARED}/status"
      if [ "${ec}" -eq 0 ]; then
        echo "postgres S3 backup ${NAME}" > "${SHARED}/subject"
        {
          echo "StayLedger Postgres S3 (off-node) backup SUCCEEDED"
          echo "started_at=${STARTED_AT}"
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "object=s3://${S3_BUCKET}/${REMOTE_KEY}"
          echo "retention_days=${RETENTION_DAYS}"
        } > "${SHARED}/body"
      else
        echo "postgres S3 backup FAILED" > "${SHARED}/subject"
        {
          echo "StayLedger Postgres S3 (off-node) backup FAILED"
          echo "started_at=${STARTED_AT}"
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "exit_code=${ec}"
          echo "bucket=${S3_BUCKET:-unset} prefix=${S3_PREFIX:-unset}"
          echo "Check: kubectl logs -n stayledger job/<job-name> -c offnode-copy"
        } > "${SHARED}/body"
      fi
      touch "${SHARED}/done"
      exit "${ec}"
    }
    trap finish EXIT

    LATEST=$(ls -1t ${BACKUP_DIR}/stayledger_*.dump 2>/dev/null | head -1 || true)
    if [ -z "${LATEST}" ]; then
      echo "[offnode] ERROR: no local backup dump found in ${BACKUP_DIR} (run local backup first)"
      exit 1
    fi
    NAME=$(basename "${LATEST}")
    REMOTE_KEY="${S3_PREFIX}${NAME}"
    echo "[offnode] uploading ${NAME} to ${S3_BUCKET}/${S3_PREFIX} at ${STARTED_AT}"
    SUM=$(md5sum "${LATEST}")
    echo "${SUM%% *}" > "/tmp/${NAME}.md5"
    # aws-cli, not mc: docker.io/minio/mc was withdrawn (~2026-09-11) and quay.io/minio/mc
    # has answered 401 to anonymous pulls since ~2026-09-25.
    REGION=$(echo "${S3_ENDPOINT}" | sed -n 's#.*s3[.-]\([a-z0-9-]*\)\.amazonaws\.com.*#\1#p')
    export AWS_ACCESS_KEY_ID="${S3_ACCESS_KEY_ID}" AWS_SECRET_ACCESS_KEY="${S3_SECRET_ACCESS_KEY}"
    export AWS_DEFAULT_REGION="${REGION:-ap-southeast-1}"
    aws configure set default.s3.addressing_style path
    S3="aws --endpoint-url ${S3_ENDPOINT}"
    ${S3} s3 cp --only-show-errors "${LATEST}" "s3://${S3_BUCKET}/${S3_PREFIX}${NAME}"
    ${S3} s3 cp --only-show-errors "/tmp/${NAME}.md5" "s3://${S3_BUCKET}/${S3_PREFIX}${NAME}.md5"
    ${S3} s3api head-object --bucket "${S3_BUCKET}" --key "${S3_PREFIX}${NAME}" >/dev/null
    echo "[offnode] verified remote ${S3_PREFIX}${NAME}"
    CUTOFF=$(date -u -d "@$(( $(date +%s) - RETENTION_DAYS * 86400 ))" +%Y-%m-%dT%H:%M:%S)
    ${S3} s3api list-objects-v2 --bucket "${S3_BUCKET}" --prefix "${S3_PREFIX}stayledger_" \
      --query "Contents[?LastModified<'${CUTOFF}'].Key" --output text 2>/dev/null \
      | tr '\t' '\n' | grep -E '\.dump(\.md5)?$' | while read -r KEY; do
          ${S3} s3 rm --only-show-errors "s3://${S3_BUCKET}/${KEY}" || true
        done || true
    echo "[offnode] done at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stayledger-postgres-backup-offnode
  namespace: stayledger
  labels:
    app: stayledger-postgres
    component: database-backup-offnode
    environment: production
spec:
  schedule: "0 23 * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1  # matches live (was changed on-cluster, never in git)
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: stayledger-postgres
            component: database-backup-offnode
            environment: production
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: stayledger
          securityContext:
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: offnode-copy
              image: amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab  # aws-cli: minio/mc is no longer pullable anonymously (docker.io withdrawn, quay.io 401)
              command: ["/bin/sh", "/scripts/offnode.sh"]  # image entrypoint is `aws`
              env:
                - name: HOME
                  value: /tmp
                - name: SHARED_DIR
                  value: /shared
              envFrom:
                - secretRef:
                    name: backup-offnode-s3
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
                  readOnly: true
                - name: script
                  mountPath: /scripts/offnode.sh
                  subPath: offnode.sh
                - name: shared
                  mountPath: /shared
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
            - name: notify
              image: python:3.12-alpine
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: BACKUP_NOTIFY_ENV
                  value: Production
                - name: BACKUP_NOTIFY_TO
                  value: platform@stayledger.io
                - name: EMAIL_FROM
                  value: noreply@stayledger.io
                - name: SMTP_HOST
                  value: email-smtp.ap-southeast-1.amazonaws.com
                - name: SMTP_PORT
                  value: "465"
                - name: SMTP_USER
                  valueFrom:
                    secretKeyRef:
                      name: stayledger-secrets
                      key: smtp-user
                - name: SMTP_PASS
                  valueFrom:
                    secretKeyRef:
                      name: stayledger-secrets
                      key: smtp-password
              command: ["python3", "/scripts/notify.py"]
              volumeMounts:
                - name: notify-script
                  mountPath: /scripts/notify.py
                  subPath: notify.py
                - name: shared
                  mountPath: /shared
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: stayledger-postgres-backup-pvc
            - name: script
              configMap:
                name: stayledger-postgres-backup-offnode-script
                defaultMode: 0755
            - name: notify-script
              configMap:
                name: stayledger-backup-notify-script
                defaultMode: 0755
            - name: shared
              emptyDir:
                medium: Memory
                sizeLimit: 8Mi
