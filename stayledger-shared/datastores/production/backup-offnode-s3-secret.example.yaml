# backup-offnode-s3-secret.example.yaml — format reference only. NEVER commit a file with real keys.
# Copy this to backup-offnode-s3-secret.yaml (gitignored via **/*-secret.yaml), fill in the
# REPLACE_* values, then:
#   kubectl apply -f backup-offnode-s3-secret.yaml
#
# Used by CronJob stayledger-postgres-backup-offnode (Postgres dump → S3).
#
# S3_ENDPOINT must be the GENERIC regional endpoint
# (https://s3.ap-southeast-1.amazonaws.com), NOT a bucket-specific vhost URL.
# The CronJob uses `mc alias set ... --path on` (path-style).
#
# IAM needs: s3:PutObject, s3:GetObject, s3:DeleteObject, s3:ListBucket on prd-stayledger-pms.
#
# RETENTION_DAYS = S3 remote prune only. Local PVC retention is separate
# (BACKUP_RETENTION_DAYS=2 on stayledger-postgres-backup CronJob).
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-offnode-s3
  namespace: stayledger
type: Opaque
stringData:
  S3_ENDPOINT: https://s3.ap-southeast-1.amazonaws.com
  S3_BUCKET: prd-stayledger-pms
  S3_PREFIX: stayledger/production/postgres/
  S3_ACCESS_KEY_ID: REPLACE_WITH_ACCESS_KEY_ID
  S3_SECRET_ACCESS_KEY: REPLACE_WITH_SECRET_ACCESS_KEY
  RETENTION_DAYS: "30"
