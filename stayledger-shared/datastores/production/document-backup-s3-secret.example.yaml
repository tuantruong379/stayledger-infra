# document-backup-s3-secret.example.yaml — format reference only. NEVER commit a file with real keys.
# Copy this to document-backup-s3-secret.yaml (gitignored via **/*-secret.yaml), fill in the
# REPLACE_* values, then:
#   kubectl apply -f document-backup-s3-secret.yaml
#
# Used by CronJob stayledger-document-backup-offnode (encrypted guest documents → S3).
# Secret name in cluster must remain: stayledger-document-backup-s3
#
# encryption-passphrase MUST match stayledger-secrets.document-backup-password.
# To copy it (do not paste into chat/logs):
#   kubectl get secret stayledger-secrets -n stayledger \
#     -o jsonpath='{.data.document-backup-password}' |
#     ForEach-Object { [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($_)) }
#
# IAM needs: s3:PutObject, s3:GetObject, s3:ListBucket on prd-stayledger-pms
# under prefix production/guest-documents/ (staging uses guest-documents/).
---
apiVersion: v1
kind: Secret
metadata:
  name: stayledger-document-backup-s3
  namespace: stayledger
type: Opaque
stringData:
  bucket: prd-stayledger-pms
  access-key-id: REPLACE_WITH_ACCESS_KEY_ID
  secret-access-key: REPLACE_WITH_SECRET_ACCESS_KEY
  region: ap-southeast-1
  encryption-passphrase: REPLACE_WITH_DOCUMENT_BACKUP_PASSWORD
