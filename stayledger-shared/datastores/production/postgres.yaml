---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stayledger-postgres-pvc
  namespace: stayledger
  labels:
    app: stayledger-postgres
    component: database
    environment: production
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage-stayledger
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-postgres-config
  namespace: stayledger
  labels:
    app: stayledger-postgres
    component: database
    environment: production
data:
  POSTGRES_DB: "stayledger"
  POSTGRES_USER: "stayledger"
  POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"

  postgresql.conf: |
    # Production: tuned for 2Gi memory limit
    shared_buffers = 512MB
    effective_cache_size = 1536MB
    maintenance_work_mem = 128MB
    work_mem = 16MB

    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    max_wal_size = 2GB
    min_wal_size = 1GB

    listen_addresses = '*'
    max_connections = 100

    random_page_cost = 1.1
    effective_io_concurrency = 200
    default_statistics_target = 200

    max_worker_processes = 4
    max_parallel_workers_per_gather = 1
    max_parallel_workers = 2

    autovacuum_vacuum_scale_factor = 0.05
    autovacuum_analyze_scale_factor = 0.02
    autovacuum_vacuum_cost_delay = 2

    log_destination = 'stderr'
    logging_collector = off
    log_min_duration_statement = 500
    log_line_prefix = '%t [%p]: user=%u,db=%d '
    log_statement = 'none'
    log_lock_waits = on
    deadlock_timeout = 250ms

    ssl = off
    password_encryption = scram-sha-256

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stayledger-postgres
  namespace: stayledger
  labels:
    app: stayledger-postgres
    component: database
    environment: production
spec:
  serviceName: stayledger-postgres
  replicas: 1
  selector:
    matchLabels:
      app: stayledger-postgres
  template:
    metadata:
      labels:
        app: stayledger-postgres
        component: database
        environment: production
    spec:
      nodeSelector:
        # stayledger k3s production node (was hkk8s-hub-master on hub cluster)
        kubernetes.io/hostname: stayledger
      securityContext:
        fsGroup: 999
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          mkdir -p /var/lib/postgresql/data/pgdata
          chown -R 999:999 /var/lib/postgresql/data
          chmod -R 700 /var/lib/postgresql/data
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        securityContext:
          runAsUser: 0
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        args: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: stayledger-postgres-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: stayledger-postgres-config
              key: POSTGRES_USER
        - name: POSTGRES_INITDB_ARGS
          valueFrom:
            configMapKeyRef:
              name: stayledger-postgres-config
              key: POSTGRES_INITDB_ARGS
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /etc/postgresql/postgresql.conf
          subPath: postgresql.conf
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "pg_isready -U stayledger -d stayledger"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "pg_isready -U stayledger -d stayledger"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: postgres-config
        configMap:
          name: stayledger-postgres-config
      - name: postgres-data
        persistentVolumeClaim:
          claimName: stayledger-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: stayledger-postgres
  namespace: stayledger
  labels:
    app: stayledger-postgres
    component: database
    environment: production
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: stayledger-postgres
