---
# Local PVs for the stayledger production k3s cluster (single node: stayledger @ 103.20.96.122).
# Prereq on node (SSH):
#   sudo mkdir -p /mnt/data/stayledger/{postgres,redis,guest-documents,postgres-backup}
#   sudo chown -R 999:999 /mnt/data/stayledger/postgres
#   sudo chown -R 999:999 /mnt/data/stayledger/redis
#   sudo chown -R 999:999 /mnt/data/stayledger/postgres-backup
#   sudo chown -R 1001:1001 /mnt/data/stayledger/guest-documents
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage-stayledger
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: stayledger-postgres-pv
  labels:
    type: local
    app: stayledger-postgres
    environment: production
spec:
  storageClassName: local-storage-stayledger
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/data/stayledger/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - stayledger

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: stayledger-redis-pv
  labels:
    type: local
    app: stayledger-redis
    environment: production
spec:
  storageClassName: local-storage-stayledger
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/data/stayledger/redis
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - stayledger

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: stayledger-production-guest-documents-pv
  labels:
    type: local
    app: stayledger-api
    component: guest-documents
    environment: production
spec:
  storageClassName: local-storage-stayledger
  # Sized for shared node capacity (observability + AI assistant also need disk).
  capacity:
    storage: 40Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/data/stayledger/guest-documents
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - stayledger
