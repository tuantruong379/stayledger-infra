---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stayledger-redis-pvc
  namespace: stayledger
  labels:
    app: stayledger-redis
    component: cache
    environment: production
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage-stayledger
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-redis-config
  namespace: stayledger
  labels:
    app: stayledger-redis
    component: cache
    environment: production
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode no
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    hz 20

    # noeviction: never evict keys — BullMQ jobs must not be silently dropped
    maxmemory 1gb
    maxmemory-policy noeviction

    lazyfree-lazy-eviction yes
    lazyfree-lazy-expire yes
    lazyfree-lazy-server-del yes
    lazyfree-lazy-user-del yes

    appendonly yes
    appendfsync everysec
    no-appendfsync-on-rewrite yes
    auto-aof-rewrite-percentage 50
    auto-aof-rewrite-min-size 32mb

    save 900 1
    save 300 10
    save 60 10000

    loglevel notice
    maxclients 10000
    slowlog-log-slower-than 10000
    slowlog-max-len 128

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-redis
  namespace: stayledger
  labels:
    app: stayledger-redis
    component: cache
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stayledger-redis
  template:
    metadata:
      labels:
        app: stayledger-redis
        component: cache
        environment: production
    spec:
      nodeSelector:
        # stayledger k3s production node (was hkk8s-hub-master on hub cluster)
        kubernetes.io/hostname: stayledger
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: redis-password
              optional: true
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /usr/local/etc/redis/redis.conf
          subPath: redis.conf
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: stayledger-redis-pvc
      - name: redis-config
        configMap:
          name: stayledger-redis-config

---
apiVersion: v1
kind: Service
metadata:
  name: stayledger-redis
  namespace: stayledger
  labels:
    app: stayledger-redis
    component: cache
    environment: production
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: stayledger-redis
