# pgbouncer-secret.example.yaml — format reference only. NEVER commit a file with real passwords.
# The real secret is generated by generate-secrets.ps1 and applied automatically.
#
# userlist.txt format: one line per user — "username" "password" (plain text, quoted)
# PgBouncer uses this file to authenticate clients connecting to it.
---
apiVersion: v1
kind: Secret
metadata:
  name: stayledger-pgbouncer-secret
  namespace: stayledger
type: Opaque
stringData:
  userlist.txt: |
    "stayledger" "REPLACE_WITH_POSTGRES_PASSWORD"
