# pg_dump backup CronJob for StayLedger PMS PostgreSQL (production).
# Schedule: 02:00 Asia/Ho_Chi_Minh = 19:00 UTC — align with BACKUP_SCHEDULE in stayledger-api ConfigMap.
#
# Prerequisites on hkk8s-hub-master:
#   mkdir -p /mnt/data/stayledger/postgres-backup
#   chown 999:999 /mnt/data/stayledger/postgres-backup
#
# Apply after postgres StatefulSet:
#   kubectl apply -f stayledger-shared/datastores/prd/postgres-backup-cronjob.yaml
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: stayledger-postgres-backup-pv
  labels:
    type: local
    app: stayledger-postgres
    component: database-backup
    environment: production
spec:
  storageClassName: local-storage-hub-master
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/data/stayledger/postgres-backup
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - hkk8s-hub-master
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stayledger-postgres-backup-pvc
  namespace: stayledger
  labels:
    app: stayledger-postgres
    component: database-backup
    environment: production
spec:
  storageClassName: local-storage-hub-master
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-postgres-backup-script
  namespace: stayledger
  labels:
    app: stayledger-postgres
    component: database-backup
    environment: production
data:
  backup.sh: |
    #!/bin/bash
    set -euo pipefail

    BACKUP_DIR="/backup"
    DB_HOST="stayledger-postgres"
    DB_PORT="5432"
    DB_NAME="stayledger"
    RETENTION_DAYS="${BACKUP_RETENTION_DAYS:-30}"
    TIMESTAMP=$(date +%Y-%m-%d)
    DUMP_FILE="${BACKUP_DIR}/stayledger_${TIMESTAMP}.dump"

    echo "[backup] Starting pg_dump for ${DB_NAME} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

    for i in $(seq 1 30); do
      pg_isready -h "${DB_HOST}" -p "${DB_PORT}" -U "${POSTGRES_USER}" && break
      echo "[backup] Waiting for Postgres… (${i}/30)"
      sleep 2
    done

    export PGPASSWORD="${POSTGRES_PASSWORD}"
    pg_dump \
      -h "${DB_HOST}" \
      -p "${DB_PORT}" \
      -U "${POSTGRES_USER}" \
      -d "${DB_NAME}" \
      -Fc \
      -f "${DUMP_FILE}"

    echo "[backup] Dump written: ${DUMP_FILE} ($(du -sh "${DUMP_FILE}" | cut -f1))"

    find "${BACKUP_DIR}" -name "stayledger_*.dump" -mtime +"${RETENTION_DAYS}" -print -delete || true

    echo "[backup] Finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stayledger-postgres-backup
  namespace: stayledger
  labels:
    app: stayledger-postgres
    component: database-backup
    environment: production
spec:
  schedule: "0 19 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: stayledger-postgres
            component: database-backup
            environment: production
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: pgvector/pgvector:pg16
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    configMapKeyRef:
                      name: stayledger-postgres-config
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: stayledger-secrets
                      key: postgres-password
                - name: BACKUP_RETENTION_DAYS
                  value: "30"
              command: ["/bin/bash", "/scripts/backup.sh"]
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
                - name: backup-script
                  mountPath: /scripts/backup.sh
                  subPath: backup.sh
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: stayledger-postgres-backup-pvc
            - name: backup-script
              configMap:
                name: stayledger-postgres-backup-script
                defaultMode: 0755
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 32Mi
