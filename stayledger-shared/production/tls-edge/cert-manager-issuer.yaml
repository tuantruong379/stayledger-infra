# ClusterIssuer for Let's Encrypt on the stayledger (k3s) production cluster.
# Traefik is the IngressClass — not nginx.
#
# Install cert-manager first (once per cluster):
#   kubectl --context stayledger apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.0/cert-manager.yaml
#   kubectl --context stayledger -n cert-manager rollout status deploy/cert-manager
#
# Then:
#   kubectl --context stayledger apply -f stayledger-shared/production/tls-edge/cert-manager-issuer.yaml
#
# Cloudflare note: keep "Always Use HTTPS" OFF until the Certificate is Ready,
# or add a Page Rule bypass for /.well-known/acme-challenge/*. HTTP-01 needs
# plain HTTP to reach Traefik. Prefer DNS-01 later if Always Use HTTPS must stay on.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: stayledger-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: truonglamtuan@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik

---
# Staging ACME directory — use for dry-runs to avoid Let's Encrypt rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/part-of: stayledger-production
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: truonglamtuan@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
