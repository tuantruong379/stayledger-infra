# Appended to Prometheus alert_relabel_configs so every alert carries env=production
# for Alertmanager email subject/body.
apiVersion: v1
kind: Secret
metadata:
  name: stayledger-alert-relabel
  namespace: observability
  labels:
    app: stayledger
    release: kps
type: Opaque
stringData:
  config.yaml: |
    - target_label: env
      replacement: production
      action: replace
