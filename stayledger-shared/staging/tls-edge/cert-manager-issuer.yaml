# ClusterIssuer for Let's Encrypt production certificates.
# Apply once per cluster (idempotent) before stayledger-shared/staging/ingress.yaml:
#
#   kubectl apply -f stayledger-shared/staging/tls-edge/cert-manager-issuer.yaml
#
# Prerequisites: cert-manager + nginx ingress controller installed.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: stayledger-staging
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: truonglamtuan@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
