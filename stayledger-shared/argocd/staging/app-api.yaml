---
# ArgoCD Application — Staging API (NestJS)
# Manages: ConfigMap, Deployment, ClusterIP Service, NodePort Service
# Migration Job is a PreSync hook — runs automatically before each sync.
#
# Apply after app-infrastructure is healthy.
#
# Usage:
#   kubectl apply -f argocd/staging/app-api.yaml
#
# To trigger a new deployment after pushing a new image tag, update the image
# in k8s/staging/deployment.yaml on the staging branch and push:
#   sed -i "s|putin111/stayledger-api:.*|putin111/stayledger-api:<NEW_SHA>|g" \
#     k8s/staging/deployment.yaml k8s/staging/migration-job.yaml
#   git commit -am "deploy: staging-<NEW_SHA>" && git push
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stayledger-staging-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: stayledger-staging
    app.kubernetes.io/component: api
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:tuantruong379/stayledger-api.git
    targetRevision: staging
    path: k8s/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: stayledger-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - ServerSideApply=true
