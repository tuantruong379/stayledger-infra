---
# ArgoCD Application — Staging shared infrastructure
# Manages: namespace, persistent volumes, PostgreSQL, Redis
# Apply first, before app-api and app-admin-web.
#
# Usage:
#   kubectl apply -f argocd/staging/app-infrastructure.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stayledger-staging-infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: stayledger-staging
    app.kubernetes.io/component: infrastructure
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:tuantruong379/stayledger-shared.git
    targetRevision: staging
    path: k8s/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: stayledger-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - ServerSideApply=true
