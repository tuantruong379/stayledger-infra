---
# ArgoCD server runtime parameters.
# server.insecure: "true" makes argocd-server serve plain HTTP instead of TLS.
# Safe for a single-node staging cluster accessed via NodePort + internal IP.
# Do NOT use in production — use a proper TLS certificate there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
data:
  server.insecure: "true"
