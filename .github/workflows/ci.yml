name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned versions — see docs/guides/stayledger-ci-standard.md
env:
  KUBECTL_VERSION: "v1.35.3"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0   # Gitleaks scans full commit history

      - name: Gitleaks secret scan
        run: |
          curl -sSfL \
            --retry 5 --retry-delay 10 --retry-all-errors --max-time 180 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source=. --config=.gitleaks.toml --exit-code=1

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Trivy filesystem scan
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Publish Trivy filesystem summary
        if: always()
        run: |
          echo "## Trivy Filesystem Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -s trivy-fs-report.txt ]; then
            if grep -Eq 'Total: [1-9][0-9]*' trivy-fs-report.txt; then
              echo "::error::Trivy filesystem scan found HIGH/CRITICAL findings. CI is failing."
              echo "**Status:** FAIL — HIGH/CRITICAL findings found. Fix before merging." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**Status:** PASS — no HIGH/CRITICAL findings." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,240p' trivy-fs-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Status:** PASS — no findings reported." >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: Manifest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install kubectl
        run: |
          curl -sSfL \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            -o kubectl
          chmod +x kubectl
          ./kubectl version --client --output=yaml

      # ── Semantic checks ──────────────────────────────────────────────────────

      - name: No staging references in production manifests
        run: |
          set -e
          FOUND=$(grep -rn \
            "stayledger-staging\|stg-app\|stg-api\|:30010\|:30011\|tekcent\.com" \
            stayledger-api/production/ \
            stayledger-admin-web/production/ \
            stayledger-shared/production/ \
            stayledger-shared/datastores/production/ \
            2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Staging references found in production manifests:"
            echo "$FOUND"
            exit 1
          fi
          echo "PASS — no staging references in production manifests."

      - name: Production ConfigMap correctness
        run: |
          set -e
          CONFIG="stayledger-api/production/configmap.yaml"

          if ! grep -q 'SWAGGER_ENABLED.*"false"' "$CONFIG"; then
            echo "::error::SWAGGER_ENABLED must be \"false\" in $CONFIG"
            exit 1
          fi
          if ! grep -q 'APP_ENV.*"production"' "$CONFIG"; then
            echo "::error::APP_ENV must be \"production\" in $CONFIG"
            exit 1
          fi
          if grep -q 'THROTTLE_LIMIT.*"6000"' "$CONFIG"; then
            echo "::error::THROTTLE_LIMIT is 6000 (staging k6 headroom value) in $CONFIG — must be <= 1000 for production"
            exit 1
          fi
          echo "PASS — production ConfigMap values correct."

      - name: ALLOWED_ORIGINS is production domain
        run: |
          set -e
          DEPLOY="stayledger-api/production/deployment.yaml"
          if grep -q "stg-app\|tekcent" "$DEPLOY"; then
            echo "::error::ALLOWED_ORIGINS in $DEPLOY contains staging/tekcent domain"
            exit 1
          fi
          if ! grep -q "app\.stayledger\.io" "$DEPLOY"; then
            echo "::error::ALLOWED_ORIGINS in $DEPLOY does not reference app.stayledger.io"
            exit 1
          fi
          echo "PASS — ALLOWED_ORIGINS correct."

      - name: Production namespaces are 'stayledger'
        run: |
          set -e
          BAD=$(grep -rn 'namespace:' \
            stayledger-api/production/ \
            stayledger-admin-web/production/ \
            stayledger-shared/production/ \
            stayledger-shared/datastores/production/ \
            2>/dev/null \
            | grep -v 'stayledger$' \
            | grep -v '^\s*#' \
            | grep -v 'kube-system\|observability\|cert-manager' \
            || true)
          if [ -n "$BAD" ]; then
            echo "::error::Unexpected namespace values in production manifests:"
            echo "$BAD"
            exit 1
          fi
          echo "PASS — all production manifests use namespace 'stayledger'."

      # ── kubectl client-side dry-run ──────────────────────────────────────────

      - name: kubectl dry-run — API production
        run: |
          set -e
          ./kubectl apply -f stayledger-api/production/ --dry-run=client 2>&1
          echo "PASS — stayledger-api/production/"

      - name: kubectl dry-run — Admin-web production
        run: |
          set -e
          ./kubectl apply -f stayledger-admin-web/production/ --dry-run=client 2>&1
          echo "PASS — stayledger-admin-web/production/"

      - name: kubectl dry-run — Shared production
        run: |
          set -e
          ./kubectl apply -f stayledger-shared/production/ --dry-run=client 2>&1
          echo "PASS — stayledger-shared/production/"

      - name: kubectl dry-run — Datastores production
        run: |
          set -e
          # kubectl skips non-YAML files (generate-secrets.ps1, README.md) automatically
          ./kubectl apply -f stayledger-shared/datastores/production/ --dry-run=client 2>&1
          echo "PASS — stayledger-shared/datastores/production/"

      - name: Publish validation summary
        if: always()
        run: |
          echo "## Manifest Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Directories validated:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`stayledger-api/production/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`stayledger-admin-web/production/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`stayledger-shared/production/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`stayledger-shared/datastores/production/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Semantic checks: no-staging-refs, ConfigMap values, ALLOWED_ORIGINS, namespace" >> "$GITHUB_STEP_SUMMARY"
          echo "kubectl client-side dry-run: all four production directories" >> "$GITHUB_STEP_SUMMARY"
