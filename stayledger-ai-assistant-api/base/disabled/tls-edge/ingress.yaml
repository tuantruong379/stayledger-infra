# Phase C TLS edge — applied AFTER ``kubectl apply -k k8s/onprem/`` once
# nginx-ingress (or your edge controller) is installed and ``letsencrypt-prod``
# ClusterIssuer (see ``cert-manager-issuer.yaml`` in this folder) is reachable.
#
# When re-enabled at ``k8s/onprem/ingress.yaml``:
#   kubectl apply -f k8s/onprem/cert-manager-issuer.yaml
#   kubectl apply -f k8s/onprem/ingress.yaml
#
# The Ingress fronts the ``stayledger-ai-assistant-api`` Service (port 8000). Replace
# ``stayledger-ai-assistant.tekcent.com`` with your real public host before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stayledger-ai-assistant-api
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-api
    app.kubernetes.io/part-of: stayledger-ai-assistant
  annotations:
    # Reasoning: ClusterIssuer name must match cert-manager-issuer.yaml below.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Reasoning: webhook + admin endpoints need slightly larger payloads.
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    # Reasoning: chat turns can take ~30s when the LLM is slow; keep proxy timeout aligned with WEBHOOK_CHAT_TURN_TIMEOUT_S.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - stayledger-ai-assistant.tekcent.com
      secretName: stayledger-ai-assistant-tls
  rules:
    - host: stayledger-ai-assistant.tekcent.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stayledger-ai-assistant-api
                port:
                  number: 8000
