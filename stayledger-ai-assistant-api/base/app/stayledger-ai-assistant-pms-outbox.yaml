# Singleton PMS outbox worker. Keep replicas=0 until Phase 9 re-enable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-assistant-pms-outbox
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-pms-outbox
    app.kubernetes.io/part-of: stayledger-ai-assistant
spec:
  replicas: 0
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stayledger-ai-assistant-pms-outbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stayledger-ai-assistant-pms-outbox
        app.kubernetes.io/part-of: stayledger-ai-assistant
    spec:
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pms-outbox
          image: putin111/stayledger-ai-assistant-api:3.0.11
          imagePullPolicy: IfNotPresent
          command: ["/venv/bin/python", "-m", "app.workers.pms_outbox_worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: stayledger-ai-assistant-api-config
            - secretRef:
                name: stayledger-ai-assistant-api-secrets
          env:
            - name: PMS_OUTBOX_WORKER_ENABLED
              value: "1"
            - name: PMS_WORKERS_IN_API
              value: "0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            exec:
              command: ["sh", "-c", "test -d /proc/1"]
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -d /proc/1"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
