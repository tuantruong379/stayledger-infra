# Durable raw-source processing worker. It claims kb_processing_runs with
# SKIP LOCKED and reclaims stale leases after a pod interruption.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-kb-raw-processing-worker
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-kb-raw-processing-worker
    app.kubernetes.io/part-of: stayledger-ai-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hotel-assistant-kb-raw-processing-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hotel-assistant-kb-raw-processing-worker
        app.kubernetes.io/part-of: stayledger-ai-assistant
    spec:
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kb-raw-processing-worker
          image: putin111/ai-hotel-assistant:latest
          imagePullPolicy: IfNotPresent
          command: ["/venv/bin/python", "-m", "app.workers.kb_raw_processing_worker"]
          envFrom:
            - configMapRef:
                name: hotel-assistant-api-config
            - secretRef:
                name: hotel-assistant-api-secrets
          env:
            - name: RAG_KB_PROCESSING_WORKER_POLL_SECONDS
              value: "5"
            - name: RAG_KB_PROCESSING_STUCK_TIMEOUT_SECONDS
              value: "900"
            - name: RAG_QUALITY_DATASET_PATH
              value: /app/tests/evals/rag_leakage/staging.v1.jsonl
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            exec:
              command: ["sh", "-c", "test -d /proc/1"]
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -d /proc/1"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
