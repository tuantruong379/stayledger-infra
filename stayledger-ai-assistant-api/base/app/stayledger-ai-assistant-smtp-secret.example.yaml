# Template — copy to stayledger-ai-assistant-smtp-secret.yaml (gitignored), fill REPLACE_ME, then:
#   kubectl apply -f k8s/onprem/stayledger-ai-assistant-smtp-secret.yaml
#
# Resource name must match Deployments: stayledger-ai-assistant-smtp-secrets
apiVersion: v1
kind: Secret
metadata:
  name: stayledger-ai-assistant-smtp-secrets
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-api
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: smtp
type: Opaque
stringData:
  SMTP_USER: "REPLACE_ME"
  SMTP_PASSWORD: "REPLACE_ME"
