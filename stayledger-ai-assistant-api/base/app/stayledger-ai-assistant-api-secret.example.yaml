# Template — copy to stayledger-ai-assistant-api-secret.yaml (gitignored), fill REPLACE_ME / YOUR_* values, then apply.
#   cp stayledger-ai-assistant-api/base/app/stayledger-ai-assistant-api-secret.example.yaml \
#      stayledger-ai-assistant-api/base/app/stayledger-ai-assistant-api-secret.yaml
#   kubectl apply -f stayledger-ai-assistant-api/base/app/stayledger-ai-assistant-api-secret.yaml
#
# Non-secrets live in stayledger-ai-assistant-api-config (ConfigMap), not here:
#   AZURE_OPENAI_ENDPOINT / API_VERSION / DEPLOYMENT / EMBEDDING_DEPLOYMENT
#   STAYLEDGER_PMS_INTERNAL_BASE_URL
#   PMS_CONTEXT_JWKS_URL (public JWKS; prefer URL over embedding JWKS JSON)
#
# Do NOT put BOOKING_API_KEY here (legacy duplicate of API_KEY; pricing probe uses API_KEY fallback).
apiVersion: v1
kind: Secret
metadata:
  name: stayledger-ai-assistant-api-secrets
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-api
    app.kubernetes.io/part-of: stayledger-ai-assistant
type: Opaque
stringData:
  # Azure OpenAI API key only (endpoint/deployment/version → ConfigMap).
  AZURE_OPENAI_API_KEY: "YOUR_AZURE_OPENAI_KEY"

  # Redis URL with embedded AUTH password (must match redis-secret REDIS_PASSWORD).
  # Format: redis://:<password>@stayledger-ai-assistant-redis:6379/0
  REDIS_URL: "redis://:REPLACE_ME@stayledger-ai-assistant-redis:6379/0"

  # Transitional fallback for POST /webhook* until every tenant has its own
  # encrypted webhook_api_key in tenant_channel_secrets.
  # Safe to omit when WEBHOOK_REQUIRE_TENANT_API_KEY=1 and all tenants have keys.
  API_KEY: "YOUR_GLOBAL_WEBHOOK_FALLBACK_KEY"

  # Encrypts tenant_channel_secrets / PMS credential blobs in PostgreSQL.
  # Generate with:
  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  SECRET_ENCRYPTION_KEY: "YOUR_FERNET_KEY"

  FEEDBACK_SUBMIT_API_KEY: "YOUR_FEEDBACK_SUBMIT_KEY"
  ADMIN_API_KEY: "YOUR_ADMIN_FEEDBACK_KEY"

  # Required when JWTAuthMiddleware is enabled. Use a random 64+ char string.
  JWT_SECRET: "YOUR_JWT_SECRET_MIN_64_CHARS"

  # App Postgres via PgBouncer (preferred for API/workers).
  HOTEL_OPS_DSN: "postgresql://hotelassistant:YOUR_POSTGRES_PASSWORD@stayledger-ai-assistant-pgbouncer:5432/hotel_ops"
  # Direct Postgres (metrics aggregator / tools that need prepared statements).
  HOTEL_OPS_DSN_DIRECT: "postgresql://hotelassistant:YOUR_POSTGRES_PASSWORD@stayledger-ai-assistant-postgres:5432/hotel_ops"

  # Inbound StayLedger PMS webhook HMAC verify.
  STAYLEDGER_WEBHOOK_SIGNING_SECRET: "YOUR_STAYLEDGER_WEBHOOK_SIGNING_SECRET"

  # Optional: guest-chat aggregate push to PMS (x-stayledger-aggregate-key).
  # GUEST_CHAT_AGGREGATE_IMPORT_KEY: "YOUR_AGGREGATE_IMPORT_KEY"

  # Optional: env-ref PMS credentials when pms_connections.secret_ref is set and
  # DB encrypted blobs are empty. Prefer Admin UI encrypted storage.
  # Pattern: PMS_SECRET_<NORMALIZED_REF>  e.g. secret_ref=stg_ai_pms_sync_property_1_api_key
  #   PMS_SECRET_STG_AI_PMS_SYNC_PROPERTY_1_API_KEY: "slpms_..."
  #   PMS_SECRET_STG_AI_PMS_SYNC_PROPERTY_1_SIGNING_SECRET: "slsig_..."

  # Multi-tenant production: omit global Meta/Zalo here.
  # Per-tenant Facebook/Zalo credentials live in PostgreSQL tenant_channel_secrets
  # and are managed from Admin -> Tenant -> Config.
