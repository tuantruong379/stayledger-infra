# Reasoning: dedicated Deployment for async KB chunk embedding (SKIP LOCKED poller).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-assistant-kb-embed-worker
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-kb-embed-worker
    app.kubernetes.io/part-of: stayledger-ai-assistant
spec:
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stayledger-ai-assistant-kb-embed-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stayledger-ai-assistant-kb-embed-worker
        app.kubernetes.io/part-of: stayledger-ai-assistant
    spec:
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kb-embed-worker
          image: putin111/stayledger-ai-assistant-api:3.0.11
          imagePullPolicy: IfNotPresent
          command: ["/venv/bin/python", "-m", "app.workers.kb_embedding_worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: stayledger-ai-assistant-api-config
            - secretRef:
                name: stayledger-ai-assistant-api-secrets
          env:
            - name: RAG_CHUNK_PERSIST
              value: "1"
            - name: RAG_EMBEDDING_BATCH_SIZE
              value: "32"
            - name: RAG_EMBEDDING_WORKER_POLL_SECONDS
              value: "5"
            - name: RAG_EMBEDDING_DIMENSIONS
              value: "1536"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            exec:
              command: ["sh", "-c", "test -d /proc/1"]
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -d /proc/1"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
