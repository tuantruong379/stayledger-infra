apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: database
spec:
  type: NodePort
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
      nodePort: 30432
  selector:
    app.kubernetes.io/name: postgres