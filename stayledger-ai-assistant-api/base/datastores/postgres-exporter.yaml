# Postgres exporter for infrastructure-level database metrics.
#
# Uses POSTGRES_NON_ROOT_* from postgres-secret. That role is DB owner but not
# superuser — the default ``wal`` collector calls pg_ls_waldir() and logs
# ``permission denied`` unless pg_monitor is granted. We disable ``wal`` here;
# optional: GRANT pg_monitor TO <user> (see postgres-bootstrap-job) to re-enable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-assistant-postgres-exporter
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-postgres-exporter
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: database-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stayledger-ai-assistant-postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stayledger-ai-assistant-postgres-exporter
        app.kubernetes.io/part-of: stayledger-ai-assistant
        app.kubernetes.io/component: database-metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stayledger-ai-assistant-postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          args:
            # Reasoning: avoid pg_ls_waldir permission errors for non-superuser DB role.
            - "--no-collector.wal"
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: "stayledger-ai-assistant-postgres:5432/hotel_ops?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stayledger-ai-assistant-postgres-exporter
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-postgres-exporter
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: database-metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
  selector:
    app.kubernetes.io/name: stayledger-ai-assistant-postgres-exporter
