apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-tenant-data
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: database
data:
  vertex-suites-hanoi.sql: |
    CREATE TABLE IF NOT EXISTS tenants (
        tenant_id VARCHAR(64) PRIMARY KEY,
        display_name VARCHAR(128) NOT NULL,
        active BOOLEAN NOT NULL DEFAULT TRUE
    );

    -- Phase 5 registry columns (align with Alembic initial tenant schema).
    -- Idempotent for clusters that already ran a newer bootstrap.
    ALTER TABLE tenants
        ADD COLUMN IF NOT EXISTS slug VARCHAR(64),
        ADD COLUMN IF NOT EXISTS facebook_page_ids TEXT[] NOT NULL DEFAULT ARRAY[]::TEXT[],
        ADD COLUMN IF NOT EXISTS zalo_oa_ids TEXT[] NOT NULL DEFAULT ARRAY[]::TEXT[];

    CREATE UNIQUE INDEX IF NOT EXISTS uq_tenants_slug
        ON tenants (slug) WHERE slug IS NOT NULL;
    CREATE INDEX IF NOT EXISTS idx_tenants_fb_page_ids
        ON tenants USING GIN (facebook_page_ids);
    CREATE INDEX IF NOT EXISTS idx_tenants_zalo_oa_ids
        ON tenants USING GIN (zalo_oa_ids);

    CREATE TABLE IF NOT EXISTS branches (
        branch_id VARCHAR(32) PRIMARY KEY,
        tenant_id VARCHAR(64) NOT NULL REFERENCES tenants(tenant_id),
        display_name VARCHAR(128) NOT NULL,
        timezone VARCHAR(64) NOT NULL DEFAULT 'Asia/Ho_Chi_Minh',
        active BOOLEAN NOT NULL DEFAULT TRUE
    );

    CREATE TABLE IF NOT EXISTS room_config (
        id BIGSERIAL PRIMARY KEY,
        tenant_id VARCHAR(64) NOT NULL REFERENCES tenants(tenant_id),
        room_type VARCHAR(32) NOT NULL,
        label_vi VARCHAR(128),
        active BOOLEAN NOT NULL DEFAULT TRUE,
        UNIQUE (tenant_id, room_type)
    );

    CREATE TABLE IF NOT EXISTS pricing_rows (
        id BIGSERIAL PRIMARY KEY,
        tenant_id VARCHAR(64) NOT NULL REFERENCES tenants(tenant_id),
        branch_id VARCHAR(32) NOT NULL REFERENCES branches(branch_id),
        room_type VARCHAR(32) NOT NULL,
        hour_block VARCHAR(16) NOT NULL,
        price_vnd NUMERIC(12, 0) NOT NULL CHECK (price_vnd >= 0),
        currency VARCHAR(8) NOT NULL DEFAULT 'VND',
        stay_date DATE,
        day_type VARCHAR(16),
        duration_min INT,
        CONSTRAINT pricing_rows_date_xor_day CHECK (
            (stay_date IS NOT NULL AND day_type IS NULL)
            OR (stay_date IS NULL AND day_type IN ('weekday', 'weekend'))
        )
    );

    CREATE INDEX IF NOT EXISTS idx_pricing_lookup ON pricing_rows (tenant_id, branch_id, room_type, hour_block, stay_date);
    CREATE INDEX IF NOT EXISTS idx_pricing_fallback ON pricing_rows (tenant_id, branch_id, room_type, hour_block, day_type);
    CREATE UNIQUE INDEX IF NOT EXISTS uq_pricing_exact ON pricing_rows (tenant_id, branch_id, room_type, hour_block, stay_date) WHERE stay_date IS NOT NULL;
    CREATE UNIQUE INDEX IF NOT EXISTS uq_pricing_fallback ON pricing_rows (tenant_id, branch_id, room_type, hour_block, day_type) WHERE stay_date IS NULL;

    CREATE TABLE IF NOT EXISTS promotions (
        id BIGSERIAL PRIMARY KEY,
        tenant_id VARCHAR(64) NOT NULL REFERENCES tenants(tenant_id),
        promo_id VARCHAR(64) NOT NULL,
        description TEXT,
        discount_percent NUMERIC(5, 2) NOT NULL CHECK (discount_percent >= 0 AND discount_percent <= 100),
        valid_from DATE NOT NULL,
        valid_to DATE NOT NULL,
        applies_to_day_type VARCHAR(16) NOT NULL DEFAULT 'any',
        branch_scope TEXT,
        active BOOLEAN NOT NULL DEFAULT TRUE,
        UNIQUE (tenant_id, promo_id)
    );

    CREATE TABLE IF NOT EXISTS bookings (
        id BIGSERIAL PRIMARY KEY,
        tenant_id VARCHAR(64) NOT NULL REFERENCES tenants(tenant_id),
        request_id UUID NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        branch_id VARCHAR(32) NOT NULL REFERENCES branches(branch_id),
        location_label VARCHAR(128),
        guest_name VARCHAR(256) NOT NULL,
        guest_phone VARCHAR(32) NOT NULL,
        checkin_date DATE NOT NULL,
        room_type VARCHAR(32) NOT NULL,
        guests INT NOT NULL CHECK (guests > 0),
        stay_type VARCHAR(16),
        hours INT,
        nights INT,
        raw_payload JSONB,
        UNIQUE (tenant_id, request_id)
    );

    CREATE INDEX IF NOT EXISTS idx_bookings_checkin ON bookings (tenant_id, checkin_date);
    CREATE INDEX IF NOT EXISTS idx_bookings_branch ON bookings (tenant_id, branch_id);

