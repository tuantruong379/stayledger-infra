apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-assistant-redis
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-redis
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    # Reasoning: single-replica local PV (RWO). RollingUpdate with maxSurge=0 acts like recreate
    # but keeps strategy explicit + consistent across workloads.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: stayledger-ai-assistant-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stayledger-ai-assistant-redis
        app.kubernetes.io/part-of: stayledger-ai-assistant
        app.kubernetes.io/component: cache
    spec:
      # Reasoning: Phase B7 — dedicated SA, no token automount (reduces blast radius if pod is compromised).
      serviceAccountName: redis-sa
      automountServiceAccountToken: false
      # Reasoning: Phase B5 — pod-level non-root + tight seccomp; redis-alpine ships ``stayledger-ai-assistant-redis`` as uid/gid 999.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          # Reasoning: Phase B5 — container-level hardening; root FS read-only, all caps dropped, no privilege escalation.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Reasoning: load tuning config from ConfigMap, then override requirepass from secret.
          # ConfigMap sets appendonly, maxmemory, eviction policy, slowlog, etc.
          # Password stays in a Secret and is injected last so it never appears in the ConfigMap.
          args:
            - "redis-server"
            - "/etc/redis/redis.conf"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis/redis.conf
              subPath: redis.conf
              readOnly: true
            # Reasoning: Phase B5 — readOnlyRootFilesystem requires writable scratch for /tmp.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Reasoning: redis-cli must authenticate against the password-protected server.
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
        - name: redis-config
          configMap:
            name: redis-tuning
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stayledger-ai-assistant-redis
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-redis
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: stayledger-ai-assistant-redis
