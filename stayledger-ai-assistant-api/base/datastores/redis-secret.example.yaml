# Template — copy to redis-secret.yaml (gitignored), generate a strong password, then apply.
#
#   # Generate a strong password (Linux/macOS):
#   PWD=$(openssl rand -base64 32 | tr -d '=+/' | cut -c1-32)
#   # PowerShell:
#   $PWD = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 32 | % {[char]$_})
#
#   cp k8s/onprem/redis-secret.example.yaml k8s/onprem/redis-secret.yaml
#   # then replace REPLACE_ME with $PWD
#   kubectl apply -f k8s/onprem/redis-secret.yaml
#
# After applying, also set the matching value in your stayledger-ai-assistant-api-secrets:
#   REDIS_URL: "redis://:<same-password>@stayledger-ai-assistant-redis:6379/0"
# (REDIS_URL is moved to the API Secret because ConfigMaps cannot hold passwords.)
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-redis
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  REDIS_PASSWORD: "REPLACE_ME"
