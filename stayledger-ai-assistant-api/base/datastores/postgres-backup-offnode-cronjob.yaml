# Off-node copy of the AI-assistant Postgres dumps (added 2026-09-27, go-live P0).
#
# postgres-backup writes hotel_ops_*.dump to a local PV on the same node as the database, so a
# node loss took the database and every backup of it together. This job uploads the newest
# dump to S3 an hour after the dump runs, verifies it, and prunes remote copies older than
# RETENTION_DAYS -- the same aws-cli script as the PMS off-node job
# (stayledger-shared/datastores/*/postgres-backup-offnode-cronjob.yaml).
#
# Needs Secret backup-offnode-s3 in this namespace with S3_ENDPOINT, S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY, S3_BUCKET (copy-backup-offnode-secret.sh copies it from the PMS
# namespace). S3_PREFIX is set per environment by the overlay patch, not taken from the Secret,
# so the AI dumps never share a prefix with the PMS ones.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-offnode-script
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: postgres-backup-offnode
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: database-backup
data:
  offnode.sh: |
    #!/bin/sh
    set -eu
    BACKUP_DIR=/backup
    RETENTION_DAYS="${RETENTION_DAYS:-30}"
    LATEST=$(ls -1t ${BACKUP_DIR}/hotel_ops_*.dump 2>/dev/null | head -1 || true)
    if [ -z "${LATEST}" ]; then
      echo "[offnode] ERROR: no hotel_ops_*.dump in ${BACKUP_DIR} (has postgres-backup run?)"
      exit 1
    fi
    AGE_H=$(( ( $(date +%s) - $(date -r "${LATEST}" +%s) ) / 3600 ))
    if [ "${AGE_H}" -gt 36 ]; then
      echo "[offnode] ERROR: newest dump ${LATEST} is ${AGE_H}h old -- local backup is failing"
      exit 1
    fi
    NAME=$(basename "${LATEST}")
    SUM=$(md5sum "${LATEST}")
    echo "${SUM%% *}" > "/tmp/${NAME}.md5"
    REGION=$(echo "${S3_ENDPOINT}" | sed -n 's#.*s3[.-]\([a-z0-9-]*\)\.amazonaws\.com.*#\1#p')
    export AWS_ACCESS_KEY_ID="${S3_ACCESS_KEY_ID}" AWS_SECRET_ACCESS_KEY="${S3_SECRET_ACCESS_KEY}"
    export AWS_DEFAULT_REGION="${REGION:-ap-southeast-1}"
    aws configure set default.s3.addressing_style path
    S3="aws --endpoint-url ${S3_ENDPOINT}"
    echo "[offnode] uploading ${NAME} ($(du -h "${LATEST}" | cut -f1)) to s3://${S3_BUCKET}/${S3_PREFIX}"
    ${S3} s3 cp --only-show-errors "${LATEST}" "s3://${S3_BUCKET}/${S3_PREFIX}${NAME}"
    ${S3} s3 cp --only-show-errors "/tmp/${NAME}.md5" "s3://${S3_BUCKET}/${S3_PREFIX}${NAME}.md5"
    ${S3} s3api head-object --bucket "${S3_BUCKET}" --key "${S3_PREFIX}${NAME}" >/dev/null
    echo "[offnode] verified remote ${S3_PREFIX}${NAME}"
    CUTOFF=$(date -u -d "@$(( $(date +%s) - RETENTION_DAYS * 86400 ))" +%Y-%m-%dT%H:%M:%S)
    ${S3} s3api list-objects-v2 --bucket "${S3_BUCKET}" --prefix "${S3_PREFIX}hotel_ops_" \
      --query "Contents[?LastModified<'${CUTOFF}'].Key" --output text 2>/dev/null \
      | tr '\t' '\n' | grep -E '\.dump(\.md5)?$' | while read -r KEY; do
          ${S3} s3 rm --only-show-errors "s3://${S3_BUCKET}/${KEY}" || true
        done || true
    echo "[offnode] done at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-offnode
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: postgres-backup-offnode
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: database-backup
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup-offnode
            app.kubernetes.io/part-of: stayledger-ai-assistant
            app.kubernetes.io/component: database-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: offnode-copy
              image: amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/offnode.sh"]  # image entrypoint is `aws`
              env:
                - name: HOME
                  value: /tmp
                - name: S3_PREFIX
                  value: stayledger-ai-assistant/CHANGE-ME/postgres/
              envFrom:
                - secretRef:
                    name: backup-offnode-s3
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
                  readOnly: true
                - name: script
                  mountPath: /scripts/offnode.sh
                  subPath: offnode.sh
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: postgres-backup
                readOnly: true
            - name: script
              configMap:
                name: postgres-backup-offnode-script
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
