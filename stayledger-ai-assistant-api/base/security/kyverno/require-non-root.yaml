apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require Non-Root Containers
    policies.kyverno.io/description: >
      Containers must not run as root (UID 0). All stayledger-ai-assistant workloads
      already use runAsUser: 10001; this policy enforces the same for future additions.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-runAsNonRoot
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - stayledger-ai-assistant
      validate:
        message: "Containers must set runAsNonRoot: true or runAsUser > 0"
        pattern:
          spec:
            =(securityContext):
              =(runAsNonRoot): true
            containers:
              - =(securityContext):
                  =(runAsUser): ">0"
