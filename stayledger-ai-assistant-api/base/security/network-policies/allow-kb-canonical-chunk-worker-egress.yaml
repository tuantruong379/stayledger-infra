# Canonical chunk worker needs PgBouncer for outbox + generation writes.
# DNS egress is namespace-wide.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kb-canonical-chunk-worker-egress
  namespace: stayledger-ai-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stayledger-ai-assistant-kb-canonical-chunk-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-pgbouncer
      ports:
        - protocol: TCP
          port: 5432
