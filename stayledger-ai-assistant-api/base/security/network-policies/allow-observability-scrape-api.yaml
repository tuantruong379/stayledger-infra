apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-scrape-api
  namespace: stayledger-ai-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hotel-assistant-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8000
