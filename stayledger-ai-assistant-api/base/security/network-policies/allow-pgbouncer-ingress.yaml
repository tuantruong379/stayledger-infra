# Allow API pods + workers + alembic Job to reach PgBouncer on port 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer-ingress
  namespace: stayledger-ai-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stayledger-ai-assistant-pgbouncer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-channel-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-webhook-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-metrics-aggregator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alembic-upgrade
        # Reasoning: embed worker/backfill poll kb_chunks via HOTEL_OPS_DSN → PgBouncer.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-kb-embed-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-rag-eval-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-kb-raw-processing-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-kb-embed-backfill
        # Reasoning: dedicated catalog sync worker uses HOTEL_OPS_DSN → PgBouncer.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-pms-catalog-sync
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-postgres   # bootstrap job uses stayledger-ai-assistant-postgres SA
      ports:
        - protocol: TCP
          port: 5432
