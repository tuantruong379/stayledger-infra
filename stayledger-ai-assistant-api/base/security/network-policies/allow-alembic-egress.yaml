# Alembic owner Job prefers direct Postgres (DDL-safe). PgBouncer remains
# allowed for legacy app-DSN alembic jobs that still target the pooler.
# DNS egress is covered by allow-egress-dns (namespace-wide).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alembic-egress
  namespace: stayledger-ai-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alembic-upgrade
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: pgbouncer
    ports:
    - protocol: TCP
      port: 5432
