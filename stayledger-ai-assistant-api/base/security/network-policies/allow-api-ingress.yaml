apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: stayledger-ai-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stayledger-ai-assistant-api
  policyTypes:
  - Ingress
  ingress:
  # NodePort / external clients (Cilium: ipBlock alone does not cover in-cluster pods)
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 8000
  # In-cluster frontend → API
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: stayledger-ai-assistant-admin-web
    ports:
    - protocol: TCP
      port: 8000
  # API replica → API replica (Service-routed cross-pod calls, e.g. idempotency
  # probes / any future internal call). The ipBlock 0.0.0.0/0 rule above does not
  # cover this (see comment) since it never matched the pod's own identity.
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: stayledger-ai-assistant-api
    ports:
    - protocol: TCP
      port: 8000
  # PMS staging API → booking.confirmed / booking.cancelled webhooks (/internal/pms/...)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: stayledger-staging
      podSelector:
        matchLabels:
          app: stayledger-api
    ports:
    - protocol: TCP
      port: 8000
  # PMS production API (same webhook path when deployed)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: stayledger
      podSelector:
        matchLabels:
          app: stayledger-api
    ports:
    - protocol: TCP
      port: 8000
  # PMS admin-web server-side channel-status fetch of /health/integrations, in-cluster since
  # 2026-09-27 (the api refuses that path when it arrives through Cloudflare/ingress).
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [stayledger-staging, stayledger]
      podSelector:
        matchLabels:
          app: stayledger-admin-web
    ports:
    - protocol: TCP
      port: 8000
