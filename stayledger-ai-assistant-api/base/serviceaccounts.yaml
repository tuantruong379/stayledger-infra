# Reasoning: Phase B7 — dedicated ServiceAccounts per workload, no token automount.
#
# Default behavior in Kubernetes mounts the namespace ``default`` SA token at
# /var/run/secrets/kubernetes.io/serviceaccount inside every pod, giving any compromised
# process the ability to call the cluster API as that SA. None of these workloads need to
# call the Kubernetes API, so we (1) give each its own SA for audit attribution and
# (2) disable token automount in the corresponding Deployment ``spec``.
#
# To grant cluster API access later, add a Role + RoleBinding scoped to that
# single SA — never re-enable ``automountServiceAccountToken``.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-api
    app.kubernetes.io/part-of: stayledger-ai-assistant
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: stayledger-ai-assistant
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: stayledger-ai-assistant
automountServiceAccountToken: false
