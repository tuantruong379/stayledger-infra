# Phase B3 — PodDisruptionBudgets.
#
# Goals:
#   - stayledger-ai-assistant-api (replicas=2) survives a single-pod eviction during node drain.
#   - stayledger-ai-assistant-postgres / stayledger-ai-assistant-redis are currently single-replica → block voluntary disruption.
#     This means `kubectl drain` will refuse to evict these pods until the operator
#     either temporarily deletes the PDB or scales up to a HA topology.
#
# Verify:
#   kubectl -n stayledger-ai-assistant get pdb

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stayledger-ai-assistant-api
  namespace: stayledger-ai-assistant
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stayledger-ai-assistant-api

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stayledger-ai-assistant-postgres
  namespace: stayledger-ai-assistant
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: stayledger-ai-assistant-postgres

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stayledger-ai-assistant-redis
  namespace: stayledger-ai-assistant
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: stayledger-ai-assistant-redis
