# Production overlay for stayledger k3s cluster (context: stayledger).
# Public URLs via Traefik + cert-manager:
#   UI:  https://assistant.stayledger.io
#   API: https://api-assistant.stayledger.io
#
# Deploy (after secrets):
#   kubectl apply -k stayledger-ai-assistant-api/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-ai-assistant

resources:
  - ../base
  - ingress.yaml
  - rag-eval-cronjob.yaml
  - kb-retention-cronjob.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

patches:
  - path: stayledger-ai-assistant-api-configmap-patch.yaml
  - path: stayledger-ai-assistant-metrics-aggregator-configmap-patch.yaml
  - path: patches/stayledger-ai-assistant-scaling-production.yaml
  - path: patches/stayledger-ai-assistant-api-resources.yaml
  - path: patches/postgres-resources.yaml
  - path: patches/kb-embed-worker-resources.yaml
  - path: patches/redis-resources.yaml
  - path: patches/stayledger-ai-assistant-webhook-worker-resources.yaml
  - path: patches/stayledger-ai-assistant-channel-worker-resources.yaml
  - path: patches/stayledger-ai-assistant-optional-workers-scale.yaml
  - path: patches/stayledger-ai-assistant-api-service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-ai-assistant-api
  - path: patches/postgres-pv-production.yaml
  - path: patches/redis-pv-production.yaml
  - path: patches/postgres-backup-pv-production.yaml

# Promotion 2026-09-16 (r63): release/1.7.22 @ f425ec2 -- the staging closeout.
# Rollout 1 (content/fixtures/plumbing), Phase C (verifier off, rerank stays
# off), Rollout 2 (booking-funnel seams) and Rollout 3 (2,922 lines of dead code
# out, nine feature-gate copies merged into one). Schema 0094 -> 0095 via
# patches/alembic-upgrade-r63.job.yaml. Rolled with scoped `kubectl set image`,
# NOT `apply -k`: the live ConfigMap still differs from this overlay on flags
# that are operational decisions (see the drift list in the promotion notes).
# Tag: staging-20260916-f425ec2
# Digest: sha256:fe489a457e7186617aa2c3728d350d1562b6a052eec67d974318882199309156
#
# Promotion 2026-09-15 (r60): release/1.7.22 @ e72e021 -- a month of staging work
# (Agentic RAG r13-r27, Lane D/E, RLS sweep r52, Model Policy Engine r53-r58,
# canned-reply seams r59-r60). Rolled with scoped `kubectl set image` on the five
# Deployments and two CronJobs, NOT `apply -k`: the live ConfigMap has 97 keys vs
# 106 rendered here and differs on PMS/webhook/NATS flags that are operational
# decisions, not this promotion's. Schema: alembic 0064 -> 0094 via
# patches/alembic-upgrade-r60.job.yaml, which first replayed the 0038-0053 block
# that production's stamp had skipped (fingerprint-verified before and after).
# Tag: staging-20260915-e72e021
# Digest: sha256:10e99d5f0435c03e784127dc8302b1735189b9ce3dabe494a90021f81f773921
#
# Pin to release/1.7.15 @ b73e4f2 + the retention_repository.py composite-key
# fix (commit 2f2667e, 2026-08-17): psycopg can't adapt a Python list[tuple]
# for `(tenant_id, version) = ANY(%s)` — server rejects it as an anonymous
# composite type. Broke kb-retention's CronJob for 5+ days in production
# (confirmed via live logs) until this build. Also carries the
# ensure_kb_schema() fix from commit 5a50f70 (2026-08-15, already on this
# branch) that removed a runtime CREATE TABLE the least-privilege app DB
# role can't execute (production was still running a pre-5a50f70 image).
#
# The PREVIOUS digest pinned here (sha256:098318c7...) does not exist on the
# registry (`ErrImagePull` / `NotFound`, confirmed 2026-08-17) — stale/never
# actually published. Match post-base-transform image names, then remap to
# published repos.
images:
  - name: putin111/stayledger-ai-assistant-api
    newName: putin111/stayledger-ai-assistant-api
    digest: sha256:fe489a457e7186617aa2c3728d350d1562b6a052eec67d974318882199309156
