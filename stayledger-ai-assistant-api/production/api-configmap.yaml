  FACEBOOK_GRAPH_API_VERSION: v25.0
  FACEBOOK_SKIP_SIGNATURE_VERIFY: '0'
  FEATURE_METRICS_PIPELINE: '1'
  FEATURE_RAG_PGVECTOR: '1'
