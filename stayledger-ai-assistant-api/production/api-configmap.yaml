# Production API ConfigMap -- SOURCE OF TRUTH for production (2026-09-29).
#
# The production kustomize overlay does NOT render this ConfigMap correctly (it inherits base
# values such as CHANNEL_OUTBOUND_MODE=sink and a stale AZURE_OPENAI_DEPLOYMENT that would
# override the Secret), and that overlay must not be `apply -k`'d (postgres PV path). This file
# is the live production ConfigMap, synced with staging for the AI/RAG/KB feature flags
# ("group C"). Environment-specific keys (URLs, APP_ENV, OTEL, NATS) stay production values;
# staging-only test knobs (sink outbound, debug slots, 100% trace sampling) are NOT copied;
# security (group D), PMS integration (E) and capacity (F) are separate phases.
#
#   kubectl --context stayledger apply -f stayledger-ai-assistant-api/production/api-configmap.yaml
#   then restart api + workers (envFrom is read at start).
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-ai-assistant-api-config
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: hotel-assistant-api
    app.kubernetes.io/part-of: stayledger-ai-assistant
    environment: production
data:
  ADMIN_OVERVIEW_CACHE_TTL_S: '30'
  ADMIN_WEB_PUBLIC_URL: https://assistant.stayledger.io
  AGENTIC_RAG_ENABLED: '1'
  AI_ASYNC_RETRY_RAG_TRANSLATE_MAX_RETRIES: '0'
  AI_BUDGET_REDIS_FAILURE_MODE: fail_closed
  AI_CANONICAL_TURN_ENABLED: '1'
  AI_CAPACITY_QUEUE_WAIT_S: '2.0'
  AI_CONVERSATION_RETENTION_BATCH_SIZE: '100'
  AI_CONVERSATION_STATE_RETENTION_DAYS: '30'
  AI_DURABLE_MEMORY_ENABLED: '1'
  AI_EXPENSIVE_CONCURRENCY: '32'
  AI_MULTITURN_MEMORY_ENABLED: '1'
  AI_TOOL_CALLING_ENABLED: '1'
  AI_TOOL_CALLING_TENANT_ALLOWLIST: cupid_hotel
  ALLOW_NO_AUTH: 'false'
  APP_ENV: production
  APP_VERSION: 3.0.4
  AZURE_OPENAI_CLIENT_MAX_RETRIES: '0'
  BILLING_USD_PER_1K_TOKENS: '0.000263'
  BILLING_USD_PER_1K_TOKENS_CACHED: '0.000075'
  BILLING_USD_PER_1K_TOKENS_COMPLETION: '0.0006'
