# Production override for the synthetic leakage-evaluation corpus metadata.
#
# The JSONL body is baked into the API image. This ConfigMap shadows only its
# time-bounded review metadata, so the corpus can be renewed without rebuilding
# the application image. Keep content_sha256 aligned with the image copy.
