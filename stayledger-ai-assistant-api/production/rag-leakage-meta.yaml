kind: ConfigMap
metadata:
  name: stayledger-ai-assistant-rag-leakage-meta
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-rag-leakage-meta
    app.kubernetes.io/part-of: stayledger-ai-assistant
    environment: production
data:
  staging.v1.jsonl.meta.json: |
    {
      "schema_version": "rag-leakage/v1",
      "dataset_version": "production-leakage-2026-10-16.v1",
      "scope": {
        "environment": "production",
        "tenant_ids": ["cupid_hotel", "vertex_suites_hanoi", "azure_bay_danang"],
        "property_ids": ["hcm_q1", "hanoi_old_quarter", "danang_beach", "property_1", "property_2"]
      },
      "expires_at": "2026-11-15T00:00:00Z",
      "content_sha256": "c4032ae8e0778137502863a6f84477ae07c004d20995d03f3565724862cb92b5",
      "reviewed_by": "production-platform-ops (Codex-assisted)",
