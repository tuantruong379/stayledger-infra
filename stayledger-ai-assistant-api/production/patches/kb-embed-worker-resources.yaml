# Right-size kb-embed-worker for single-node stayledger k3s.
# Live usage ~4m CPU / ~100Mi when idle; burst stays under 500m / 768Mi limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-assistant-kb-embed-worker
  namespace: stayledger-ai-assistant
spec:
  template:
    spec:
      containers:
        - name: kb-embed-worker
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
