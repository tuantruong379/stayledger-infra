# Keep embedding continuously enabled while the production backlog is non-zero.
# Revisit on-demand scheduling only after backlog=0 and a tested schedule/alert exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-assistant-kb-embed-worker
  namespace: stayledger-ai-assistant
spec:
  replicas: 1

