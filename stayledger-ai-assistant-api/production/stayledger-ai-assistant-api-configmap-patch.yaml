# Production public URLs — Traefik ingress on stayledger cluster.
#
# Product defaults (rerank / scoped hybrid / pgvector / multiturn) are promoted
# for all tenants. This overlay keeps env URLs and a small set of safety gates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-ai-assistant-api-config
  namespace: stayledger-ai-assistant
data:
  ENVIRONMENT: "production"
  APP_ENV: "production"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=production"
  # Keep in sync with production/kustomization.yaml images.digest for the API.
  APP_VERSION: "prod-wave2-f05db10"
  ADMIN_WEB_PUBLIC_URL: "https://assistant.stayledger.io"
  CORS_ORIGINS: "https://assistant.stayledger.io,https://app.stayledger.io,http://localhost:3000,http://127.0.0.1:3000"
  DEFAULT_TENANT_ID: ""
  CHANNEL_QUEUE_FAIL_CLOSED: "1"
  REQUIRE_RESOLVED_PROPERTY: "1"

  # --- Product defaults (all tenants; no allowlists) ---
  RAG_SCOPED_HYBRID_HOTPATH_ENABLED: "1"
  RAG_RETRIEVAL_BACKEND: "pgvector"
  RAG_CHUNK_PERSIST: "1"
  RAG_EMBEDDING_DIMENSIONS: "1536"
  FEATURE_RAG_PGVECTOR: "1"
  RAG_PGVECTOR_MIN_SIMILARITY: "0.35"
  RAG_HYBRID_SCORE_FLOOR: "0.25"
  FEATURE_RERANKER_ENABLED: "1"
  # Skip Azure listwise rerank when top vector hit is already confident (latency).
  RAG_RERANK_SKIP_VECTOR_SCORE: "0.82"
  AI_MULTITURN_MEMORY_ENABLED: "1"
  AI_BUDGET_REDIS_FAILURE_MODE: "fail_closed"

  # --- Platform Model Router profiles (2026-09-18) ---
  # Live production reads AZURE_OPENAI_DEPLOYMENT=gpt-5.4-mini from the Secret
  # (verified on the cluster 2026-09-18; the base ConfigMap's gpt-4o-mini is
  # stale and is not what runs). The router now fails closed on an unconfigured
  # profile, so all three chat tiers are pinned here to the model production
  # already runs -- this deploy changes attribution, not the model. Apply this
  # ConfigMap before rolling the enforcing image; see the runbook in
  # stayledger-ai-assistant-api/docs/reviews/ai-architecture-cost-review-20260918.md.
  # Luna is NOT wired in: latency-probe it first (the gpt-5.4-nano lesson).
  LLM_PROFILE_SIMPLE_DEPLOYMENT: "gpt-5.4-mini"
  LLM_PROFILE_REASONING_DEPLOYMENT: "gpt-5.4-mini"
  LLM_TIER_BATCH_DEPLOYMENT: "gpt-5.4-mini"
  # Eval controls. Production has no rag-eval-worker Deployment live today; these
  # bound any operator-run scripts/run_rag_eval.py from a pod.
  RAG_EVAL_WORKER_MODE: "sample"
  RAG_EVAL_MAX_COST_USD: "3.00"
  RAG_EVAL_MAX_LLM_CALLS: "900"
  RAG_EVAL_WORKER_MAX_RUNS_PER_DAY: "6"

  # --- PMS ---
  PMS_STAYLEDGER_ENABLED: "1"
  # Production booking mutation remains gated until a separate qualification gate exists.
  PMS_DRAFT_BOOKING_ENABLED: "0"
  PMS_CONVERSATION_SYNC_ENABLED: "1"
  PMS_OUTBOX_WORKER_ENABLED: "0"
  PMS_READ_FALLBACK_MODE: "fail_closed"
  PMS_PROVIDER_DEFAULT: "local"

  # --- Channel safety (one delivery switch; no PSID/UID allowlist) ---
  CHANNEL_OUTBOUND_MODE: "sink"
  CHANNEL_OUTBOUND_ALLOWLIST_REQUIRED: "0"
  CHANNEL_BINDING_ENFORCEMENT: "enforce"
  WEBHOOK_REQUIRE_TENANT_API_KEY: "1"
  ZALO_WEBHOOK_REQUIRE_MAC: "1"
