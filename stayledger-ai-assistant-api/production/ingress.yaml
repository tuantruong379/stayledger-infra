---
# Production TLS ingress for AI Assistant API (api-assistant.stayledger.io).
# DNS prereq: api-assistant.stayledger.io → Traefik LoadBalancer 103.20.96.122
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stayledger-ai-assistant-api
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-api
    app.kubernetes.io/part-of: stayledger-ai-assistant
    environment: production
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api-assistant.stayledger.io
      secretName: stayledger-ai-assistant-api-tls
  rules:
    - host: api-assistant.stayledger.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stayledger-ai-assistant-api
                port:
                  number: 8000
