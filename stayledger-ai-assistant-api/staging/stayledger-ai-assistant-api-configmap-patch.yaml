# Staging public URLs — NodePort + Cloudflare (no ingress).
#   UI:  https://stg-assistant.stayledger.io  (→ node :30081)
#   API: https://stg-api-assistant.stayledger.io (→ node :30080)
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-ai-assistant-api-config
  namespace: stayledger-ai-assistant
data:
  ENVIRONMENT: "staging"
  APP_ENV: "staging"
  STAYLEDGER_IMAGE_DIGEST: "sha256:9a8f6f952a6e5d4886b0ab803eb646367d55deadb826e38999d7600a98cf0bc8"
  STAYLEDGER_IMAGE_TAG: "staging-rag-foundation-20260801"
  APP_VERSION: "staging-rag-foundation-20260801"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=staging"
  # Non-secret Azure + PMS routing (moved out of stayledger-ai-assistant-api-secrets).
  AZURE_OPENAI_ENDPOINT: "https://tekcent-openai.cognitiveservices.azure.com/"
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  AZURE_OPENAI_DEPLOYMENT: "gpt-4o-mini"
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
  STAYLEDGER_PMS_INTERNAL_BASE_URL: "https://stg-api.stayledger.io"
  RAG_QUERY_EMBEDDING_TIMEOUT_S: "5"
  LLM_OPERATION_BOOKING_EXTRACT_TIMEOUT_S: "4"
  # Staging rollout safety: one Uvicorn worker per API replica. The node is
  # resource-constrained and two startup workers repeatedly exited before
  # readiness; scale remains replica-based.
  UVICORN_WORKERS: "1"
  ADMIN_WEB_PUBLIC_URL: "https://stg-assistant.stayledger.io"
  CORS_ORIGINS: "https://stg-assistant.stayledger.io,http://10.89.1.40:30081,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3003"
  # Keep blank (base already ""); fail-closed tenant resolution must not rely on a default hotel.
  DEFAULT_TENANT_ID: ""
  # Temporary: re-enable API-embedded notification outbox until a dedicated
  # Deployment exists — 11 cupid_hotel emails stuck pending since 2026-07-27
  # (attempts=0) because no worker was polling booking_notifications_outbox.
  API_NOTIFICATION_OUTBOX_ENABLED: "1"
  API_ALERT_EVALUATOR_ENABLED: "0"
  # Explicit pins (also base defaults): fail-closed channel queue + resolved property.
  CHANNEL_QUEUE_FAIL_CLOSED: "1"
  REQUIRE_RESOLVED_PROPERTY: "1"
  # P0 (F-P0-03,04/PR-E): route guest FAQ/RAG hot path to scope-aware hybrid retrieval
  # (kb_chunks 0037 schema); canary at 100% now that fail-closed guards are in place.
  RAG_SCOPED_HYBRID_HOTPATH_ENABLED: "1"
  RAG_SCOPED_HYBRID_CANARY_PERCENT: "100"
  RAG_LEGACY_WARMUP_ENABLED: "0"
  PMS_STAYLEDGER_ENABLED: "1"
  # Recovery freeze / dedicated-worker cutover: keep mutating writers OFF in the overlay.
  # Re-enable only via Phase 9 controlled sequence after digest deploy + gates.
  PMS_DRAFT_BOOKING_ENABLED: "0"
  PMS_CONVERSATION_SYNC_ENABLED: "0"
  PMS_OUTBOX_WORKER_ENABLED: "0"
  # Catalog dry-run canary (API stays non-polling; dedicated worker Deployment env enables sync).
  # Keep DRY_RUN=1 and connection allowlist until write canary is approved.
  PMS_CATALOG_SYNC_ENABLED: "0"
  PMS_CATALOG_SYNC_DRY_RUN: "1"
  AI_CANONICAL_TURN_ENABLED: "1"
  AI_CANONICAL_TURN_TENANT_ALLOWLIST: "stg_ai_rag_validation_property_2"
  AI_DURABLE_MEMORY_ENABLED: "1"
  AI_MULTITURN_MEMORY_ENABLED: "1"
  AI_CONVERSATION_STATE_RETENTION_DAYS: "30"
  AI_CONVERSATION_RETENTION_BATCH_SIZE: "100"
  PMS_CATALOG_SYNC_CONNECTION_ALLOWLIST: "eef2a660-4218-4ad2-aa0d-a38e51fbb321"
  PMS_WORKERS_IN_API: "0"
  # Bounded Slice 4 canary: pool 12 was the best observed value in the approved
  # concurrency-30 experiment. Roll back to 8 if the staging gate regresses.
  POSTGRES_POOL_SIZE: "20"
  PG_POOL_MAX_SIZE: "20"
  PG_POOL_MIN_SIZE: "20"
  # Bound Redis fan-out under webhook bursts; queue briefly instead of opening
  # an unbounded connection storm. Roll back with the application image if needed.
  REDIS_MAX_CONNECTIONS: "64"
  REDIS_POOL_WAIT_TIMEOUT_S: "3.0"
  REDIS_RATE_LIMIT_DEDICATED_POOL: "1"
  REDIS_RATE_LIMIT_SYNC_OFFLOAD: "1"
  REDIS_MEMORY_SYNC_OFFLOAD: "1"
  REDIS_RAG_CACHE_SYNC_OFFLOAD: "1"
  # Bounded canary: Azure embedding tail is the dominant burst bottleneck.
  # Roll back to 2 if the two-replica current-workload profile regresses.
  # Staging canary: allow bounded parallel embedding calls; rollback to 2 if
  # Azure throttling or tail latency regresses.
  RAG_EMBEDDING_MAX_CONCURRENCY: "8"
  # Bounded exact-retrieval DB concurrency canary; rollback to 0 to disable.
  # Disabled after the staging canary increased pool tail; keep code available
  # for a future design that acquires the gate before the DB connection.
  RAG_SCOPED_RETRIEVAL_MAX_CONCURRENCY: "0"
  LLM_ASYNC_MAX_CONCURRENCY: "8"
  AI_ASYNC_RETRY_RAG_TRANSLATE_MAX_RETRIES: "0"
  AI_ASYNC_RETRY_RAG_ANSWER_MAX_RETRIES: "0"
  REDIS_BOOKING_STATE_SYNC_OFFLOAD: "1"
  REDIS_RATE_LIMIT_MAX_CONNECTIONS: "16"
  REDIS_RATE_LIMIT_POOL_WAIT_TIMEOUT_S: "1.0"
  PMS_READ_FALLBACK_MODE: "fail_closed"
  PMS_PROVIDER_DEFAULT: "stayledger"
  # One bounded synchronous retry; idempotent draft retries remain recoverable
  # by the reconciliation worker without holding the webhook turn for two full
  # upstream timeout windows.
  PMS_HTTP_MAX_RETRIES: "1"
  # External outbound fail-closed until an approved staging test destination is allowlisted.
  CHANNEL_OUTBOUND_ALLOWLIST_REQUIRED: "1"
  CHANNEL_OUTBOUND_DESTINATION_ALLOWLIST: ""
  # Sink: ack channel jobs without Facebook/Zalo HTTP. Live provider delivery remains DEFERRED_BY_SCOPE.
  # Apply with final candidate image that includes sink mode; workers stay at replicas=0 until fixture.
  CHANNEL_OUTBOUND_MODE: "sink"
  # KB upsert allowlist — staging canary plus Cupid KB revision workflow.
  # Guest-facing RAG citation footer (section titles only; no paths/UUIDs).
  RAG_GUEST_CITATIONS: "1"
  # Phase 8 full staging cutover: pgvector primary for all tenants.
  RAG_RETRIEVAL_BACKEND: "pgvector"
  RAG_CHUNK_PERSIST: "1"
  RAG_EMBEDDING_DIMENSIONS: "1536"
  RAG_PGVECTOR_SHADOW_ENABLED: "0"
  # 2026-07-26: on for the keyword-alias regex-migration pilot batch (10 categories) —
  # collecting real shadow-mismatch data before any category's call site is trusted to use
  # the config-driven path instead of its legacy regex. Turn back to "0" once done observing.
  KEYWORD_ALIAS_SHADOW_VALIDATE: "1"
  RAG_PGVECTOR_TENANT_ALLOWLIST: ""
  RAG_PGVECTOR_CANARY_PERCENT: "100"
  # Calibrated from staging top-1 cosine samples (min≈0.44); keep slack for FAQ variance.
  RAG_PGVECTOR_MIN_SIMILARITY: "0.35"
  FEATURE_RAG_PGVECTOR: "1"
  # Floor for in-memory / scoped-hybrid fallback paths (drop weak chunks when peers remain).
  RAG_HYBRID_SCORE_FLOOR: "0.25"
  # LLM listwise rerank after similarity floor (heuristic fallback on timeout/error).
  FEATURE_RERANKER_ENABLED: "1"
  RAG_RERANK_TENANT_ALLOWLIST: "cupid_hotel"
  # Scoped exact retrieval already has deterministic authorization-aware ranking;
  # keep the extra LLM rerank opt-in until the frozen quality corpus proves benefit.
  RAG_SCOPED_HYBRID_LLM_RERANK_ENABLED: "0"
  # Bounded multi-turn history in RAG messages (Redis envelope; not pgvector).
  AI_MULTITURN_MEMORY_ENABLED: "1"
  # fail_closed required by startup safety on staging/production (fail_open needs ALLOW_AI_BUDGET_FAIL_OPEN=1).
  AI_BUDGET_REDIS_FAILURE_MODE: "fail_closed"
  # HAI-005: staging inventory 2026-07-23 — all 5 active tenants have webhook_api_key set in
  # tenant_channel_secrets. Require per-tenant keys; do not change base (other overlays/local).
  WEBHOOK_REQUIRE_TENANT_API_KEY: "1"
  # Release gate: observe is insufficient — unknown bindings must drop, not enqueue.
  CHANNEL_BINDING_ENFORCEMENT: "enforce"
  # Zalo MAC required when channel path is exercised; live delivery remains deferred by scope.
  ZALO_WEBHOOK_REQUIRE_MAC: "1"
