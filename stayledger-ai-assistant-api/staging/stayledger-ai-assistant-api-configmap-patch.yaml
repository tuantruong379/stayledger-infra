# Staging public URLs — NodePort + Cloudflare (no ingress).
#   UI:  https://stg-assistant.stayledger.io  (→ node :30081)
#   API: https://stg-api-assistant.stayledger.io (→ node :30080)
#
# Product defaults live in base where possible. This overlay keeps env-specific
# URLs, capacity pins, and a small set of safety/ops gates — not tenant allowlists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-ai-assistant-api-config
  namespace: stayledger-ai-assistant
data:
  ENVIRONMENT: "staging"
  APP_ENV: "staging"
  STAYLEDGER_IMAGE_DIGEST: "sha256:9ac3586a8b59db65832110675c9c3c2869a3d1e4d23cb0896740d3a4f26f77d3"
  STAYLEDGER_IMAGE_TAG: "staging-b73e4f2"
  APP_VERSION: "1.7.15"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=staging"
  # Non-secret Azure + PMS routing (moved out of stayledger-ai-assistant-api-secrets).
  AZURE_OPENAI_ENDPOINT: "https://tekcent-openai.cognitiveservices.azure.com/"
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  AZURE_OPENAI_DEPLOYMENT: "gpt-4o-mini"
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
  # Step-2 AI hotel-template Markdown normalize (before canonical extract).
  # Fail-closed when enabled; set false only as ops break-glass.
  RAG_AI_CLEAN_ENABLED: "true"
  RAG_AI_CLEAN_DEPLOYMENT: "gpt-4o-mini"
  RAG_AI_CLEAN_PROMPT_VERSION: "hotel-kb-normalize-v2"
  STAYLEDGER_PMS_INTERNAL_BASE_URL: "https://stg-api.stayledger.io"
  RAG_QUERY_EMBEDDING_TIMEOUT_S: "5"
  LLM_OPERATION_BOOKING_EXTRACT_TIMEOUT_S: "4"
  # 2026-09-01 timeout tuning (Part 3) — real staging traffic (CAT04 matrix batch,
  # 200 cases) showed these narrow "second opinion" LLM calls timing out and
  # discarding a real (if late) result at a meaningful rate: injection_llm_classify
  # missed budget 20/57 sampled turns (elapsed 1.0-2.5s vs 1.0s default budget),
  # plus isolated overruns on reformulate/relevance-verify/intent-fallback (up to
  # ~3.5s). Each call fails open on timeout (never blocks the turn), so raising the
  # budget only trades a little latency for actually getting the LLM's second
  # opinion instead of silently falling back to deterministic-only more often than
  # intended. New values cover the observed p90-ish overrun with headroom; code
  # defaults (1.0/1.5/1.8/1.2s) are unchanged, this only overrides for staging.
  INJECTION_LLM_CLASSIFIER_TIMEOUT_S: "2.5"
  INTENT_LLM_FALLBACK_TIMEOUT_S: "2.2"
  RAG_REFORMULATE_TIMEOUT_S: "3.5"
  RAG_RELEVANCE_VERIFY_TIMEOUT_S: "2.5"
  # Staging rollout safety: one Uvicorn worker per API replica. The node is
  # resource-constrained and two startup workers repeatedly exited before
  # readiness; scale remains replica-based.
  UVICORN_WORKERS: "1"
  ADMIN_WEB_PUBLIC_URL: "https://stg-assistant.stayledger.io"
  CORS_ORIGINS: "https://stg-assistant.stayledger.io,http://10.89.1.40:30081,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3003"
  # Keep blank (base already ""); fail-closed tenant resolution must not rely on a default hotel.
  DEFAULT_TENANT_ID: ""
  # TEMP (matrix testing): pause API-embedded booking notification outbox so ops inbox stays quiet.
  # Outbox rows still enqueue (matrix can assert). Re-enable with "1" when email QA resumes.
  API_NOTIFICATION_OUTBOX_ENABLED: "0"
  API_ALERT_EVALUATOR_ENABLED: "0"
  CHANNEL_QUEUE_FAIL_CLOSED: "1"
  REQUIRE_RESOLVED_PROPERTY: "1"

  # --- Product defaults (all tenants; no allowlists) ---
  RAG_SCOPED_HYBRID_HOTPATH_ENABLED: "1"
  RAG_LEGACY_WARMUP_ENABLED: "0"
  RAG_GUEST_CITATIONS: "1"
  RAG_RETRIEVAL_BACKEND: "pgvector"
  RAG_CHUNK_PERSIST: "1"
  RAG_EMBEDDING_DIMENSIONS: "1536"
  # Copy a vector instead of paying to recompute it when the text is unchanged.
  # upsert_chunk_rows only ever looked inside the SAME generation, so a new
  # generation re-embedded byte-identical chunks; it now falls back to a lookup
  # on embedding_content_hash across every generation. Safe by construction:
  # that hash is the hash of canonical_embedding_text(title, content), which is
  # exactly the string the embed worker sends, so an equal hash means an equal
  # embedding input. Verified on vertex_suites_hanoi 2026-09-05 -- a rebuild of
  # 51 chunks with one edited reused 50 (ratio 0.980) with 0 rows whose vector
  # disagreed with their text. Accepts "1"/"0" or a comma-separated tenant
  # allowlist. Watch rag_embedding_reused_total: a ratio collapsing toward 0
  # means chunk boundaries moved, which is the fleet-wide re-embed
  # CANONICAL_CHUNKER_VERSION exists to gate.
  RAG_INCREMENTAL_EMBED: "1"
  # Off since 2026-09-08. This captured one knowledge candidate per guest turn:
  # 218,152 rows, 212,768 still pending, 5,384 rejected, ZERO ever approved, at
  # roughly 7,000 a day. A review queue nobody can work is not a backlog, it is
  # 146 MB and a write on the guest path. All of them were source_type='chat';
  # the feedback route has produced none, so this stops the whole inflow.
  # Production is a separate decision and has not been changed.
  RAG_CHAT_CANDIDATES_ENABLED: "0"
  # One canonical revision per SOURCE rather than per scope. Without it a scope
  # holding several files collapses to one revision on every edit: AI-clean and
  # fact extraction re-run over every file in the scope instead of the one that
  # changed, and _source_key_for_scope can no longer name the file a chunk came
  # from. Observed on vertex_suites_hanoi gen 3 -- editing the dining file left
  # Lieu Giai's chunks attributed to "property:prop-vertex-han-lieugiai" instead
  # of the two filenames they actually came from.
  # Verified end-to-end 2026-09-05: adding a second source to one hotel fanned
  # out into 2 runs and 2 revisions, and the generation carried 4 segments each
  # naming its own file. Scope-wide and per-source revisions coexist; the newer
  # approval wins, so turning this back off simply resumes scope-wide behaviour.
  KB_PER_SOURCE_REVISIONS: "1"
  # Fraction of retrievals recorded as a trace. Staging carries no guest load,
  # so 1.0 costs nothing and makes every probe visible; production wants a small
  # fraction, watched via rag_trace_dropped_total -- a nonzero drop rate means
  # the sample is biased toward the quiet moments.
  RAG_TRACE_SAMPLE_RATE: "1.0"
  FEATURE_RAG_PGVECTOR: "1"
  RAG_PGVECTOR_MIN_SIMILARITY: "0.35"
  RAG_HYBRID_SCORE_FLOOR: "0.25"
  FEATURE_RERANKER_ENABLED: "1"
  # Extra LLM rerank on scoped-hybrid remains off until quality evidence says otherwise.
  RAG_SCOPED_HYBRID_LLM_RERANK_ENABLED: "0"
  AI_CANONICAL_TURN_ENABLED: "1"
  AI_DURABLE_MEMORY_ENABLED: "1"
  AI_MULTITURN_MEMORY_ENABLED: "1"
  # Phase 3 canary — history replay only for cupid_hotel on staging.
  AI_MULTITURN_MEMORY_TENANT_ALLOWLIST: "cupid_hotel"
  # LLM-routing regex-reduction effort (2026-08-31) — staging validation, cupid_hotel
  # only, no percent canary (allowlist + pct<=0 = 100% within that one tenant). Both
  # operations already registered to the azure_nano profile for this tenant via
  # scripts/add_llm_profile.py before flipping these on.
  INTENT_LLM_FALLBACK_ENABLED: "1"
  INTENT_LLM_FALLBACK_TENANT_ALLOWLIST: "cupid_hotel"
  AGENTIC_RAG_ENABLED: "1"
  AGENTIC_RAG_TENANT_ALLOWLIST: "cupid_hotel"
  # Phase 1 (2026-08-31) — RAG relevance verifier, same cupid_hotel-only staging
  # validation shape as the two flags above; rag_relevance_verify already
  # registered to azure_nano for this tenant.
  RAG_RELEVANCE_VERIFIER_ENABLED: "1"
  RAG_RELEVANCE_VERIFIER_TENANT_ALLOWLIST: "cupid_hotel"
  # Phase 2 (2026-08-31) — LLM safety classifier, same cupid_hotel-only staging
  # validation shape; fail-open on classifier failure (explicit user decision).
  # safety_injection_classify already registered to azure_nano for this tenant.
  INJECTION_LLM_CLASSIFIER_ENABLED: "1"
  INJECTION_LLM_CLASSIFIER_TENANT_ALLOWLIST: "cupid_hotel"
  AI_CONVERSATION_STATE_RETENTION_DAYS: "30"
  AI_CONVERSATION_RETENTION_BATCH_SIZE: "100"
  AI_BUDGET_REDIS_FAILURE_MODE: "fail_closed"

  # --- PMS ---
  PMS_STAYLEDGER_ENABLED: "1"
  PMS_PROVIDER_DEFAULT: "stayledger"
  # PMS Web Chat context JWT (Nest signs RS256; Assistant verifies via public JWKS).
  # ClusterIP:80 → pod:3001. Public https://stg-api.stayledger.io JWKS is Cloudflare 403.
  PMS_CONTEXT_JWKS_URL: "http://stayledger-api.stayledger-staging.svc.cluster.local/api/.well-known/pms-web-chat-jwks.json"
  PMS_CONTEXT_ISS: "stayledger-pms"
  PMS_CONTEXT_AUD: "stayledger-ai-assistant"
  PMS_CONTEXT_CLOCK_SKEW_S: "10"
  PMS_READ_FALLBACK_MODE: "fail_closed"
  PMS_HTTP_MAX_RETRIES: "1"
  PMS_HTTP_TIMEOUT_S: "12"
  # Staging exercises draft booking (also pinned on API container by nonmutating canary).
  PMS_DRAFT_BOOKING_ENABLED: "1"
  PMS_CONVERSATION_SYNC_ENABLED: "0"
  # Writers that belong on dedicated Deployments stay off in the API process.
  PMS_OUTBOX_WORKER_ENABLED: "0"
  PMS_WORKERS_IN_API: "0"
  # Catalog sync is owned by the dedicated worker Deployment (+ nonmutating canary).
  PMS_CATALOG_SYNC_ENABLED: "0"
  PMS_CATALOG_SYNC_DRY_RUN: "1"

  # --- Channel safety (one delivery switch; no PSID/UID allowlist) ---
  CHANNEL_OUTBOUND_MODE: "sink"
  CHANNEL_OUTBOUND_ALLOWLIST_REQUIRED: "0"
  CHANNEL_BINDING_ENFORCEMENT: "enforce"
  WEBHOOK_REQUIRE_TENANT_API_KEY: "1"
  ZALO_WEBHOOK_REQUIRE_MAC: "1"

  # --- Capacity / pool pins (staging node profile; not product canaries) ---
  POSTGRES_POOL_SIZE: "20"
  PG_POOL_MAX_SIZE: "20"
  PG_POOL_MIN_SIZE: "20"
  REDIS_MAX_CONNECTIONS: "64"
  REDIS_POOL_WAIT_TIMEOUT_S: "3.0"
  REDIS_RATE_LIMIT_DEDICATED_POOL: "1"
  REDIS_RATE_LIMIT_SYNC_OFFLOAD: "1"
  REDIS_MEMORY_SYNC_OFFLOAD: "1"
  REDIS_RAG_CACHE_SYNC_OFFLOAD: "1"
  REDIS_BOOKING_STATE_SYNC_OFFLOAD: "1"
  REDIS_RATE_LIMIT_MAX_CONNECTIONS: "16"
  REDIS_RATE_LIMIT_POOL_WAIT_TIMEOUT_S: "1.0"
  RAG_EMBEDDING_MAX_CONCURRENCY: "8"
  RAG_SCOPED_RETRIEVAL_MAX_CONCURRENCY: "0"
  LLM_ASYNC_MAX_CONCURRENCY: "8"
  AI_ASYNC_RETRY_RAG_TRANSLATE_MAX_RETRIES: "0"
  # Staging matrix only: emit x-matrix-slots JSON on webhook responses (never guest body).
  MATRIX_DEBUG_SLOTS: "1"
