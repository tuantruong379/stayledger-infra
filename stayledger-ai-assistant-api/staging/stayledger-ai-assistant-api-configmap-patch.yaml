# Staging public URLs — NodePort + Cloudflare (no ingress).
#   UI:  https://stg-assistant.stayledger.io  (→ node :30081)
#   API: https://stg-api-assistant.stayledger.io (→ node :30080)
#
# Product defaults live in base where possible. This overlay keeps env-specific
# URLs, capacity pins, and a small set of safety/ops gates — not tenant allowlists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-ai-assistant-api-config
  namespace: stayledger-ai-assistant
data:
  ENVIRONMENT: "staging"
  APP_ENV: "staging"
  STAYLEDGER_IMAGE_DIGEST: "sha256:5da5dc22214f0a13be0ef207f1bd7af928e851396c84b1d54944e3c051f3a0b2"
  STAYLEDGER_IMAGE_TAG: "738f617"
  APP_VERSION: "1.2.7"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=staging"
  # Non-secret Azure + PMS routing (moved out of stayledger-ai-assistant-api-secrets).
  AZURE_OPENAI_ENDPOINT: "https://tekcent-openai.cognitiveservices.azure.com/"
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  AZURE_OPENAI_DEPLOYMENT: "gpt-4o-mini"
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
  # Step-2 AI hotel-template Markdown normalize (before canonical extract).
  # Fail-closed when enabled; set false only as ops break-glass.
  RAG_AI_CLEAN_ENABLED: "true"
  RAG_AI_CLEAN_DEPLOYMENT: "gpt-4o-mini"
  RAG_AI_CLEAN_PROMPT_VERSION: "hotel-kb-normalize-v2"
  STAYLEDGER_PMS_INTERNAL_BASE_URL: "https://stg-api.stayledger.io"
  RAG_QUERY_EMBEDDING_TIMEOUT_S: "5"
  LLM_OPERATION_BOOKING_EXTRACT_TIMEOUT_S: "4"
  # Staging rollout safety: one Uvicorn worker per API replica. The node is
  # resource-constrained and two startup workers repeatedly exited before
  # readiness; scale remains replica-based.
  UVICORN_WORKERS: "1"
  ADMIN_WEB_PUBLIC_URL: "https://stg-assistant.stayledger.io"
  CORS_ORIGINS: "https://stg-assistant.stayledger.io,http://10.89.1.40:30081,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3003"
  # Keep blank (base already ""); fail-closed tenant resolution must not rely on a default hotel.
  DEFAULT_TENANT_ID: ""
  # Temporary: API-embedded notification outbox until a dedicated Deployment owns polling.
  API_NOTIFICATION_OUTBOX_ENABLED: "1"
  API_ALERT_EVALUATOR_ENABLED: "0"
  CHANNEL_QUEUE_FAIL_CLOSED: "1"
  REQUIRE_RESOLVED_PROPERTY: "1"

  # --- Product defaults (all tenants; no allowlists) ---
  RAG_SCOPED_HYBRID_HOTPATH_ENABLED: "1"
  RAG_LEGACY_WARMUP_ENABLED: "0"
  RAG_GUEST_CITATIONS: "1"
  RAG_RETRIEVAL_BACKEND: "pgvector"
  RAG_CHUNK_PERSIST: "1"
  RAG_EMBEDDING_DIMENSIONS: "1536"
  FEATURE_RAG_PGVECTOR: "1"
  RAG_PGVECTOR_MIN_SIMILARITY: "0.35"
  RAG_HYBRID_SCORE_FLOOR: "0.25"
  FEATURE_RERANKER_ENABLED: "1"
  # Extra LLM rerank on scoped-hybrid remains off until quality evidence says otherwise.
  RAG_SCOPED_HYBRID_LLM_RERANK_ENABLED: "0"
  AI_CANONICAL_TURN_ENABLED: "1"
  AI_DURABLE_MEMORY_ENABLED: "1"
  AI_MULTITURN_MEMORY_ENABLED: "1"
  AI_CONVERSATION_STATE_RETENTION_DAYS: "30"
  AI_CONVERSATION_RETENTION_BATCH_SIZE: "100"
  AI_BUDGET_REDIS_FAILURE_MODE: "fail_closed"

  # --- PMS ---
  PMS_STAYLEDGER_ENABLED: "1"
  PMS_PROVIDER_DEFAULT: "stayledger"
  PMS_READ_FALLBACK_MODE: "fail_closed"
  PMS_HTTP_MAX_RETRIES: "1"
  # Staging exercises draft booking (also pinned on API container by nonmutating canary).
  PMS_DRAFT_BOOKING_ENABLED: "1"
  PMS_CONVERSATION_SYNC_ENABLED: "0"
  # Writers that belong on dedicated Deployments stay off in the API process.
  PMS_OUTBOX_WORKER_ENABLED: "0"
  PMS_WORKERS_IN_API: "0"
  # Catalog sync is owned by the dedicated worker Deployment (+ nonmutating canary).
  PMS_CATALOG_SYNC_ENABLED: "0"
  PMS_CATALOG_SYNC_DRY_RUN: "1"

  # --- Channel safety (one delivery switch; no PSID/UID allowlist) ---
  CHANNEL_OUTBOUND_MODE: "sink"
  CHANNEL_OUTBOUND_ALLOWLIST_REQUIRED: "0"
  CHANNEL_BINDING_ENFORCEMENT: "enforce"
  WEBHOOK_REQUIRE_TENANT_API_KEY: "1"
  ZALO_WEBHOOK_REQUIRE_MAC: "1"

  # --- Capacity / pool pins (staging node profile; not product canaries) ---
  POSTGRES_POOL_SIZE: "20"
  PG_POOL_MAX_SIZE: "20"
  PG_POOL_MIN_SIZE: "20"
  REDIS_MAX_CONNECTIONS: "64"
  REDIS_POOL_WAIT_TIMEOUT_S: "3.0"
  REDIS_RATE_LIMIT_DEDICATED_POOL: "1"
  REDIS_RATE_LIMIT_SYNC_OFFLOAD: "1"
  REDIS_MEMORY_SYNC_OFFLOAD: "1"
  REDIS_RAG_CACHE_SYNC_OFFLOAD: "1"
  REDIS_BOOKING_STATE_SYNC_OFFLOAD: "1"
  REDIS_RATE_LIMIT_MAX_CONNECTIONS: "16"
  REDIS_RATE_LIMIT_POOL_WAIT_TIMEOUT_S: "1.0"
  RAG_EMBEDDING_MAX_CONCURRENCY: "8"
  RAG_SCOPED_RETRIEVAL_MAX_CONCURRENCY: "0"
  LLM_ASYNC_MAX_CONCURRENCY: "8"
  AI_ASYNC_RETRY_RAG_TRANSLATE_MAX_RETRIES: "0"
  AI_ASYNC_RETRY_RAG_ANSWER_MAX_RETRIES: "0"
