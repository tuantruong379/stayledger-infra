# Keep rag-eval worker on the same staging API digest as kustomization images pin.
# Restate SA + resources so this strategic-merge patch is a complete Deployment
# for Kubernetes IaC scanners (S6865, S6892, S6864, S6873, S6897).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-assistant-rag-eval-worker
spec:
  template:
    spec:
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      volumes:
        - name: rag-leakage-meta
          configMap:
            name: stayledger-ai-assistant-rag-leakage-meta
      containers:
        - name: rag-eval-worker
          # Keep rag-eval on the same staging-b221927 digest as kustomization images.
          image: putin111/stayledger-ai-assistant-api@sha256:43986c09109c7ac7a7f9445b97c49cd6a9bda7f1d941cde3177b3df4d6e5ecb6
          volumeMounts:
            - name: rag-leakage-meta
              mountPath: /app/tests/evals/rag_leakage/staging.v1.jsonl.meta.json
              subPath: staging.v1.jsonl.meta.json
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: 32Mi
            limits:
              cpu: "1"
              memory: "1Gi"
              ephemeral-storage: 64Mi
