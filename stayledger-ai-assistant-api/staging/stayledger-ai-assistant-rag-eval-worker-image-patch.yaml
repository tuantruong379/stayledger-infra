# Keep rag-eval worker on the same staging API digest as kustomization images pin.
# Restate SA + resources so this strategic-merge patch is a complete Deployment
# for Kubernetes IaC scanners (S6865, S6892, S6864, S6873, S6897).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-assistant-rag-eval-worker
spec:
  template:
    spec:
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      volumes:
        - name: rag-leakage-meta
          configMap:
            name: stayledger-ai-assistant-rag-leakage-meta
      containers:
        - name: rag-eval-worker
          # No digest here on purpose. This is a strategic-merge patch; the
          # `images:` transformer in kustomization.yaml sets the digest for every
          # container using this image, this one included, and it wins. A digest
          # restated here is not a second pin -- it is a stale copy that drifts.
          # It did: on 2026-09-09 it still read staging-20260908-9ed2e5c (r30)
          # with a comment claiming it matched kustomization, eleven rebuilds
          # after that stopped being true, which cost real time verifying that
          # the eval had in fact run the code under test.
          image: putin111/stayledger-ai-assistant-api
          volumeMounts:
            - name: rag-leakage-meta
              mountPath: /app/tests/evals/rag_leakage/staging.v1.jsonl.meta.json
              subPath: staging.v1.jsonl.meta.json
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: 32Mi
            limits:
              cpu: "1"
              memory: "1Gi"
              ephemeral-storage: 64Mi
