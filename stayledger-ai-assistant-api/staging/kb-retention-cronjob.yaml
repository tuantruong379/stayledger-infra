# KB / conversation retention -- the first one this deployment has ever had.
#
# Until 2026-09-08 nothing on staging ever ran retention: the only CronJob in the
# namespace was postgres-backup. Nothing was collected, so nothing was bounded.
# Measured that day, with the inventory fixed so it could actually see the rows:
#
#   ai_conversation_states   206,216 rows,  45,692 past the 30-day window   82 MB
#   ai_canonical_turns       227,352 rows,  52,839 past 30 days            132 MB
#   ai_turn_outbox           227,333 rows,  52,822 past 30 days            119 MB
#   knowledge_candidates     218,152 rows,  46,983 past 30 days            166 MB
#   usage_events             635,075 rows, 170,975 past 30 days            284 MB
#
# ENFORCING as of 2026-09-08, after a dry run confirmed the numbers and the
# owner confirmed the data may be deleted. Every run still prints its inventory
# first, and every deleted row is archived to retention_archives beforehand:
# rollback_retention_run(purge_run_id) restores one run in full.
#
# Scheduled at 20:30 UTC, after postgres-backup at 19:00 UTC and with enough
# margin for it to finish. That ordering is the actual safety net: the night's
# dump is taken before the purge, so it still contains whatever the purge takes.
#
# RAG_RETENTION_TENANT_ALLOWLIST is '*', resolved at run time from the tenant
# registry. A literal list is the right safety property -- retention must never
# run on a tenant nobody chose -- but the wrong mechanism for a fleet: it is a
# ConfigMap someone has to remember to edit at every onboarding, and forgetting
# is silent. The tenant that gets no retention is the one nobody thinks about.
# '*' is still an explicit decision, recorded here, and required before anything
# runs; it just scales. Enforcement stays a separate switch.
#
# KB_RETIRED_CHUNK_GRACE_DAYS is the B3 sweeper, now active: publish_generation retires a
# generation without touching its chunks, and the KB_CHUNKS pass only collects
# rows with deleted_at set, so today every generation ever retired keeps its full
# chunk set and its vectors forever. On staging vertex_suites_hanoi carries 188
# undeleted chunks of which 51 belong to the active generation -- 137 are
# uncollectable. 30 days is the rollback window: rollback_generation re-activates
# a retired generation, and retrieval reads deleted_at IS NULL, so a generation
# swept too eagerly comes back serving nothing.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stayledger-ai-assistant-kb-retention
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-kb-retention
    app.kubernetes.io/part-of: stayledger-ai-assistant
    app.kubernetes.io/component: retention
spec:
  schedule: "30 20 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stayledger-ai-assistant-kb-retention
            app.kubernetes.io/part-of: stayledger-ai-assistant
        spec:
          restartPolicy: Never
          serviceAccountName: api-sa
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: putin111/stayledger-ai-assistant-api@sha256:fd69d6d492718c51033b0463aeca709ac47eded4bda28441ebf50637bf44b0cd
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - set -eu; cd /app;
                  echo "--- inventory (read-only) ---";
                  PYTHONPATH=/app /venv/bin/python scripts/kb_retention_dry_run.py --older-than-days 30;
                  echo "--- retention batch ---";
                  PYTHONPATH=/app /venv/bin/python scripts/kb_retention_purge.py
              env:
                # Enforcing since 2026-09-08, on explicit confirmation that the
                # data may be deleted. Rows are archived into retention_archives
                # before they are removed, so one run is recoverable in full via
                # rollback_retention_run(purge_run_id) -- the id is printed by
                # the job and written to audit_logs as retention.purge.batch.
                - name: RAG_RETENTION_ENFORCE
                  value: "1"
                - name: RAG_RETENTION_TENANT_ALLOWLIST
                  value: "*"
                # BATCH_SIZE bounds one transaction; MAX_BATCHES and MAX_SECONDS
                # bound one run. Those are different jobs and conflating them is
                # what made the first version unable to converge: one 500-row
                # bite per category per night, against a 45,692-row backlog that
                # grows by roughly 5,000 a day. It would have lost ground every
                # night it ran. 50 x 500 = up to 25,000 rows per category per
                # run, so the current backlog clears in two nights and steady
                # state is reached in one bite thereafter.
                - name: RAG_RETENTION_BATCH_SIZE
                  value: "500"
                - name: RAG_RETENTION_MAX_BATCHES
                  value: "50"
                # Stops the loop cleanly well inside activeDeadlineSeconds (1800)
                # rather than being killed mid-category. Each batch commits, so
                # stopping costs at most one batch.
                - name: RAG_RETENTION_MAX_SECONDS
                  value: "900"
                - name: KB_RETIRED_CHUNK_GRACE_DAYS
                  value: "30"
              envFrom:
                - configMapRef:
                    name: stayledger-ai-assistant-api-config
                - secretRef:
                    name: stayledger-ai-assistant-api-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                  ephemeral-storage: 32Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
                  ephemeral-storage: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
---
# `default-deny-all` selects every pod in the namespace for both directions, so a
# new workload reaches nothing until it is named. The first manual run of this
# CronJob failed with psycopg ConnectionTimeout for exactly that reason -- not a
# credential or DSN problem, and it looks identical to one from the logs.
#
# Same shape as allow-alembic-egress: Postgres and pgbouncer on 5432, nothing
# else. This job talks to the database and to nobody: it reads the tenant
# registry, previews or archives rows, and writes an audit_logs entry. DNS is
# already covered for every pod by allow-egress-dns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kb-retention-egress
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-kb-retention
    app.kubernetes.io/part-of: stayledger-ai-assistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stayledger-ai-assistant-kb-retention
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: stayledger-ai-assistant-pgbouncer
      ports:
        - port: 5432
          protocol: TCP
