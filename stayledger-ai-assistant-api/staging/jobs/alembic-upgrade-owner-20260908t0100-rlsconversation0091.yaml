apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-upgrade-0091
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: alembic-upgrade
    app.kubernetes.io/part-of: stayledger-ai-assistant
    stayledger.io/change: rls-conversation-plane
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alembic-upgrade
        app.kubernetes.io/part-of: stayledger-ai-assistant
    spec:
      restartPolicy: Never
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          # Runs AFTER r30 rolled out. A read against an RLS table with no bound
          # tenant returns EMPTY rather than failing, so every access path had to
          # be binding a scope BEFORE the policy exists -- otherwise the breakage
          # is silent. r30 carries those bindings.
          image: putin111/stayledger-ai-assistant-api@sha256:9c82c059aaee343b0fb6f3848f2e1eb1435d0c19737bd7bfe5a336dcf774ca1d
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - set -eu; export DATABASE_URL="$HOTEL_OPS_DSN_OWNER"; cd /app; PYTHONPATH=/app
              /venv/bin/alembic upgrade head && PYTHONPATH=/app /venv/bin/alembic current
          envFrom:
            - configMapRef:
                name: stayledger-ai-assistant-api-config
            - secretRef:
                name: stayledger-ai-assistant-migration-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
