# Staging overlay - NodePort (no ingress). Public URLs via Cloudflare -> node ports:
#   UI:  https://stg-assistant.stayledger.io       -> NodePort 30081
#   API: https://stg-api-assistant.stayledger.io  -> NodePort 30080
#
# Deploy (after base secrets):
#   kubectl apply -k stayledger-ai-assistant-api/staging/
#   kubectl rollout status deployment/stayledger-ai-assistant-api -n stayledger-ai-assistant
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-ai-assistant

resources:
  - ../base
  - stayledger-ai-assistant-pms-outbox-network-patch.yaml
  - stayledger-ai-assistant-rag-leakage-meta.yaml

patches:
  - path: stayledger-ai-assistant-api-configmap-patch.yaml
  - path: stayledger-ai-assistant-metrics-aggregator-configmap-patch.yaml
  - path: stayledger-ai-assistant-channel-worker-resources-patch.yaml
  - path: stayledger-ai-assistant-webhook-worker-resources-patch.yaml
  - path: stayledger-ai-assistant-scaling-production-patch.yaml
  - path: stayledger-ai-assistant-api-topology-spread-patch.yaml
    target:
      kind: Deployment
      name: stayledger-ai-assistant-api
  - path: stayledger-ai-assistant-api-release-annotations-patch.yaml
  - path: stayledger-ai-assistant-api-legacy-annotations-cleanup.yaml
  # Canonical turn is enabled for all tenants in the main ConfigMap patch (no tenant allowlist).
  - path: stayledger-ai-assistant-worker-freeze-replicas-patch.yaml
  - path: stayledger-ai-assistant-nonmutating-canary-replicas-patch.yaml
  - path: stayledger-ai-assistant-rag-eval-worker-image-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: stayledger-ai-assistant-rag-eval-worker
  - path: stayledger-ai-assistant-postgres-observability-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: stayledger-ai-assistant-postgres

# Rebuild 2026-08-31 (bug-fix pass) — 5 real bugs found via a full matrix v3
# CAT05/CAT08 review, no new features/flags. Off-topic-redirect regex misfired
# on unrelated requests (rain-umbrella ask, buy-tickets ask, breakfast-menu ask
# all got a canned "no discount codes" refusal) — narrowed the weather/local-food
# smalltalk pattern to require real context; "mua" (buy) was especially risky
# since accent-stripped "mưa" (rain) collides with it. Also closed 2 booking/
# pricing-funnel-swallow gaps (dry-clean price, early-breakfast timing) that an
# earlier session's ancillary-fee-FAQ escape hatch didn't yet cover. Pure regex
# fix — no ConfigMap/env changes (release/1.7.22 @ 45bda7d).
# Tag: staging-20260831-45bda7d
# Digest: sha256:e585378456184fa559ec11ecc9ce7bd2940f8a7f75758c47e1bb77a48a6c5caa
#
# Superseded rebuild history:
#   2026-08-31 (Phase 2) — adds an LLM safety classifier as defense-in-depth
#     behind the regex prompt-injection guard (inspect_prompt_injection): fires
#     only on messages the regex already let through, catching a manipulation
#     attempt the regex authors never anticipated — never duplicates a regex-
#     guaranteed block. Fail-open on any classifier failure/timeout/unparseable
#     response (explicit user decision — the first LLM call in this effort
#     where fail-open vs fail-closed is a real availability/protection tradeoff
#     rather than a safe default either way). Off by default; ConfigMap patch
#     turned it on for cupid_hotel only, azure_nano (-> gpt-4o-mini) already
#     registered for safety_injection_classify (release/1.7.22 @ 91dd585)
#     digest sha256:a481164d6d58ef1ebb140054219d202d55b05946a2df126c112cd2ad9f552e97
#   2026-08-31 (Phase 1) — adds the RAG relevance verifier: a new optional LLM
#     second opinion layered on top of (never instead of) the deterministic
#     _rag_evidence_answerable gate — confirms/downgrades a deterministic True via
#     one narrow yes/no LLM call on the top retrieved chunk, targeting the exact
#     hallucination pattern 3 rounds of regex patching couldn't close (a fluent
#     but unsupported claim from a loosely-related chunk that already clears the
#     deterministic bar). Never upgrades a deterministic rejection; a verifier
#     failure keeps the deterministic verdict unchanged (release/1.7.22 @ 7448fd9)
#     digest sha256:52b72ab36bd729b0ae67182c6db7c3c45418057bd126c1eb2c77d46443082ad3
#   2026-08-31 — regex-reduction effort: lands 3 previously-uncommitted,
#     tested-but-disabled LLM-routing features (LLM intent-classify fallback when
#     the regex classifier finds nothing; agentic RAG re-retrieval via one bounded
#     query-reformulation retry when first-pass evidence fails the answerability
#     gate; deterministic complexity-based rag_answer vs rag_answer_simple model
#     routing), plus a fix making complete_raw/acomplete_raw's operation= actually
#     select the model via a tenant's routing_operations (previously always
#     resolved via a hardcoded "chat" operation, so per-operation model routing —
#     including the two new operations above — silently had no effect). Enabled
#     intent-classify fallback + agentic re-retrieval for cupid_hotel only, no
#     percent canary yet (release/1.7.22 @ a7c52ed)
#     digest sha256:e5097649b7ec28bfff43719c5e710bc81ecc5dbd08da99e5364f904b24b271fb
#   2026-08-30 (r3) — extends r2 with a third retest finding: the coat-hanger
#     false-answer traced to "quan" accent-collision ("Quận" branch name vs
#     "Quần" as in "quần áo"=clothes) plus "phong" (room) being near-universal
#     boilerplate; excluding "phong" then exposed that single-noun amenity
#     questions ("Phòng có wifi không?") can never clear a flat ">=2 overlap"
#     bar on one real content token. Fixed with an adaptive threshold
#     (min(2, real-content-token-count)) plus a wifi-hyphen tokenization fix
#     ("Wi-Fi" was splitting into {"wi","fi"}, never matching "wifi")
#     (release/1.7.22 @ adc4530)
#     digest sha256:ec3bfcfb65023d1ae42c533c96879df6edb98c184a63051ee9f523fbe9bdfd33
#   2026-08-30 (r2) — RAG answerability overlap check's stopword list was
#     missing common VN filler/politeness words ("xin", "mình", "với",
#     "được", "cần"...), letting generic FAQ chunks satisfy the ">=2
#     overlap" bar with zero topical connection to the actual item asked
#     about (later found incomplete — see r3 above) (release/1.7.22 @ 1c71392)
#     digest sha256:748e094959e84efcd9a535bf7c4fa96a0906444ee49f69e16ed4c4df9c361623
#   2026-08-30 (r1) — standalone in-stay-service questions no longer swallowed
#     into the booking funnel, RAG answerability gate requires question/evidence
#     overlap (later found to target a retrieval branch inactive for this
#     tenant — see r2), 4 prompt-injection pattern gaps closed
#     (release/1.7.22 @ 9883a3b)
#     digest sha256:af4fb5ee55dd56d647f0e6c5f1306de9fa94f3497bc0ee6c1d0ca504f2f01d29
#   2026-08-19 r8 — PROPERTY_DISCOVERY uses fallback_outcome (release/1.7.22 @ 91d1bc8)
#     digest sha256:66eb9102d7240e50c179e49b02850699b52c5852016d907267993773d656d72d
#   2026-08-27 (out-of-band, never recorded here until now) — live digest was
#     sha256:180ff01ee6d1f0b9f37a072fa1e336ab78ed742b723a4bc281709f093c44f6b5,
#     applied via kubectl set image without updating this file. r1 superseded
#     it; it was built from the same release/1.7.22 branch at a later commit,
#     so nothing from it is lost.
images:
  - name: putin111/stayledger-ai-assistant-api
    newName: putin111/stayledger-ai-assistant-api
    digest: sha256:e585378456184fa559ec11ecc9ce7bd2940f8a7f75758c47e1bb77a48a6c5caa
