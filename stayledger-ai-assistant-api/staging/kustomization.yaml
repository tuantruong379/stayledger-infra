# Staging overlay - NodePort (no ingress). Public URLs via Cloudflare -> node ports:
#   UI:  https://stg-assistant.stayledger.io       -> NodePort 30081
#   API: https://stg-api-assistant.stayledger.io  -> NodePort 30080
#
# Deploy (after base secrets):
#   kubectl apply -k stayledger-ai-assistant-api/staging/
#   kubectl rollout status deployment/stayledger-ai-assistant-api -n stayledger-ai-assistant
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-ai-assistant

resources:
  - ../base
  - stayledger-ai-assistant-pms-outbox-network-patch.yaml

patches:
  - path: stayledger-ai-assistant-api-configmap-patch.yaml
  - path: stayledger-ai-assistant-metrics-aggregator-configmap-patch.yaml
  - path: stayledger-ai-assistant-channel-worker-resources-patch.yaml
  - path: stayledger-ai-assistant-webhook-worker-resources-patch.yaml
  - path: stayledger-ai-assistant-scaling-production-patch.yaml
  - path: stayledger-ai-assistant-api-release-annotations-patch.yaml
  - path: stayledger-ai-assistant-api-legacy-annotations-cleanup.yaml
  - path: stayledger-ai-assistant-canonical-turn-canary-patch.yaml
  - path: stayledger-ai-assistant-worker-freeze-replicas-patch.yaml
  - path: stayledger-ai-assistant-nonmutating-canary-replicas-patch.yaml
  - path: stayledger-ai-assistant-rag-eval-worker-image-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: stayledger-ai-assistant-rag-eval-worker
  - path: stayledger-ai-assistant-postgres-observability-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: stayledger-ai-assistant-postgres

# Immutable staging image built from API `5061a6b` and admin web `3c261af`.
# Tag: staging-20260801-5061a6b-3c261af
images:
  - name: putin111/stayledger-ai-assistant-api
    newName: putin111/stayledger-ai-assistant-api
    digest: sha256:3961a528490f2ca12b6cc25bee814714fbd11cc4f21eaf0904a2d918ae8412e7



