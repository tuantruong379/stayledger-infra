# KB content: ~30/78 from one dominant symptom (booking-funnel swallowing unrelated FAQ/
# modification/branch-compare questions into generic slot-fill), 3 genuine safety emergencies
# misrouted to a generic RAG "not found" reply, 4 residual safety-classifier false positives,
# ~15 multilingual/typo retrieval-robustness gaps (deferred, separate task), and the rest
# masked by the booking-funnel bug (can't be measured until that lands). Fixed 7 distinct
# root causes, each empirically verified in isolation and (for the booking-funnel cluster)
# end-to-end via Router.decide() with a real tenant-context fixture:
#   P0 handoff_signals.py — 3 emergency phrasings had no regex coverage at all ("chập điện",
