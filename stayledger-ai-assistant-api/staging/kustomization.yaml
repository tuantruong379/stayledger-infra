# Rebuild 2026-09-08 (r35: rrf_k derived from the corpus, boosts in rank steps).
# rrf_k was a constant carrying a comment saying it should not be one -- it is
# corpus-size dependent, and a per-tenant knob for something the code can measure
# is a knob nobody keeps correct as a KB grows. Derived per query now as
# n_candidates // 8 clamped to [4, 60]; setting it still pins it.
# The moment k varies, an absolute rerank weight means nothing fixed: one rank
# step is 0.0238 at k=5 and 0.000264 at k=60, so the same 0.03 is a 1.26-step
# nudge in one corpus and a 113-step veto in another. Every weight is now a
# multiple of one rank step and holds its meaning at every k by construction.
# Measured over 113 vi golden cases, three tenants:
#   before (fixed k=5, absolute weights)   recall@5 0.8850  MRR 0.6653
#   after  (derived k, rank-step weights)  recall@5 0.8938  MRR 0.6719
# Better on both. A variant measured higher still (0.8938 / 0.6913) and was
# rejected: it drops w_exact_branch below one rank step and silently gives up
# branch-over-tenant_global precedence, which is what lets property-wins decline
# to DELETE shared chunks (release/1.7.22 @ d5eb20b).
# Traces now record rrf_k_effective -- a snapshot saying rrf_k=None explains
# nothing, and every weight in it is denominated in that k.
