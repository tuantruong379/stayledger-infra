# Staging overlay - NodePort (no ingress). Public URLs via Cloudflare -> node ports:
#   UI:  https://stg-assistant.stayledger.io       -> NodePort 30081
#   API: https://stg-api-assistant.stayledger.io  -> NodePort 30080
#
# Deploy (after base secrets):
#   kubectl apply -k stayledger-ai-assistant-api/staging/
#   kubectl rollout status deployment/stayledger-ai-assistant-api -n stayledger-ai-assistant
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-ai-assistant

resources:
  - ../base
  - stayledger-ai-assistant-pms-outbox-network-patch.yaml
  - stayledger-ai-assistant-rag-leakage-meta.yaml

patches:
  - path: stayledger-ai-assistant-api-configmap-patch.yaml
  - path: stayledger-ai-assistant-metrics-aggregator-configmap-patch.yaml
  - path: stayledger-ai-assistant-channel-worker-resources-patch.yaml
  - path: stayledger-ai-assistant-webhook-worker-resources-patch.yaml
  - path: stayledger-ai-assistant-scaling-production-patch.yaml
  - path: stayledger-ai-assistant-api-topology-spread-patch.yaml
    target:
      kind: Deployment
      name: stayledger-ai-assistant-api
  - path: stayledger-ai-assistant-api-release-annotations-patch.yaml
  - path: stayledger-ai-assistant-api-legacy-annotations-cleanup.yaml
  # Canonical turn is enabled for all tenants in the main ConfigMap patch (no tenant allowlist).
  - path: stayledger-ai-assistant-worker-freeze-replicas-patch.yaml
  - path: stayledger-ai-assistant-nonmutating-canary-replicas-patch.yaml
  - path: stayledger-ai-assistant-rag-eval-worker-image-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: stayledger-ai-assistant-rag-eval-worker
  - path: stayledger-ai-assistant-postgres-observability-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: stayledger-ai-assistant-postgres

# Rebuild 2026-09-02 (explicit scope selection for /kb/import-file + /kb/import-url) —
# yesterday's tenant-scope write path could only be exercised by bypassing the admin
# HTTP API entirely (calling process_canonical_kb_run directly), because
# /kb/import-file had no way to pick a target branch and always processed the
# tenant's whole accumulated kb_documents blob rather than one file's own content.
# Adds an optional property_id form field (both import endpoints), clean single-file
# content instead of the accumulated blob whenever scope-aware, and 2 new nullable
# columns on kb_processing_runs (migration 0085, applied) so property_id/scope_type
# survive the async worker queue. Default case (no property_id, not TENANT-marked)
# is byte-for-byte unchanged. staging_publish_standard_kb.py's cupid_hotel entry now
# pins each branch file's property_id explicitly (release/1.7.22 @ 9d6eb87).
# Tag: staging-20260902-9d6eb87
# Digest: sha256:d16070d6f99f0ea4cb9ab84f6f26c2d8e0366b0fa7255f76a9b528d504502eb3
#
# Rebuild 2026-09-01 (tenant-scope detection follow-up fix) — the tenant-scope write
# path shipped one rebuild ago detected scope from a strict "must be literal line 1"
# regex match on the leading content_scope=tenant_global directive. Live verification
# immediately after that deploy found cupid_hotel.shared.md's own leading
# `<!-- Reasoning: ... -->` context comment (an established convention throughout this
# repo's KB source files) pushed the marker past line 1, so detection missed it and the
# file still resolved as PROPERTY scope. Now searches the whole header region (before
# the first heading), matching how classify_kb_markdown already tolerates multiple
# leading directive comments (release/1.7.22 @ 7f2ee2e).
# Tag: staging-20260901-7f2ee2e
# Digest: sha256:9f49a08e8f1e28ce4ea9edb3e4e26d85797b61c545cfde068445f3f6de943651
#
# Rebuild 2026-09-01 (tenant-scope write path) — process_canonical_kb_run always
# resolved a single property_id and stamped every derived revision/chunk to that one
# branch, so a multi-branch tenant's whole KB silently collapsed onto one branch on
# every fresh standard-reimport import (the old content_scope=tenant_global-per-
# section authoring convention was discarded by the AI-normalize round-trip before
# chunking ever saw it -- confirmed live 2026-09-01 by reproducing the collapse
# against the currently-published generation's own stored markdown with today's
# code). Adds a real scope_type=TENANT write path plus kb_canonical_chunk_worker.py
# support for combining a branch's PROPERTY revision with the tenant's shared
# TENANT revision into one generation per branch. cupid_hotel's pack is split into
# cupid_hotel.shared.md + one file per branch (see
# kb/standard-reimport/README.md's Multi-branch scope caveat) (release/1.7.22 @
# aa7d156).
# Tag: staging-20260901-aa7d156
# Digest: sha256:965169b3cd781e8fe6ba7c9bdac1f6ae4cc681503a0ff4ec9fb03ab940728260
#
# Rebuild 2026-09-01 (eval auto-enqueue resurrection fix) — cupid_hotel generation
# 21 (candidate for 3 new KB policy paragraphs: force_majeure, guest_modification,
# credit_transfer) was permanently stuck in status='building', occupying the
# tenant's one candidate-generation slot. Root cause: enqueue_ready_eval_jobs
# (app/repositories/rag_eval_repository.py) is called unconditionally after every
# embedding-worker batch success, system-wide, with no eval_status exclusion --
# so it kept re-enqueueing eval for generation 21 and flipping eval_status back
# to 'queued' before kb_canonical_chunk_worker._active_candidate_exists ever
# observed the 'failed' state needed to free the slot (confirmed live: two
# separate rag_eval_jobs rows created 7s apart, neither operator-triggered).
# Fixed by adding the same eval_status/workflow_state exclusion
# _active_candidate_exists already uses. New realdb integration test proves the
# fix (2/2 pass) (release/1.7.22 @ 642ef26).
# Tag: staging-20260901-642ef26
# Digest: sha256:9f2b5e22da9f56bec2083bead65d9b646a741a8d3694eb745202e06787c200bb
#
# Rebuild 2026-08-31 (RAG relevance-verifier negation fix) — G5_577 still showed
# rag_fallback live even after the synonym-gap fix (migration 0083, DB-only,
# no image rebuild — see migrations/alembic/versions/0083_...py) made the
# deterministic answerability gate correctly return True. Traced to the Phase 1
# LLM relevance verifier (only enabled for cupid_hotel): its zero-shot prompt
# made the model reply "no" for a passage that clearly says the hotel does NOT
# have a pool, even though a clear negation is itself a complete, correct
# answer — downgrading the correct verdict back to unanswerable. Fixed by
# adding one clarifying sentence to the prompt; live-tested the revised prompt
# against 3 cases before shipping (the bug case, the original hallucination-
# guard case this verifier exists for, and an ordinary positive answer) — all
# 3 came back correct (release/1.7.22 @ 654a97a).
# Tag: staging-20260831-654a97a
# Digest: sha256:0310fefdfc29a05b4d8854e588d642a5b722fd44be8243d9da0d7ad6e81e3940
#
# Rebuild 2026-08-31 (follow-up refinement) — live staging retest of the
# duplicate-letter typo tolerance below (G5_577) found a typo'd stopword
# ("khonng" -> collapses to "khong", already a stopword) wasn't being
# recognized as boilerplate, so it survived as spurious "real content" and
# inflated the RAG answerability gate's adaptive overlap threshold in the
# wrong direction. Fixed by discarding the original typo'd token too
# whenever its collapsed form is a stopword, not just skipping the
# collapsed twin (release/1.7.22 @ f1913c1).
#
# Superseded rebuild history:
#   2026-08-31 (typo'd-stopword follow-up) — see body above
#     (release/1.7.22 @ f1913c1)
#     digest sha256:b67e9e6be337858334132840d925fe7db740150f6ff149e4f380884b227e9bf7
#   2026-08-31 (language + typo-tolerance follow-up) — two gaps scoped out
#     after the prior pass: non-VI/EN language handling (broadened French
#     keyword detection + narrowed the Vietnamese-diacritic exclusion that
#     was vetoing real French sentences) and duplicate-letter typo tolerance
#     in the RAG answerability gate (release/1.7.22 @ 500f62a)
#     digest sha256:a631a5eb1db0aaecc578f5f95c01227dfff3a2e45a35cc84d77aae9b196ffa45
#   2026-08-31 (bug-fix pass) — 5 real bugs found via a full matrix v3
#     CAT05/CAT08 review, no new features/flags. Off-topic-redirect regex
#     misfired on unrelated requests (rain-umbrella ask, buy-tickets ask,
#     breakfast-menu ask all got a canned "no discount codes" refusal) —
#     narrowed the weather/local-food smalltalk pattern to require real
#     context; "mua" (buy) was especially risky since accent-stripped "mưa"
#     (rain) collides with it. Also closed 2 booking/pricing-funnel-swallow
#     gaps (dry-clean price, early-breakfast timing) that an earlier
#     session's ancillary-fee-FAQ escape hatch didn't yet cover
#     (release/1.7.22 @ 45bda7d)
#     digest sha256:e585378456184fa559ec11ecc9ce7bd2940f8a7f75758c47e1bb77a48a6c5caa
#   2026-08-31 (Phase 2) — adds an LLM safety classifier as defense-in-depth
#     behind the regex prompt-injection guard (inspect_prompt_injection): fires
#     only on messages the regex already let through, catching a manipulation
#     attempt the regex authors never anticipated — never duplicates a regex-
#     guaranteed block. Fail-open on any classifier failure/timeout/unparseable
#     response (explicit user decision — the first LLM call in this effort
#     where fail-open vs fail-closed is a real availability/protection tradeoff
#     rather than a safe default either way). Off by default; ConfigMap patch
#     turned it on for cupid_hotel only, azure_nano (-> gpt-4o-mini) already
#     registered for safety_injection_classify (release/1.7.22 @ 91dd585)
#     digest sha256:a481164d6d58ef1ebb140054219d202d55b05946a2df126c112cd2ad9f552e97
#   2026-08-31 (Phase 1) — adds the RAG relevance verifier: a new optional LLM
#     second opinion layered on top of (never instead of) the deterministic
#     _rag_evidence_answerable gate — confirms/downgrades a deterministic True via
#     one narrow yes/no LLM call on the top retrieved chunk, targeting the exact
#     hallucination pattern 3 rounds of regex patching couldn't close (a fluent
#     but unsupported claim from a loosely-related chunk that already clears the
#     deterministic bar). Never upgrades a deterministic rejection; a verifier
#     failure keeps the deterministic verdict unchanged (release/1.7.22 @ 7448fd9)
#     digest sha256:52b72ab36bd729b0ae67182c6db7c3c45418057bd126c1eb2c77d46443082ad3
#   2026-08-31 — regex-reduction effort: lands 3 previously-uncommitted,
#     tested-but-disabled LLM-routing features (LLM intent-classify fallback when
#     the regex classifier finds nothing; agentic RAG re-retrieval via one bounded
#     query-reformulation retry when first-pass evidence fails the answerability
#     gate; deterministic complexity-based rag_answer vs rag_answer_simple model
#     routing), plus a fix making complete_raw/acomplete_raw's operation= actually
#     select the model via a tenant's routing_operations (previously always
#     resolved via a hardcoded "chat" operation, so per-operation model routing —
#     including the two new operations above — silently had no effect). Enabled
#     intent-classify fallback + agentic re-retrieval for cupid_hotel only, no
#     percent canary yet (release/1.7.22 @ a7c52ed)
#     digest sha256:e5097649b7ec28bfff43719c5e710bc81ecc5dbd08da99e5364f904b24b271fb
#   2026-08-30 (r3) — extends r2 with a third retest finding: the coat-hanger
#     false-answer traced to "quan" accent-collision ("Quận" branch name vs
#     "Quần" as in "quần áo"=clothes) plus "phong" (room) being near-universal
#     boilerplate; excluding "phong" then exposed that single-noun amenity
#     questions ("Phòng có wifi không?") can never clear a flat ">=2 overlap"
