# Rebuild 2026-09-02 (SonarQube: ReDoS in utc-offset regex, S5852) —
# app/services/hotel/time.py's `utc\s*([+\-]?\s*\d{1,2})` had unbounded \s* on both
# sides of an optional sign; whenever the sign is absent this collapses to adjacent
# \s*\s* over the same character class, causing polynomial-time backtracking on a long
# non-matching whitespace run. resolve_iana_timezone() has no caller-side length guard
# (plain public function), so this was a real DoS surface -- confirmed locally: the old
# regex took ~23s on "utc" + 50k spaces + a non-digit; bounding to \s{0,3} (still covers
# any realistic "utc + 7" spelling) resolves the same input in under a millisecond. The
# identical pattern, duplicated inside _TZ_CONVERT_RE's `source` alternative, was fixed
# too (release/1.7.22 @ 653a6ca).
