# Scrape database/cache exporters deployed in the stayledger-ai-assistant namespace.
# Staging names its exporter Services stayledger-ai-assistant-{postgres,redis}-exporter, production
# still uses the pre-rename {postgres,redis}-exporter; select both and normalise `job` to the short
# name so one set of alert rules works in both environments. (Until 2026-09-29 each cluster's
# selector matched only the other cluster's names, so neither scraped these exporters.)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: stayledger-ai-assistant-datastore-exporters
  namespace: observability
  labels:
    release: kps
    app.kubernetes.io/name: stayledger-ai-assistant-datastore-exporters
    app.kubernetes.io/part-of: stayledger-ai-assistant
spec:
  namespaceSelector:
    matchNames:
      - stayledger-ai-assistant
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - stayledger-ai-assistant-postgres-exporter
          - stayledger-ai-assistant-redis-exporter
          - postgres-exporter
          - redis-exporter
  jobLabel: app.kubernetes.io/name
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
      relabelings:
        - sourceLabels: [job]
          regex: (?:stayledger-ai-assistant-)?(postgres|redis)-exporter
          targetLabel: job
          replacement: $1-exporter
