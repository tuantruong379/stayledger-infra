apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-stayledger-ai-assistant
  namespace: stayledger-ai-assistant
  labels:
    app: ai-stayledger-ai-assistant
    component: api
    app.kubernetes.io/name: ai-stayledger-ai-assistant
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ai-stayledger-ai-assistant
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 ensures traffic is never dropped during rollout.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ai-stayledger-ai-assistant
        component: api
      annotations:
        # Force pod restart when the ConfigMap/Secret changes (requires kustomize hash suffix or manual bump).
        kubectl.kubernetes.io/restartedAt: "2026-01-01T00:00:00Z"
    spec:
      # terminationGracePeriodSeconds > uvicorn --graceful-timeout (20s) + probe period (10s).
      terminationGracePeriodSeconds: 35

      # Spread pods across nodes so a single node failure does not take the service down.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: ai-stayledger-ai-assistant
            component: api

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      initContainers:
      # Runs alembic upgrade head before any app replica starts.
      # alembic uses an advisory lock so concurrent init containers on rolling deploy are safe.
      # For large clusters prefer a Helm pre-upgrade hook or ArgoCD Sync Wave over this pattern.
      - name: alembic-migrate
        image: putin111/stayledger-ai-assistant-api:latest   # pin to the same SHA as the main container in CI
        imagePullPolicy: IfNotPresent
        command: ["alembic", "upgrade", "head"]
        envFrom:
        - secretRef:
            name: ai-stayledger-ai-assistant-secrets
        - configMapRef:
            name: ai-stayledger-ai-assistant-config
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: tmp
          mountPath: /tmp

      containers:
      - name: api
        image: putin111/stayledger-ai-assistant-api:latest   # pin to SHA in CI (e.g. @sha256:...)
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8000
          protocol: TCP

        envFrom:
        - secretRef:
            name: ai-stayledger-ai-assistant-secrets
        - configMapRef:
            name: ai-stayledger-ai-assistant-config
        # Per-pod tuning — override ConfigMap defaults here if needed.
        env:
        - name: UVICORN_WORKERS
          value: "1"

        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            # Burstable CPU for LLM response parsing spikes.
            cpu: "1000m"
            # litellm + asyncpg pool + OpenTelemetry can reach ~1Gi under load.
            memory: "2Gi"

        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]

        volumeMounts:
        - name: tmp
          mountPath: /tmp

        # startupProbe: gives the container up to 3 minutes (18 × 10s) to become
        # ready — accounts for DB connection pool warm-up and first-request compilation.
        # Liveness/readiness probes are suspended until startupProbe succeeds.
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 18
          periodSeconds: 10
          timeoutSeconds: 5

        # readinessProbe: removes the pod from the Service endpoints when /health fails.
        # Prevents traffic from reaching a pod that lost its DB or Redis connection.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        # livenessProbe: restarts the container if it becomes permanently unhealthy.
        # Long period avoids restarting during transient PMS or LLM outages.
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

      volumes:
      # Writable /tmp for uvicorn and OpenTelemetry temp files; capped to 64Mi.
      # readOnlyRootFilesystem: true is safe because Python writes nothing outside /tmp
      # when PYTHONDONTWRITEBYTECODE=1 is set.
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: ai-stayledger-ai-assistant
  namespace: stayledger-ai-assistant
  labels:
    app: ai-stayledger-ai-assistant
    component: api
spec:
  selector:
    app: ai-stayledger-ai-assistant
    component: api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  type: ClusterIP

---
# ConfigMap: non-secret runtime config. Secrets (API keys, DSN) go in the Secret below.
# Apply with: kubectl apply -f api-configmap.yaml (not included here — contains env-specific values).
#
# Required keys in ai-stayledger-ai-assistant-secrets:
#   DATABASE_URL, HOTEL_OPS_DSN, REDIS_URL, AZURE_OPENAI_API_KEY,
#   AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_DEPLOYMENT, OPENAI_API_KEY (if used)
#
# Required keys in ai-stayledger-ai-assistant-config:
#   AZURE_OPENAI_API_VERSION, LOG_LEVEL,
#   PMS_CONNECTOR_ENABLED, PMS_PROVIDER_DEFAULT, PMS_STAYLEDGER_ENABLED,
#   PMS_DRAFT_BOOKING_ENABLED, PMS_CONVERSATION_SYNC_ENABLED,
#   PMS_READ_FALLBACK_MODE, PMS_OUTBOX_WORKER_ENABLED,
#   PMS_OUTBOX_WORKER_POLL_SECONDS
