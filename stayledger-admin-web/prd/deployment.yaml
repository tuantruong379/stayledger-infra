---
# ConfigMap: all non-secret runtime configuration.
# NEXT_PUBLIC_API_URL and NEXT_PUBLIC_BOOKING_WEB_URL are runtime-injectable —
# the env-inject init container replaces the placeholder URLs baked into the
# image at build time. Update these values and redeploy; no image rebuild needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-admin-web-config
  namespace: stayledger
  labels:
    app: stayledger-admin-web
    component: frontend
    environment: production
data:
  NODE_ENV: "production"
  # Replaced at container start by the env-inject init container.
  NEXT_PUBLIC_API_URL: "https://stayledger.tekcent.com/api"
  NEXT_PUBLIC_BOOKING_WEB_URL: "https://stayledger.tekcent.com"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-admin-web
  namespace: stayledger
  labels:
    app: stayledger-admin-web
    component: frontend
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stayledger-admin-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: stayledger-admin-web
        component: frontend
        environment: production
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # env-inject: copies /app/.next into the next-patched emptyDir and replaces
      # the placeholder URLs with the runtime values from the ConfigMap.
      # The main container then mounts next-patched at /app/.next so it serves
      # the patched bundle while keeping readOnlyRootFilesystem: true.
      initContainers:
      - name: env-inject
        # Must use the same image as the main container.
        image: putin111/stayledger-admin-web:91375c2
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop: [ALL]
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          cp -r /app/.next/. /next-patched/
          find /next-patched -type f -name "*.js" -print0 | \
            xargs -0 sed -i \
              -e "s|https://placeholder-api.invalid/api|${NEXT_PUBLIC_API_URL}|g" \
              -e "s|https://placeholder-booking.invalid|${NEXT_PUBLIC_BOOKING_WEB_URL}|g"
        envFrom:
        - configMapRef:
            name: stayledger-admin-web-config
        volumeMounts:
        - name: next-patched
          mountPath: /next-patched
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      containers:
      - name: admin-web
        # Deploy: kubectl set image deployment/stayledger-admin-web
        #   admin-web=putin111/stayledger-admin-web:<GIT_SHA> -n stayledger
        # Update the init container image to the same tag.
        image: putin111/stayledger-admin-web:91375c2
        imagePullPolicy: Always
        # Override Dockerfile CMD (entrypoint.sh) — patching is done by the init container.
        command: ["node", "server.js"]
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: stayledger-admin-web-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: next-patched
          mountPath: /app/.next
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
      volumes:
      - name: next-patched
        emptyDir: {}
      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: stayledger-admin-web
  namespace: stayledger
  labels:
    app: stayledger-admin-web
    component: frontend
    environment: production
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30000
    protocol: TCP
    name: http
  selector:
    app: stayledger-admin-web
