apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-admin-web
spec:
  # Single-node hub: 2nd replica is unschedulable under DoNotSchedule topology.
  replicas: 1
  # Cap stale ReplicaSet history (Cycle 10 staging hygiene).
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        # Match kustomization images pin (tag 131c3c4 / release/1.4.14).
        version: "131c3c4"
    spec:
      containers:
        - name: admin-web
          # Align with production right-sizing (live ~62Mi).
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "50Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
              ephemeral-storage: "200Mi"
