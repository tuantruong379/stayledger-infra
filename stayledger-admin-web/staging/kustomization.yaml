# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest — release/1.3.21 @ 595788b (ledger-only payment method labels + e-wallet/QR hints).
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:8bc3bd458881965e06fc26920d236f267c084f77f7a7d7035bc39bfb49395ef8

patches:
  - path: patches/deployment-staging.yaml
