# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest so env-inject init and main container share the same image.
# Built from release/1.3.10 @ 77cebd3:
# Error/404 UX polish + i18n, Jenkins Docker publish tag on its own line.
# Tag: 77cebd3
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:442b5279f2d326b50bf9a636024cacb7e05769fd54eb84a484cbded824d15aff

patches:
  - path: patches/deployment-staging.yaml
