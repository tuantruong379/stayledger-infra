# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest — release/1.3.15 @ c0c9374 (localized SSR titles, UX audit fixes).
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:93a53616a54ff8d5b984bac4bae14ff2092b4c35348a409ae1f27abd90f40ac2

patches:
  - path: patches/deployment-staging.yaml
