# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest so env-inject init and main container share the same image.
# Built from release/1.3.5 @ b258cbd (properly committed + pushed to origin):
# 3 fixes from the production UI/UX/i18n screenshot review 2026-08-18 —
# property-load stuck-spinner/no-retry, datetime-picker + availability
# calendar + billing plan-status + settings-config i18n (10+ call sites),
# AI automation suggestion detail blank-on-404 page.
# Tag: staging-b258cbd
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:6eea417e9557d1da4ccfbb7879878f7da0df4b245f0da8355510310b0108f86b

patches:
  - path: patches/deployment-staging.yaml
