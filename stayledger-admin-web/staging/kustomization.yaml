# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest so env-inject init and main container share the same image.
# Built from release/1.3.6 @ 73179a0:
# UI/UX review fixes — localize 403 toasts (VI), reports PermissionLimitedState,
# AI Ops remove beta + humanize quota source, unify DD-MM-YYYY dates, checked-out
# contrast, toast vs FAB, guest-name truncate, locale percent separators.
# Tag: staging-73179a09
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:c30dbf0407904d8a23b07888c1d832a3fab65da3bdecb54e0b26cec72ad227e8

patches:
  - path: patches/deployment-staging.yaml
