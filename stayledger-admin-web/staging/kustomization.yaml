# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest — release/1.3.16 @ d95d9c0 (tab-aware SSR titles, RBAC finance tabs, detail titles, VND list).
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:c4bbe908572de084a275cb046ecd7574d4ea82bba4e40cc7eea76abd190f2328

patches:
  - path: patches/deployment-staging.yaml
