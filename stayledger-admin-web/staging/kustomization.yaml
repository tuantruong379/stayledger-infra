# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest so env-inject init and main container share the same image.
# Built from release/1.3.8 @ 634bec2:
# P3 polish — VND chart tick commas, mobile truncation, AI Usage units copy,
# hằng ngày spelling, balance-due Paid label, guest-name line-clamp.
# Tag: staging-634bec2
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:fb5d28c8252ea9f0ba31544a3fb4b06a61814bd2dedf1271ffc43b0dc5a9f1ec

patches:
  - path: patches/deployment-staging.yaml
