# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

