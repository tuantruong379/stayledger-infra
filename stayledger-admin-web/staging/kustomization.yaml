# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest — release/1.4.1 @ c1033cb (Sonar cleanup + Verify pipeline speedups).
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:a30cfea53b67d43b2217676234dee523888e866985610a6c87def6fc2752da19

patches:
  - path: patches/deployment-staging.yaml
