# Staging overlay — NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Admin-web release/1.2.33 (d6fda35) — Phase 0–2 UI/UX polish
images:
  - name: putin111/stayledger-admin-web
    newTag: "1.2.33"

patches:
  - path: patches/deployment-staging.yaml
