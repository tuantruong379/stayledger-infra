# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest so env-inject init and main container share the same image.
# Built from release/1.3.12 @ 0f09b514:
# Hide currency selector on settings/config; keep VND defaultCurrency on save.
# Tag: 0f09b514
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:7a6c461076993cdf87e68506e9c98719234e564529e460f018af822a419c5498

patches:
  - path: patches/deployment-staging.yaml
