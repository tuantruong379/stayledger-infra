# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest — tag 645fc77 (release/1.4.5)
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:4efce28da245e18eaea0bc9cbfa293a97a3e807e1d9e2a315892e78d9e3fafa3

patches:
  - path: patches/deployment-staging.yaml
  - path: patches/hpa-staging.yaml
  - path: patches/topology-spread-staging.yaml
    target:
      kind: Deployment
      name: stayledger-admin-web
