# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest so env-inject init and main container share the same image.
# Built from release/1.3.7 @ 1cf39c2:
# P2/P3 polish — checked-out contrast, Guest Chat Usage i18n, mobile header/
# truncation, reports nav label, chart percent locale, softer quota source,
# AI Ops Hoàn tất badge.
# Tag: staging-1cf39c2
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:b325e4cc2c9d1d2dbcff6c0df38d64a2dd61e1fd54842d0a97cf0a6a3d92d422

patches:
  - path: patches/deployment-staging.yaml
