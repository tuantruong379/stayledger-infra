# Staging overlay — NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Staging rebuild 2026-07-18 — AI Center UX remediation (release/1.2.31)
images:
  - name: putin111/stayledger-admin-web
    newTag: staging-1d8e6469

patches:
  - path: patches/deployment-staging.yaml
