# Staging overlay - NodePort 30010 + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest so env-inject init and main container share the same image.
# Built from release/1.3.9 @ c1a3d9a:
# AI Usage number locale, EN AI units plan copy, mobile hotel-prefix shorten,
# dark Checked Out contrast.
# Tag: staging-c1a3d9a
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:00d629014415938a21c4f35e618f2e1714979d240b671dd47031b19eb9ea42b6

patches:
  - path: patches/deployment-staging.yaml
