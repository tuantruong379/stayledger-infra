---
# Allow the frontend pods to receive HTTP traffic from the nginx ingress controller
# and from kube-proxy (NodePort).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stayledger-admin-web-ingress
  namespace: stayledger
  labels:
    app: stayledger-admin-web
    environment: production
spec:
  podSelector:
    matchLabels:
      app: stayledger-admin-web
  policyTypes:
    - Ingress
  ingress:
    # nginx ingress controller (app.stayledger.io)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    # NodePort traffic from kube-proxy (direct ops access via port 30000)
    - ports:
        - protocol: TCP
          port: 3000

---
# Allow the frontend to reach the API service and DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stayledger-admin-web-egress
  namespace: stayledger
  labels:
    app: stayledger-admin-web
    environment: production
spec:
  podSelector:
    matchLabels:
      app: stayledger-admin-web
  policyTypes:
    - Egress
  egress:
    # DNS resolution (CoreDNS)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # stayledger-api ClusterIP service (Next.js server-side proxy rewrites)
    - to:
        - podSelector:
            matchLabels:
              app: stayledger-api
      ports:
        - protocol: TCP
          port: 3001
