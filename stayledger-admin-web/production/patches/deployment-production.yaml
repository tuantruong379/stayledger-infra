apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-admin-web
spec:
  replicas: 2
  template:
    metadata:
      labels:
        version: "sha-PLACEHOLDER"
    spec:
      containers:
        - name: admin-web
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
