apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-admin-web
spec:
  # replicas owned by HPA (min 2); kept here so apply without HPA still starts HA.
  replicas: 2
  minReadySeconds: 15
  # Best practice: cap rollback history in production (was unset -> live drifted to 3 via ad-hoc patch).
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Enforce zero-downtime on every production apply (do not loosen).
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        # Match kustomization images pin (tag 131c3c4 / release/1.4.14).
        version: "131c3c4"
      annotations:
        stayledger.io/git-sha: "131c3c4"
        stayledger.io/branch: "release/1.4.14"
        kubernetes.io/change-cause: "Deploy admin-web pagination unify 131c3c4"
    spec:
      containers:
        - name: admin-web
          # Sized to live usage (~2m / ~80Mi) with SSR headroom; HPA scales pods
          # on CPU% of request before vertical inflation.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
