# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote staging-verified admin-web — tag staging-c30e3d39 (release/1.3.14):
#   Staff rate-plan create UI, property fees card, stay-restrictions inventory tab,
#   CI/CO/cancel POST alignment.
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:d3c5d54b4b2914fc6ba8125c78c6cf2b6b9a5ec27efbc03bc207ea3cabbcfc42

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
