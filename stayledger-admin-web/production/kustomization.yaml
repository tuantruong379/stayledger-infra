# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote admin-web release/1.3.15 (c0c9374) — localized SSR page titles, integrations/api-keys tab,
# STAFF reconcile gating, UX audit fixes.
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:93a53616a54ff8d5b984bac4bae14ff2092b4c35348a409ae1f27abd90f40ac2

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
