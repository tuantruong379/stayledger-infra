# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote staging-verified admin-web tip - staging-1cf39c2, healthy on
# HK-HUB staging 2026-08-21 (release/1.3.7 @ 1cf39c2):
#   P2/P3 polish - checked-out contrast, Guest Chat Usage i18n, mobile header/
#   truncation, reports nav label, chart percent locale, softer quota source,
#   AI Ops Hoàn tất badge.
# Pin digest (not floating tag) to match staging's convention.
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:b325e4cc2c9d1d2dbcff6c0df38d64a2dd61e1fd54842d0a97cf0a6a3d92d422

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
