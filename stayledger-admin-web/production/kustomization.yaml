# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote admin-web release/1.3.16 (d95d9c0) — tab-aware titles, RBAC finance tabs, detail titles, VND list.
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:c4bbe908572de084a275cb046ecd7574d4ea82bba4e40cc7eea76abd190f2328

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
