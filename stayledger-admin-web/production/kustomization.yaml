# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote staging-verified admin-web — tag staging-0f09b514 (release/1.3.12):
#   Hide currency selector on settings/config; keep PropertyConfig.defaultCurrency on save.
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:7a6c461076993cdf87e68506e9c98719234e564529e460f018af822a419c5498

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
