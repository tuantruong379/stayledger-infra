# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote staging-verified admin-web tip - staging-c1a3d9a, healthy on
# HK-HUB staging 2026-08-21 (release/1.3.9 @ c1a3d9a):
#   AI Usage number locale, EN AI units plan copy, mobile hotel-prefix shorten,
#   dark Checked Out contrast.
# Pin digest (not floating tag) to match staging's convention.
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:00d629014415938a21c4f35e618f2e1714979d240b671dd47031b19eb9ea42b6

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
