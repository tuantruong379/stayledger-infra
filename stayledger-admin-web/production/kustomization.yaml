# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote admin-web — tag 131c3c4 (release/1.4.14).
images:
  - name: putin111/stayledger-admin-web
    # c0d3a34 (2026-09-27): next 16.3.6 -- GHSA-2xp9-vwfh-vxw4 unauthenticated RCE via /_next/image.
    # 53f5ddb (2026-09-29): availability tab title h1 -> h2.
    # 64f256b (2026-09-29): prod CSP drops dev storage host; tab h1s -> h2; sharp 0.35.5.
    digest: sha256:496a7744e43b13038081552b95ea90dd7b8bb790e5c7c361d9c16f8f3cd8e74c

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
