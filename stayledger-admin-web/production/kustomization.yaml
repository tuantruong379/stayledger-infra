# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote admin-web release/1.3.17 (86a426d) — payment refund zero fix, STAFF finance subtitle, bookings filter.
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:b922206242a179f25735a137f552301ee2f84f10b0982b41d6b6cab9386b4343

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
