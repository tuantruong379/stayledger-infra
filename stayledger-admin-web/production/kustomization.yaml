# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote staging-verified admin-web tip - staging-634bec2, healthy on
# HK-HUB staging 2026-08-21 (release/1.3.8 @ 634bec2):
#   P3 polish - VND chart tick commas, mobile truncation, AI Usage units copy,
#   hằng ngày spelling, balance-due Paid label, guest-name line-clamp.
# Pin digest (not floating tag) to match staging's convention.
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:fb5d28c8252ea9f0ba31544a3fb4b06a61814bd2dedf1271ffc43b0dc5a9f1ec

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
