# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote admin-web release/1.3.21 (595788b) — ledger-only payment method labels + e-wallet/QR hints.
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:8bc3bd458881965e06fc26920d236f267c084f77f7a7d7035bc39bfb49395ef8

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
