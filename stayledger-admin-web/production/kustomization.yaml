# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote staging-verified admin-web tip — staging-b258cbd, verified healthy
# on HK-HUB staging 2026-08-18 (staging-readiness-audit: 27/27 checks, 12/12
# matrix, 0 unexpected 4xx/5xx, 0 i18n gaps) (release/1.3.5 @ b258cbd):
#   3 fixes from the production UI/UX/i18n screenshot review 2026-08-18 —
#   property-load stuck-spinner/no-retry, datetime-picker + availability
#   calendar + billing plan-status + settings-config i18n (10+ call sites),
#   AI automation suggestion detail blank-on-404 page.
# Pin digest (not floating tag) to match staging's convention.
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:6eea417e9557d1da4ccfbb7879878f7da0df4b245f0da8355510310b0108f86b

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
