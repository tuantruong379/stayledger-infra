# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Release image from staging promote 2026-07-15 (verify:golive PASS)
images:
  - name: putin111/stayledger-admin-web
    newTag: f0565de

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
