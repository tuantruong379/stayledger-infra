# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote staging-verified admin-web — tag staging-77cebd39, healthy on HK-HUB staging 2026-08-22:
#   Hide payment-settings tab; property-info VAT wired to PropertyTax; finance refunds tab;
#   dropdown/i18n/finance polish from release/1.3.10 working tree.
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:c36554fa82897e1911f6e0574df07a014748d9944dafcfb3c968d22dc83b0dd9

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
