# Production overlay.
# Deploy: kubectl apply -k stayledger-admin-web/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote staging-verified admin-web tip — staging-73179a09, healthy on
# HK-HUB staging 2026-08-20 (release/1.3.6 @ 73179a0):
#   UI/UX review fixes — localize 403 toasts (VI), reports PermissionLimitedState,
#   AI Ops remove beta + humanize quota source, unify DD-MM-YYYY dates, checked-out
#   contrast, toast vs FAB, guest-name truncate, locale percent separators.
# Pin digest (not floating tag) to match staging's convention.
images:
  - name: putin111/stayledger-admin-web
    digest: sha256:c30dbf0407904d8a23b07888c1d832a3fab65da3bdecb54e0b26cec72ad227e8

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/service-clusterip.yaml
    target:
      kind: Service
      name: stayledger-admin-web
  - path: patches/deployment-production.yaml
