---
# Dedicated ServiceAccount with no auto-mounted token.
# The Next.js frontend has no need to call the Kubernetes API — mounting the
# default service account token is pure attack surface with no benefit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stayledger-admin-web
  labels:
    app: stayledger-admin-web
    component: frontend
    environment: overlay
automountServiceAccountToken: false
