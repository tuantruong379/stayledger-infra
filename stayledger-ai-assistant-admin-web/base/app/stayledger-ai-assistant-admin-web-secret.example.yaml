# Template for stayledger-ai-assistant-admin-web-secrets.
# Copy to stayledger-ai-assistant-admin-web-secret.yaml, fill values, then:
#   kubectl apply -f k8s/onprem/stayledger-ai-assistant-admin-web-secret.yaml
# The real file is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: stayledger-ai-assistant-admin-web-secrets
  namespace: stayledger-ai-assistant
  labels:
    app.kubernetes.io/name: stayledger-ai-assistant-admin-web
    app.kubernetes.io/part-of: stayledger-ai-assistant
type: Opaque
stringData:
  # PostgreSQL DSN for the Next.js /api/db/ping health check (server-side only).
  # Use the NodePort address since the frontend pod accesses Postgres via the cluster service.
  HOTEL_OPS_DSN: "postgresql://hotelassistant:YOUR_DB_PASSWORD@stayledger-ai-assistant-postgres:5432/hotel_ops"
