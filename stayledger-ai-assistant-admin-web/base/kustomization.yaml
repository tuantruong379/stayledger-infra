# Deploy: kubectl apply -k stayledger-ai-assistant-admin-web/base/
# Requires namespace/datastores from stayledger-ai-assistant-api (same ns).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-ai-assistant

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - app/stayledger-ai-assistant-admin-web-configmap.yaml
  - app/stayledger-ai-assistant-admin-web.yaml
  - scaling/admin-web-hpa.yaml
  - scaling/stayledger-ai-assistant-admin-web-pdb.yaml
  - security/network-policies/allow-admin-web-egress.yaml
  - security/network-policies/allow-admin-web-ingress.yaml

# Apply secrets separately (do not commit real secrets):
#   app/stayledger-ai-assistant-admin-web-secret.example.yaml → stayledger-ai-assistant-admin-web-secret.yaml

images:
  - name: putin111/stayledger-ai-assistant-admin-web
    newName: putin111/stayledger-ai-assistant-admin-web
    newTag: "latest"
