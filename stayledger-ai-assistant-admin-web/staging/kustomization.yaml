# Staging overlay - NodePort UI via Cloudflare -> node port 30081
#   UI: https://stg-assistant.stayledger.io
#
# Deploy (after API base secrets + API overlay):
#   kubectl apply -k stayledger-ai-assistant-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-ai-assistant

resources:
  - ../base

patches:
  - path: admin-web-configmap-patch.yaml
  - path: admin-web-hpa-oom-mitigation-patch.yaml
  - path: scaling-admin-web-patch.yaml

# Tag: 941cf3e (browserslist CVE fix, package-lock.json sync, CI image renamed
# putin111/ai-hotel-assistant-frontend -> putin111/stayledger-ai-assistant-admin-web
# to match this deployment, Dockerfile openssl CVE fix)
#
# Tag: 2148ee5 -- login_db_unavailable's hint only named STAYLEDGER_AI_DSN; the
# deployed staging config resolves the DSN via HOTEL_OPS_DSN instead (confirmed
# live on the ai-assistant-api pod), so the hint sent anyone troubleshooting a
# staging DB error looking for an env var that isn't actually set there. Message
# now names both.
#
# Tag: 362bf61 -- KB publish-readiness panel review (azure_bay_danang live capture):
# retrieval-eval gate read "0/0 Chưa chạy" directly above a 100%-scored eval-metrics
# card for the same evaluation (gate used evaluation_slices, metrics used the
# separate latest_evaluation; empty slices now fall back to latest_evaluation).
# Also deduped the activity banner's repeated activity text, and added a hint
# clarifying a high score next to "Blocked" is gate-completion progress, not the
# publish verdict.
images:
  - name: putin111/stayledger-ai-assistant-admin-web
    newName: putin111/stayledger-ai-assistant-admin-web
    digest: sha256:49bb9f6a2fc7926252f352b5906508291dba8095548a41ae7dec7c9a537bf227
