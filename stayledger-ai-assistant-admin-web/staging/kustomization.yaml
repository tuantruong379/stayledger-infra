# Staging overlay - NodePort UI via Cloudflare -> node port 30081
#   UI: https://stg-assistant.stayledger.io
#
# Deploy (after API base secrets + API overlay):
#   kubectl apply -k stayledger-ai-assistant-admin-web/staging/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-ai-assistant

resources:
  - ../base

patches:
  - path: admin-web-configmap-patch.yaml
  - path: admin-web-hpa-oom-mitigation-patch.yaml
  - path: scaling-admin-web-patch.yaml

# Tag: staging-ec80cd5 (operator guidance for non-patchable eval failures)
images:
  - name: putin111/stayledger-ai-assistant-admin-web
    newName: putin111/stayledger-ai-assistant-admin-web
    digest: sha256:68610b6f96b8baaab53dd09028b34a13b30e793bc6c7ee5b8927b4d2c431ab98
