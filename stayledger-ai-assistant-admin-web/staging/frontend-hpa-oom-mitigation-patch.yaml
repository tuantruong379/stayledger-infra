# Frontend HPA/OOM mitigation (staging).
#
# Incident 2026-07-23T06:44Z (HK-HUB-Cluster / stayledger-ai-assistant):
#   - HPA scaled frontend 1→2 because CPU utilization of a 50m request exceeded 70%
#     at a tiny absolute CPU (~35m+).
#   - Second pod OOMKilled (exit 137) during cold start while rewriting baked
#     NEXT_PUBLIC_API_BASE_URL across /.next (memory spike under concurrent start).
#   - Live-only restore set maxReplicas=1; this patch persists desired state.
#
# Temporary control: maxReplicas=1 until right-sized requests + scale/reconcile
# proofs allow raising the cap. Raising CPU/memory requests reduces false HPA
# scale-ups and startup OOM risk; max=1 is not claimed as the root-cause fix alone.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hotel-assistant-frontend
  namespace: stayledger-ai-assistant
spec:
  minReplicas: 1
  maxReplicas: 1
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-assistant-frontend
  namespace: stayledger-ai-assistant
spec:
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
