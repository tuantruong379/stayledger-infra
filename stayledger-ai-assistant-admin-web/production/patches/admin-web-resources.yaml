# CAP-01: honest frontend CPU request so HPA % is not inflated by a 50m request.
# Keeps maxReplicas=2; raises request so KubeHpaMaxedOut is less noisy on idle SSR.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-assistant-admin-web
  namespace: stayledger-ai-assistant
spec:
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
