# Shared StayLedger API manifests ΓÇö apply via staging/ or production/ overlay.
# Staging includes migration-job.yaml in the overlay kustomization so `images:`
# keeps migrate + API + worker in lockstep. Always: delete job, then apply -k.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - hpa.yaml
  - deployment.yaml
  - ai-worker-deployment.yaml
  - guest-documents-pvc.yaml
  - document-backup-offnode-cronjob.yaml
  - ai-worker-servicemonitor.yaml
  - api-servicemonitor.yaml
