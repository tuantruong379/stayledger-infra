# MON-2: scrape the AI worker's /api/metrics so worker-side AI metrics are collected
# (ai_first_token_ms, ai_worker_inflight, ai_worker_failed_jobs_total, ai_stream_*).
# Operator-native (the kube-prometheus-stack Prometheus has serviceMonitorSelector={} and a
# namespaceSelector including stayledger-staging), so this takes effect WITHOUT a helm upgrade.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: stayledger-ai-worker
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: stayledger-ai-worker
  endpoints:
    - port: http
      path: /api/metrics
      interval: 15s
