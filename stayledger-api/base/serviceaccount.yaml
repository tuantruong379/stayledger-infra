---
# Dedicated ServiceAccount with no auto-mounted token.
# The API has no need to call the Kubernetes API server — mounting the default
# service account token is pure attack surface with zero benefit.
#
# Note for first-time ArgoCD sync: this ServiceAccount is a regular (non-hook)
# resource and will be created during the sync, AFTER the migration PreSync job
# runs. On the very first deploy, the migration-job uses the default SA.
# On all subsequent deploys, this SA already exists when the migration-job runs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stayledger-api
  labels:
    app: stayledger-api
    component: backend
    environment: overlay
automountServiceAccountToken: false
