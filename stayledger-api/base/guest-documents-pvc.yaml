---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: stayledger-staging-guest-documents-pv
  labels:
    type: local
    app: stayledger-api
    component: guest-documents
    environment: overlay
spec:
  storageClassName: local-storage-hub-master-staging
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/data/stayledger-staging/guest-documents
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - hkk8s-hub-master
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stayledger-guest-documents
  labels:
    app: stayledger-api
    component: guest-documents
    environment: overlay
spec:
  storageClassName: local-storage-hub-master-staging
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
