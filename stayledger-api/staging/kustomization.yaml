# Staging overlay — NodePort + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-api/staging/
# Migration (one-shot): kubectl apply -f ../base/migration-job.yaml -n stayledger-staging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Staging rebuild 2026-07-24 — frozen source 47cf20a (incl. 3cbde99 CVE overrides + quota/auth unit gates).
# Digest: sha256:4ed8c8533f7a60afbf4d1feca8bcf68087c129001d93b6acfa3fdba3e1dbdc35
# SBOM SPDX sha256: a7f0ee38b592522c275d444ac879707d625f2ce5bbc2f69d4d43339d1590010c
# Trivy HIGH/CRITICAL (ignore-unfixed): 0
images:
  - name: putin111/stayledger-api
    digest: sha256:4ed8c8533f7a60afbf4d1feca8bcf68087c129001d93b6acfa3fdba3e1dbdc35

patches:
  - path: patches/deployment-staging.yaml
  - path: patches/ai-worker-staging.yaml
  - path: patches/hpa-staging.yaml
  # 22:30 VN + SES notify sidecar (base CronJob has neither).
  - path: patches/document-backup-offnode-cronjob.yaml
