# Staging overlay - NodePort + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-api/staging/
# Migration (one-shot): kubectl apply -f stayledger-api/staging/migration-job.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Guest chat Assistant bootstrap + chip ids — 2026-08-13
# API commit 74a6664 (release/1.3.1)
# Tag: staging-74a6664
# Digest: sha256:ab1543feff1b39b09db976444a5194dc0b110804ea1f3854e42ba05fc8d91d57
images:
  - name: putin111/stayledger-api
    digest: sha256:ab1543feff1b39b09db976444a5194dc0b110804ea1f3854e42ba05fc8d91d57

patches:
  - path: patches/deployment-staging.yaml
  - path: patches/ai-worker-staging.yaml
  - path: patches/hpa-staging.yaml
  # 22:30 VN + SES notify sidecar (base CronJob has neither).
  - path: patches/document-backup-offnode-cronjob.yaml
