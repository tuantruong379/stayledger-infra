# Staging overlay - NodePort + Cloudflare TLS edge.
#
# ALWAYS deploy via kustomize so API + ai-worker + migrate share one `images:` pin:
#   kubectl config use-context HK-HUB-Cluster
#   kubectl delete job stayledger-db-migrate -n stayledger-staging --ignore-not-found
#   kubectl apply -k stayledger-api/staging/
#   kubectl wait --for=condition=complete job/stayledger-db-migrate -n stayledger-staging --timeout=300s
#   kubectl rollout status deployment/stayledger-api -n stayledger-staging
#
# Do NOT `kubectl set image` / apply migration-job.yaml alone — that drifts migrate
# from API (billingPeriodKey 500, Aug 2026).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml
  # Included so `images:` rewrites migrate + API + worker together. Job is
  # immutable: delete it before each apply -k (see header).
  - migration-job.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Pin digest (not floating tag) so migrate + API + ai-worker stay on one image.
# Built from release/1.3.4 @ f50fc18 (properly committed + pushed to origin,
# not an ad-hoc worktree patch like the prior staging-dashboard-singleflight-fix
# build was):
#   1) AiDraftsController @PropertyAccess() fix — PropertyAccessGuard was a
#      no-op on that controller (missing decorator meant getAllAndOverride
#      returned undefined and the guard short-circuited to `return true`),
#      letting any ai:drafts:read holder read/create/approve/reject AI drafts
#      for ANY property, not just their own. CONFIRMED still missing on
#      production (context `stayledger`) as of 2026-08-17 — this staging
#      deploy is step 2 of a staging-verify-then-promote-to-prod plan.
#   2) CacheService.withSingleFlight() + GM dashboard using it (unchanged
#      from the prior build — see git history for detail).
# Tag: staging-f50fc18
images:
  - name: putin111/stayledger-api
    digest: sha256:2cb7eee638b1563d7fda0bd7db0a2e56817dd19e8870567c9603a3fee4237687

patches:
  - path: patches/deployment-staging.yaml
  - path: patches/ai-worker-staging.yaml
  - path: patches/hpa-staging.yaml
  # 22:30 VN + SES notify sidecar (base CronJob has neither).
  - path: patches/document-backup-offnode-cronjob.yaml
