# Staging overlay — NodePort + Cloudflare TLS edge.
# Deploy: kubectl apply -k stayledger-api/staging/
# Migration (one-shot): kubectl apply -f ../base/migration-job.yaml -n stayledger-staging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger-staging

resources:
  - ../base
  - configmap.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false

# Cycle 6c — PD-OCC-01 occupancy fail-closed (79170bd).
# Digest: sha256:acd041c5e882b0016f185485353c2ea64c6ee17a83503ff0f2106f2b52ac1516
images:
  - name: putin111/stayledger-api
    digest: sha256:acd041c5e882b0016f185485353c2ea64c6ee17a83503ff0f2106f2b52ac1516

patches:
  - path: patches/deployment-staging.yaml
  - path: patches/ai-worker-staging.yaml
  - path: patches/hpa-staging.yaml
  # 22:30 VN + SES notify sidecar (base CronJob has neither).
  - path: patches/document-backup-offnode-cronjob.yaml
