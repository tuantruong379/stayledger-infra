# Staging-specific deployment overrides (CORS, version label, RS retention).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-api
spec:
  # Cap stale ReplicaSet history (default 10 left many scaled-to-0 RS in staging).
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        # Preserve live label to avoid template-hash restart when only RS retention changes.
        version: "score90-20260720"
    spec:
      containers:
        - name: api
          env:
            - name: ALLOWED_ORIGINS
              # Include staging landing so browser POSTs to /api/marketing/demo-requests succeed.
              value: "https://stg-app.stayledger.io,https://stg.stayledger.io,http://10.89.1.40:30010,http://10.89.1.40:30012"
            # Guest Chat PMS-web BFF (RS256 context JWT signing + aggregate import
            # auth). This wiring existed live-only on staging until 2026-08-18
            # (added imperatively at some point, never committed) — captured here
            # so a Deployment recreated from git doesn't silently lose it. Not
            # deployed to production; feature currently dormant (no live traffic
            # exercises it yet).
            - name: PMS_WEB_CHAT_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: PMS_WEB_CHAT_JWT_PRIVATE_KEY
            - name: PMS_WEB_CHAT_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: PMS_WEB_CHAT_JWT_PUBLIC_KEY
            - name: GUEST_CHAT_AGGREGATE_IMPORT_KEY
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: GUEST_CHAT_AGGREGATE_IMPORT_KEY
            # Live secret leftover must not win over overlay SoT (non-secret cluster DNS).
            - name: AI_ASSISTANT_INTERNAL_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: stayledger-api-config
                  key: AI_ASSISTANT_INTERNAL_BASE_URL
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "50Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
              ephemeral-storage: "200Mi"
