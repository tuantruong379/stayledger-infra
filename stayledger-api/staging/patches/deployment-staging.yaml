# Staging-specific deployment overrides (CORS, version label).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-api
spec:
  template:
    metadata:
      labels:
        version: "staging-1d42f5c4"
    spec:
      containers:
        - name: api
          env:
            - name: ALLOWED_ORIGINS
              value: "https://stg-app.stayledger.io,http://10.89.1.40:30010"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "50Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
              ephemeral-storage: "200Mi"
