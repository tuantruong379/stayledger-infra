apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-worker
spec:
  # Single-node staging: one worker is enough; avoids double CPU/memory.
  replicas: 1
  # Cap stale ReplicaSet history alongside API (Cycle 10 staging hygiene).
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        # Match API/worker image pin (tag 192294f / release/1.4.9).
        version: "192294f"
