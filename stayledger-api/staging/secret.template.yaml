# secret.template.yaml — Documents all required keys in stayledger-staging-secrets.
# DO NOT commit this file with real values. Use generate-secrets.ps1 to create the actual secret.
apiVersion: v1
kind: Secret
metadata:
  name: stayledger-staging-secrets
  namespace: stayledger-staging
type: Opaque
stringData:
  database-url: "postgresql://stayledger:PASSWORD@stayledger-pgbouncer.stayledger-staging.svc.cluster.local:5432/stayledger?schema=public&pgbouncer=true&connection_limit=5&pool_timeout=10&statement_timeout=30000"
  direct-database-url: "postgresql://stayledger:PASSWORD@stayledger-postgres.stayledger-staging.svc.cluster.local:5432/stayledger?schema=public&connection_limit=2&statement_timeout=60000"
  postgres-password: "REPLACE_WITH_POSTGRES_PASSWORD"
  jwt-secret: "REPLACE_WITH_64_PLUS_CHAR_SECRET"
  jwt-refresh-secret: "REPLACE_WITH_64_PLUS_CHAR_SECRET"
  csrf-secret: "REPLACE_WITH_64_PLUS_CHAR_SECRET"
  encryption-key: "REPLACE_WITH_64_HEX_CHARS"
  document-encryption-key: "REPLACE_WITH_64_HEX_CHARS"
  document-backup-password: "REPLACE_WITH_STRONG_PASSPHRASE"
  redis-password: "REPLACE_IF_REDIS_PASSWORD_ENABLED"
  redis-url: "redis://:PASSWORD@stayledger-redis.stayledger-staging.svc.cluster.local:6379"
  azure-openai-endpoint: "https://YOUR_RESOURCE.cognitiveservices.azure.com"
  azure-openai-api-key: "REPLACE_WITH_AZURE_OPENAI_KEY"
  openai-base-url: "https://YOUR_RESOURCE.cognitiveservices.azure.com/openai/v1"
  external-signing-enc-key: "REPLACE_WITH_64_HEX_CHARS"
  frontend-url: "https://stg-app.stayledger.io"
  smtp-user: "REPLACE_WITH_SES_ACCESS_KEY_ID"
  smtp-password: "REPLACE_WITH_SES_SECRET_ACCESS_KEY"
  metrics-auth-token: "REPLACE_WITH_METRICS_BEARER_TOKEN"
  AWS_ACCESS_KEY_ID: "REPLACE_FOR_DOCUMENT_BACKUP"
  AWS_SECRET_ACCESS_KEY: "REPLACE_FOR_DOCUMENT_BACKUP"
