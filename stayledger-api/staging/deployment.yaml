---
# ConfigMap is in configmap.yaml — kept separate to avoid S6907 linter warnings
# when the ConfigMap definition and its envFrom consumer share the same file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-api
  namespace: stayledger-staging
  labels:
    app: stayledger-api
    component: backend
    environment: staging
spec:
  # 2 replicas: enables zero-downtime rolling updates and tolerates a single
  # pod failure or node drain without downtime.
  replicas: 2
  selector:
    matchLabels:
      app: stayledger-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take a pod out of rotation before the replacement is ready.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: stayledger-api
        component: backend
        environment: staging
        # version is updated by CI at deploy time — enables version filtering
        # in Grafana dashboards and Loki log queries.
        version: "staging-bca8c02"
      annotations:
        # Prometheus scraping — matches the NestJS prom-client /metrics path.
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: stayledger-api
      # The API has no need to call the Kubernetes API server — suppress the
      # auto-mounted service account token to reduce the attack surface.
      automountServiceAccountToken: false
      # 60s: NestJS shutdown + BullMQ job drain + keep-alive connections.
      # Must be greater than the preStop sleep + app shutdown timeout combined.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes to survive a single node failure or drain.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: stayledger-api
      containers:
        - name: api
          # Tag is updated by CI deploy-staging step.
          image: putin111/stayledger-api:staging-bca8c02
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          lifecycle:
            # preStop sleep: gives kube-proxy time to remove this pod from
            # iptables rules before NestJS starts handling SIGTERM. Without this,
            # in-flight requests arriving during the 2–5s propagation window get
            # a connection reset on every rolling update.
            preStop:
              exec:
                command: ["sleep", "5"]
          envFrom:
            - configMapRef:
                name: stayledger-api-config
          env:
            - name: ALLOWED_ORIGINS
              value: "http://10.89.1.40:30010"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: redis-url
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: redis-password
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: jwt-refresh-secret
            # 1B.2: AES-256-GCM key encrypting external API signing secrets at rest.
            # REQUIRED because EXTERNAL_API_SIGNATURE_REQUIRED=true — without it the
            # server cannot provision/verify signing secrets and external calls 401.
            # Create the secret value with: openssl rand -hex 32
            - name: EXTERNAL_SIGNING_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: external-signing-enc-key
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: azure-openai-endpoint
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: azure-openai-api-key
            - name: METRICS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: metrics-auth-token
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: smtp-host
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: smtp-port
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: smtp-user
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: smtp-password
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: smtp-from
                  optional: true
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: stayledger-staging-secrets
                  key: frontend-url
          resources:
            requests:
              # 200m: NestJS idle is ~50m; 200m covers startup burst and avoids
              # CPU throttling during the initial NestJS + Prisma bootstrap phase.
              cpu: "200m"
              memory: "256Mi"
              ephemeral-storage: "50Mi"
            limits:
              cpu: "1000m"
              # 768Mi covers steady-state NestJS + pdfkit + BullMQ.
              # The previous 1536Mi limit was generous enough to mask memory leaks —
              # keep this tighter and raise only if OOMKilled events appear.
              memory: "768Mi"
              ephemeral-storage: "200Mi"
          startupProbe:
            httpGet:
              path: /api/live
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            # 10 + (12 × 5) = 70s max startup window
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/live
              port: 3001
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 3001
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # uploads: emptyDir is acceptable for staging (demo data only).
            # Production: replace with a PVC (RWX) or redirect to object storage.
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
# ClusterIP service — internal access only; NodePort below for direct staging access
apiVersion: v1
kind: Service
metadata:
  name: stayledger-api
  namespace: stayledger-staging
  labels:
    app: stayledger-api
    component: backend
    environment: staging
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
      name: http
  selector:
    app: stayledger-api

---
# NodePort for direct access (use Ingress in production-like staging)
apiVersion: v1
kind: Service
metadata:
  name: stayledger-api-nodeport
  namespace: stayledger-staging
  labels:
    app: stayledger-api
    component: backend
    environment: staging
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 3001
      nodePort: 30011
      protocol: TCP
      name: http
  selector:
    app: stayledger-api

# Migration Job has been moved to migration-job.yaml.
# ArgoCD runs it as a PreSync hook before each deployment sync.
