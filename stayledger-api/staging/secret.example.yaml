# secret.example.yaml — Copy to secret.yaml (gitignored) and fill values locally.
# Apply: kubectl apply -f secret.yaml -n stayledger-staging
apiVersion: v1
kind: Secret
metadata:
  name: stayledger-staging-secrets
  namespace: stayledger-staging
type: Opaque
stringData:
  database-url: "__SECRET_REF:DATABASE_URL__"
  direct-database-url: "__SECRET_REF:DIRECT_DATABASE_URL__"
  postgres-password: "__SECRET_REF:POSTGRES_PASSWORD__"
  jwt-secret: "__SECRET_REF:JWT_SECRET__"
  jwt-refresh-secret: "__SECRET_REF:JWT_REFRESH_SECRET__"
  redis-url: "__SECRET_REF:REDIS_URL__"
  azure-openai-endpoint: "__SECRET_REF:AZURE_OPENAI_ENDPOINT__"
  azure-openai-api-key: "__SECRET_REF:AZURE_OPENAI_API_KEY__"
  frontend-url: "https://stg-app.stayledger.io"
  smtp-user: "__SECRET_REF:SES_SMTP_USERNAME__"
  smtp-password: "__SECRET_REF:SES_SMTP_PASSWORD__"
  external-signing-enc-key: "__SECRET_REF:EXTERNAL_SIGNING_ENC_KEY__"
  metrics-auth-token: "__SECRET_REF:METRICS_AUTH_TOKEN__"
  turnstile-secret-key: "__SECRET_REF:TURNSTILE_SECRET_KEY__"
  # Guest Chat PMS-web BFF + document-backup-password: see secret.template.yaml
