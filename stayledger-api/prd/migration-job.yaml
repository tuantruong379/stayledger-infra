---
# DB Migration Job — run before each production deployment
# Usage:
#   kubectl delete job stayledger-db-migrate -n stayledger --ignore-not-found
#   sed "s|<IMAGE_TAG>|<GIT_SHA>|g" k8s/prd/migration-job.yaml | kubectl apply -f -
#   kubectl wait --for=condition=complete job/stayledger-db-migrate -n stayledger --timeout=120s
apiVersion: batch/v1
kind: Job
metadata:
  name: stayledger-db-migrate
  namespace: stayledger
  labels:
    app: stayledger-api
    component: migration
    environment: production
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        # Use same image tag as the deployment being rolled out
        image: putin111/stayledger-api:<IMAGE_TAG>
        imagePullPolicy: Always
        command: ["/app/node_modules/.bin/prisma", "migrate", "deploy", "--schema=/app/prisma/schema.prisma"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop: [ALL]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: database-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
