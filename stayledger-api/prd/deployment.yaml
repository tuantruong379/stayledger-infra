---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stayledger-api-config
  namespace: stayledger
  labels:
    app: stayledger-api
    component: backend
    environment: production
data:
  NODE_ENV: "production"
  PORT: "3001"
  REDIS_HOST: "stayledger-redis"
  REDIS_PORT: "6379"
  ALLOWED_ORIGINS: "https://stayledger.tekcent.com"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  LOG_LEVEL: "warn"
  APP_ENV: "production"
  THROTTLE_STORAGE: "redis"
  SWAGGER_ENABLED: "false"
  METRICS_ENABLED: "true"
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: "stayledger-api"
  AI_PROVIDER: "azure_openai"
  AI_MODEL: "gpt-4o-mini"
  AI_METERING_MODE: "enforce"
  AI_QUOTA_ALERT_EMAIL_ENABLED: "true"
  AI_DAILY_SUMMARY_EMAIL_ENABLED: "false"
  AI_DAILY_SUMMARY_LLM: "false"
  AI_REQUEST_TIMEOUT_MS: "30000"
  AI_EMBEDDING_PROVIDER: "azure"
  AI_EMBEDDING_MODEL: "text-embedding-3-small"
  AI_EMBEDDING_DIMENSIONS: "1536"
  AI_EMBEDDING_BATCH_SIZE: "32"
  AI_EMBEDDING_SYNC: "true"
  AI_RAG_CHUNK_SIZE: "800"
  AI_RAG_CHUNK_OVERLAP: "120"
  AZURE_OPENAI_DEPLOYMENT: "gpt-4o-mini"
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
  AI_REVENUE_ENABLED: "true"
  AI_REVENUE_NARRATIVE_LLM: "false"
  AI_AUTOMATION_ENABLED: "true"
  AI_AUTOMATION_EXECUTION_ENABLED: "true"
  AI_AUTOMATION_EXECUTION_MODE: "manual_record_only"
  AI_AUTOMATION_NARRATIVE_LLM: "false"
  AI_AUTOMATION_E2E_SEED: "false"
  AI_SAAS_OPS_ENABLED: "true"
  AI_SECURITY_FINDINGS_ENABLED: "true"
  AI_OPS_NARRATIVE_LLM: "false"
  AI_SAAS_OPS_E2E_SEED: "false"
  EXTERNAL_API_REPLAY_REQUIRED: "false"
  EXTERNAL_API_CONTRACT_VERSION: "1.0.0"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-api
  namespace: stayledger
  labels:
    app: stayledger-api
    component: backend
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stayledger-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: stayledger-api
        component: backend
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/api/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        # The same image artifact works for any environment; all configuration
        # comes from the ConfigMap and Secrets above (nothing is baked into the binary).
        # Deploy: kubectl set image deployment/stayledger-api api=putin111/stayledger-api:<GIT_SHA> -n stayledger
        image: putin111/stayledger-api:7e71496
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop: [ALL]
        envFrom:
        - configMapRef:
            name: stayledger-api-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: redis-url
              optional: true
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: redis-password
              optional: true
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: jwt-secret
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: jwt-refresh-secret
        - name: AZURE_OPENAI_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: azure-openai-endpoint
        - name: AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: azure-openai-api-key
        - name: METRICS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: metrics-auth-token
              optional: true
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: smtp-host
              optional: true
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: smtp-port
              optional: true
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: smtp-user
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: smtp-password
              optional: true
        - name: SMTP_FROM
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: smtp-from
              optional: true
        - name: FRONTEND_URL
          valueFrom:
            secretKeyRef:
              name: stayledger-secrets
              key: frontend-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/live
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/live
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: stayledger-api-uploads
      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stayledger-api-uploads
  namespace: stayledger
  labels:
    app: stayledger-api
    component: uploads
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: stayledger-api
  namespace: stayledger
  labels:
    app: stayledger-api
    component: backend
    environment: production
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 3001
    nodePort: 30001
    protocol: TCP
    name: http
  selector:
    app: stayledger-api
