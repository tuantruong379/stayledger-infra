---
# HPA capped at maxReplicas: 1 — enforced by the RWO guest-documents PVC.
# Raise maxReplicas and remove this comment after migrating to RWX/object storage.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stayledger-api
  namespace: stayledger
  labels:
    app: stayledger-api
    component: backend
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stayledger-api
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
