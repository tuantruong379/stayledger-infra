# secret.example.yaml — Committable template. Copy to secret.yaml to fill real values.
# Apply: kubectl apply -f secret.yaml
#
# Nest reads EXTERNAL_SIGNING_ENC_KEY for at-rest crypto (not encryption-key /
# document-encryption-key). CSRF is double-submit cookie (no CSRF_SECRET).
# Legacy keys may still exist in the live Secret — harmless if unused.
---
apiVersion: v1
kind: Secret
metadata:
  name: stayledger-secrets
  namespace: stayledger
type: Opaque
stringData:
  database-url: "postgresql://stayledger:REPLACE_WITH_URLENCODED_POSTGRES_PASSWORD@stayledger-pgbouncer.stayledger.svc.cluster.local:5432/stayledger?schema=public&pgbouncer=true&connection_limit=20&pool_timeout=10&statement_timeout=30000"
  direct-database-url: "postgresql://stayledger:REPLACE_WITH_URLENCODED_POSTGRES_PASSWORD@stayledger-postgres.stayledger.svc.cluster.local:5432/stayledger?schema=public&connection_limit=2&statement_timeout=60000"
  postgres-password: "REPLACE_WITH_POSTGRES_PASSWORD"
  jwt-secret: "REPLACE_WITH_64_PLUS_CHAR_SECRET"
  jwt-refresh-secret: "REPLACE_WITH_64_PLUS_CHAR_SECRET_DIFFERENT_FROM_JWT"
  redis-password: "REPLACE_WITH_REDIS_PASSWORD"
  redis-url: "redis://:REPLACE_WITH_REDIS_PASSWORD@stayledger-redis.stayledger.svc.cluster.local:6379"
  azure-openai-endpoint: "https://REPLACE_WITH_RESOURCE.cognitiveservices.azure.com"
  azure-openai-api-key: "REPLACE_WITH_AZURE_OPENAI_KEY"
  external-signing-enc-key: "REPLACE_WITH_64_HEX_CHARS"
  document-backup-password: "REPLACE_WITH_DOCUMENT_BACKUP_PASSWORD"
  frontend-url: "https://app.stayledger.io"
  smtp-user: "REPLACE_WITH_SES_ACCESS_KEY_ID"
  smtp-password: "REPLACE_WITH_SES_SECRET_ACCESS_KEY"
  metrics-auth-token: "REPLACE_WITH_METRICS_BEARER_TOKEN"
  turnstile-secret-key: "REPLACE_WITH_TURNSTILE_SECRET_KEY"
