apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-api
spec:
  # Steady-state 1 (RWO guest-docs). RollingUpdate maxUnavailable:0 + maxSurge:1
  # (from base) keeps the old Ready pod serving until the surge pod is Ready.
  replicas: 1
  minReadySeconds: 15
  # Best practice: cap rollback history in production (was unset -> live drifted to 3 via ad-hoc patch).
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        # Match kustomization images pin (tag c9d0e47 / release/1.5.0).
        version: "c9d0e47"
      annotations:
        stayledger.io/git-sha: "c9d0e47"
        stayledger.io/branch: "release/1.5.0"
        kubernetes.io/change-cause: "Promote API c9d0e47: optional guest last name, dependency CVE patches, uploads on PVC"
    spec:
      containers:
        - name: api
          # Single replica (RWO guest-docs) — give this pod more CPU than landing.
          # Request 350m / limit 1 CPU so API wins scheduling vs marketing site.
          # ALLOWED_ORIGINS + FRONTEND_URL come from stayledger-api-config (envFrom).
          resources:
            requests:
              cpu: "350m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
