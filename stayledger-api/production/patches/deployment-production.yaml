apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-api
spec:
  # Steady-state 1 (RWO guest-docs). RollingUpdate maxUnavailable:0 + maxSurge:1
  # (from base) keeps the old Ready pod serving until the surge pod is Ready.
  replicas: 1
  minReadySeconds: 15
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        version: "f1b2e27"
    spec:
      containers:
        - name: api
          env:
            - name: ALLOWED_ORIGINS
              value: "https://app.stayledger.io"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: guest-documents
              mountPath: /var/lib/stayledger/guest-documents
      volumes:
        - name: guest-documents
          persistentVolumeClaim:
            claimName: stayledger-guest-documents
