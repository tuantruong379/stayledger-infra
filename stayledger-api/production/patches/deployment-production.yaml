apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-api
spec:
  # Steady-state 1 (RWO guest-docs). RollingUpdate maxUnavailable:0 + maxSurge:1
  # (from base) keeps the old Ready pod serving until the surge pod is Ready.
  replicas: 1
  minReadySeconds: 15
  # Best practice: cap rollback history in production (was unset -> live drifted to 3 via ad-hoc patch).
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        version: "6764d49"
      annotations:
        stayledger.io/git-sha: "6764d49"
        stayledger.io/branch: "release/1.3.5"
        kubernetes.io/change-cause: "Promote API 6764d49 — MarketingModule + Turnstile 2026-08-22"
    spec:
      containers:
        - name: api
          env:
            - name: ALLOWED_ORIGINS
              # PMS admin + public marketing site (demo form → /api/marketing/demo-requests).
              value: "https://app.stayledger.io,https://stayledger.io,https://www.stayledger.io"
          # Single replica (RWO guest-docs) — give this pod more CPU than landing.
          # Request 350m / limit 1 CPU so API wins scheduling vs marketing site.
          resources:
            requests:
              cpu: "350m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          volumeMounts:
            - name: guest-documents
              mountPath: /var/lib/stayledger/guest-documents
      volumes:
        - name: guest-documents
          persistentVolumeClaim:
            claimName: stayledger-guest-documents
