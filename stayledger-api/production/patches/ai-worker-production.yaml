apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-worker
spec:
  replicas: 1
  # Best practice: cap rollback history in production (was unset -> live drifted to 3 via ad-hoc patch).
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        version: "c9d0e47"
      annotations:
        stayledger.io/git-sha: "c9d0e47"
        stayledger.io/branch: "release/1.5.0"
    spec:
      containers:
        - name: ai-worker
          # Idle CPU ~7m; memory sits ~421Mi — keep mem, hard-cap CPU at 500m.
          resources:
            requests:
              cpu: "100m"
              memory: "768Mi"
            limits:
              cpu: "500m"
              memory: "1536Mi"
