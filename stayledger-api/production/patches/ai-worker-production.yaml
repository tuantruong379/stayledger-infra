apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-worker
spec:
  replicas: 1
  template:
    metadata:
      labels:
        version: "f1b2e27"
    spec:
      containers:
        - name: ai-worker
          # Idle CPU was ~8m with 500m request; memory sits ~472Mi so keep
          # memory request near observed usage with modest headroom.
          resources:
            requests:
              cpu: "200m"
              memory: "768Mi"
            limits:
              cpu: "1"
              memory: "1536Mi"
