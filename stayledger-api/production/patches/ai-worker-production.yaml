apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-ai-worker
spec:
  replicas: 1
  template:
    metadata:
      labels:
        version: "sha-PLACEHOLDER"
    spec:
      containers:
        - name: ai-worker
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
