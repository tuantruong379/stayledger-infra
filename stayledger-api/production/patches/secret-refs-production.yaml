# Replace staging secret name with production secret across API workloads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayledger-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: redis-url
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: redis-password
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: jwt-refresh-secret
            # CSRF_SECRET / ENCRYPTION_KEY / DOCUMENT_ENCRYPTION_KEY removed 2026-08-22 —
            # Nest never reads them (CSRF is double-submit cookie; at-rest crypto uses
            # EXTERNAL_SIGNING_ENC_KEY only). Legacy keys may still exist in the Secret object.
            - name: EXTERNAL_SIGNING_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: external-signing-enc-key
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: azure-openai-endpoint
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: azure-openai-api-key
            - name: METRICS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: metrics-auth-token
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: smtp-user
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: smtp-password
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: frontend-url
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stayledger-secrets
                  key: turnstile-secret-key
                  optional: true
