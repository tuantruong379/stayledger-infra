# Production overlay — apply after datastores and secrets.
# Deploy: kubectl apply -k stayledger-api/production/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayledger

resources:
  - ../base
  - namespace.yaml
  - configmap.yaml
  - ingress.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

# Promote staging-verified API tip — staging-f50fc18, verified healthy on
# HK-HUB staging 2026-08-17 (release/1.3.4 @ f50fc18):
#   1) AiDraftsController @PropertyAccess() fix — closes a live property-access
#      bypass on AI drafts (PropertyAccessGuard was a silent no-op without it).
#      Confirmed present via `grep PropertyAccess` on the staging pod before
#      promoting here.
#   2) CacheService.withSingleFlight() on the GM dashboard's query fan-out.
# No new Prisma migrations in this commit — schema unchanged, no migrate-job
# run needed for this promotion.
images:
  - name: putin111/stayledger-api
    digest: sha256:2cb7eee638b1563d7fda0bd7db0a2e56817dd19e8870567c9603a3fee4237687

patches:
  # Production uses ClusterIP + Traefik Ingress only (no NodePort).
  - path: patches/delete-api-nodeport.yaml
  - path: patches/delete-staging-guest-docs-pv.yaml
  - path: patches/deployment-production.yaml
  - path: patches/ai-worker-production.yaml
  - path: patches/secret-refs-production.yaml
  - path: patches/ai-worker-secret-refs-production.yaml
  - path: patches/guest-documents-pvc-production.yaml
  # Wired in 2026-08-17 — this file already existed correctly-authored in
  # this directory but was never referenced by kustomization.yaml, so
  # `kubectl apply -k` silently ignored it and live drifted from repo:
  #   - document-backup-offnode-cronjob.yaml: adds the notify-email sidecar +
  #     correct `production/guest-documents` S3 prefix (base has neither —
  #     base's CronJob/ConfigMap are staging-oriented defaults).
  - path: document-backup-offnode-cronjob.yaml
  # networkpolicy.yaml stays wired in — NOT redundant with base even after
  # completing the ai-assistant rename (Step 2, 2026-08-17): base and this
  # file diverged independently. base/networkpolicy.yaml has the correct
  # NEW ai-assistant label (from commit cbbaf08, matching staging's rename)
  # but is missing this file's OTEL-scoped-egress fix (adds observability:4318,
  # drops the unused port 587) made the same morning. This file now has BOTH
  # fixes (label updated to stayledger-ai-assistant-api once production's
  # ai-assistant was actually renamed; OTEL/587 change kept) — `kubectl diff -k`
  # verified empty against live after this update. If base ever gets the
  # OTEL/587 fix too, this override becomes safe to drop.
  - path: networkpolicy.yaml
