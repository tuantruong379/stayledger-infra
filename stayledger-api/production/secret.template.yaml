# secret.template.yaml — Documents all required keys in stayledger-secrets.
# DO NOT commit this file with real values. Use generate-secrets.ps1 to create the actual secret.
# Suffix .template.yaml avoids matching the **/*-secret.yaml gitignore pattern.
---
apiVersion: v1
kind: Secret
metadata:
  name: stayledger-secrets
  namespace: stayledger
type: Opaque
stringData:
  # ── Database ──────────────────────────────────────────────────────────────
  database-url: "postgresql://stayledger:PASSWORD@stayledger-pgbouncer.stayledger.svc.cluster.local:5432/stayledger?schema=public&pgbouncer=true&connection_limit=20&pool_timeout=10&statement_timeout=30000"
  direct-database-url: "postgresql://stayledger:PASSWORD@stayledger-postgres.stayledger.svc.cluster.local:5432/stayledger?schema=public&connection_limit=2&statement_timeout=60000"
  postgres-password: "REPLACE_WITH_POSTGRES_PASSWORD"

  # ── Auth ──────────────────────────────────────────────────────────────────
  jwt-secret: "REPLACE_WITH_64_PLUS_CHAR_SECRET"
  jwt-refresh-secret: "REPLACE_WITH_64_PLUS_CHAR_SECRET"

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis-password: "REPLACE_IF_REDIS_PASSWORD_ENABLED"
  redis-url: "redis://:PASSWORD@stayledger-redis.stayledger.svc.cluster.local:6379"

  # ── AI ────────────────────────────────────────────────────────────────────
  azure-openai-endpoint: "https://stayledger-resource.openai.azure.com"
  azure-openai-api-key: "REPLACE_WITH_AZURE_OPENAI_KEY"
  openai-base-url: "https://stayledger-resource.openai.azure.com/openai/v1"

  # ── External API signing (EXTERNAL_API_SIGNATURE_REQUIRED=true) ───────────
  # Generate: openssl rand -hex 32   (must be exactly 64 hex chars = 32 bytes)
  external-signing-enc-key: "REPLACE_WITH_64_HEX_CHARS"

  # ── Document encryption ───────────────────────────────────────────────────
  # Generate: openssl rand -hex 32   (must be exactly 64 hex chars = 32 bytes)
  encryption-key: "REPLACE_WITH_64_HEX_CHARS"

  # ── Document backup passphrase ─────────────────────────────────────────────
  # Generate: openssl rand -base64 48
  # Same value goes in stayledger-document-backup-s3.encryption-passphrase
  document-backup-password: "REPLACE_WITH_STRONG_PASSPHRASE"

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend-url: "https://app.stayledger.io"

  # ── Email (AWS SES SMTP credentials) ─────────────────────────────────────
  smtp-user: "REPLACE_WITH_SES_ACCESS_KEY_ID"
  smtp-password: "REPLACE_WITH_SES_SECRET_ACCESS_KEY"

  # ── Metrics ───────────────────────────────────────────────────────────────
  metrics-auth-token: "REPLACE_WITH_METRICS_BEARER_TOKEN"
