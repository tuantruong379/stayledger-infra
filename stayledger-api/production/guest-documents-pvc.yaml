---
# PVC for guest document storage (ID scans, passports, visas).
# storageClassName and volumeName must match storage.yaml.
# Prereq on node: mkdir -p /mnt/data/stayledger/guest-documents && chown 1001:1001 /mnt/data/stayledger/guest-documents
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stayledger-production-guest-documents
  namespace: stayledger
  labels:
    app: stayledger-api
    component: guest-documents
    environment: production
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage-stayledger
  volumeName: stayledger-production-guest-documents-pv
  resources:
    requests:
      storage: 40Gi
