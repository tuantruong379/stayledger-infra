---
# Prevent voluntary eviction of the sole API replica.
# With replicas: 1 (forced by RWO PVC), this ensures voluntary disruptions
# (node drain, upgrades) are blocked until the PVC constraint is resolved.
# Becomes a meaningful HA constraint when replicas is raised after object-storage migration.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stayledger-api-pdb
  namespace: stayledger
  labels:
    app: stayledger-api
    component: backend
    environment: production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: stayledger-api
